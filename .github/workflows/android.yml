name: Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Gradle Wrapper
        run: |
          cd client/android
          gradle wrapper
          chmod +x gradlew

      - name: Build Release APK (unsigned)
        run: |
          cd client/android
          ./gradlew assembleRelease
        env:
          MASTER_PASSWORD: ${{ secrets.MASTER_PASS }}
          SUPABASE_URL_A: ${{ secrets.SUPABASE_URL_A }}
          SUPABASE_KEY_A: ${{ secrets.SUPABASE_KEY_A }}

      - name: Decode Keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > my.keystore

      - name: Sign APK with jarsigner
        run: |
          APK_FILE=$(ls client/android/app/build/outputs/apk/release/*.apk | head -n1)
          # Create a temporary file for password (to avoid exposing in ps)
          echo "${{ secrets.KEY_STORE_PASSWORD }}" > keystore_pass.txt
          echo "${{ secrets.KEY_PASSWORD }}" > key_pass.txt
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore my.keystore \
            -storepass:file keystore_pass.txt \
            -keypass:file key_pass.txt \
            "$APK_FILE" "${{ secrets.KEY_ALIAS }}"
          # Verify signature
          jarsigner -verify "$APK_FILE"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Update-Signed
          path: client/android/app/build/outputs/apk/release/*.apk
