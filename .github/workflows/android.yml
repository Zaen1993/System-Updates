# .github/workflows/android.yml
name: Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Gradle Wrapper
        run: |
          cd client/android
          gradle wrapper
          chmod +x gradlew

      - name: Build Release APK (unsigned)
        run: |
          cd client/android
          ./gradlew assembleRelease
        env:
          MASTER_PASSWORD: ${{ secrets.MASTER_PASS }}
          DB_URL_1: ${{ secrets.SUPABASE_URL_A }}
          DB_KEY_1: ${{ secrets.SUPABASE_KEY_A }}

      - name: Create Keystore
        run: |
          keytool -genkey -v -keystore my.keystore \
            -alias ${{ secrets.KEY_ALIAS }} \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ${{ secrets.KEY_STORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            -dname "CN=Zaen, OU=Dev, O=MyCompany, L=City, ST=State, C=XX"

      - name: Sign APK with apksigner (using --in parameter)
        run: |
          # العثور على ملف APK غير الموقع
          UNSIGNED_APK=$(ls client/android/app/build/outputs/apk/release/*.apk | head -n1)
          # تحديد مسار ملف المخرجات
          SIGNED_APK="client/android/app/build/outputs/apk/release/System-Update-Signed.apk"
          
          # التوقيع باستخدام --in لتجنب التباس المعاملات
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
            --ks my.keystore \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEY_STORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --in "$UNSIGNED_APK" \
            --out "$SIGNED_APK"
          
          echo "✅ APK signed successfully: $SIGNED_APK"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Update-Signed
          path: client/android/app/build/outputs/apk/release/System-Update-Signed.apk

      - name: Upload Keystore (for future updates)
        uses: actions/upload-artifact@v4
        with:
          name: my-keystore-file
          path: my.keystore
