name: Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Gradle Wrapper
        run: |
          cd client/android
          gradle wrapper
          chmod +x gradlew

      - name: Build Release APK (unsigned)
        run: |
          cd client/android
          ./gradlew assembleRelease
        env:
          MASTER_PASSWORD: ${{ secrets.MASTER_PASS }}
          SUPABASE_URL_A: ${{ secrets.SUPABASE_URL_A }}
          SUPABASE_KEY_A: ${{ secrets.SUPABASE_KEY_A }}

      - name: Create Keystore
        run: |
          keytool -genkey -v -keystore my.keystore \
            -alias ${{ secrets.KEY_ALIAS }} \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ${{ secrets.KEY_STORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            -dname "CN=Zaen, OU=Dev, O=MyCompany, L=City, ST=State, C=XX"
          echo "✅ Keystore created successfully"
          keytool -list -keystore my.keystore -storepass ${{ secrets.KEY_STORE_PASSWORD }} -alias ${{ secrets.KEY_ALIAS }}

      - name: Sign APK with jarsigner
        run: |
          APK_FILE=$(ls client/android/app/build/outputs/apk/release/*.apk | head -n1)
          echo "Signing APK: $APK_FILE"
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
            -keystore my.keystore \
            -storepass ${{ secrets.KEY_STORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            "$APK_FILE" ${{ secrets.KEY_ALIAS }}
          echo "✅ APK signed successfully"
          jarsigner -verify "$APK_FILE"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Update-Signed
          path: client/android/app/build/outputs/apk/release/*.apk

      - name: Upload Keystore (for future updates)
        uses: actions/upload-artifact@v4
        with:
          name: my-keystore-file
          path: my.keystore
