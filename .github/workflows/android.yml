# .github/workflows/android.yml
name: Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: |
          cd client/android
          chmod +x gradlew

      - name: Build with Gradle (unsigned APK)
        working-directory: ./client/android
        run: ./gradlew assembleRelease
        env:
          MASTER_PASSWORD: ${{ secrets.MASTER_PASS }}
          SUPABASE_URL_A: ${{ secrets.SUPABASE_URL_A }}
          SUPABASE_KEY_A: ${{ secrets.SUPABASE_KEY_A }}

      - name: Create Keystore
        run: |
          keytool -genkey -v -keystore my.keystore \
            -alias ${{ secrets.KEY_ALIAS }} \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ${{ secrets.KEY_STORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            -dname "CN=Zaen, OU=Dev, O=MyCompany, L=City, ST=State, C=XX"

      - name: Sign APK with apksigner (V2/V3 support)
        run: |
          # تحديد مسار ملف APK غير الموقع
          UNSIGNED_APK=$(ls client/android/app/build/outputs/apk/release/*.apk | head -n1)
          echo "Unsigned APK: $UNSIGNED_APK"

          # إنشاء نسخة موقعة باسم جديد
          SIGNED_APK="client/android/app/build/outputs/apk/release/System-Update-Signed.apk"
          cp "$UNSIGNED_APK" "$SIGNED_APK"

          # التوقيع باستخدام apksigner (يدعم V2, V3)
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign \
            --ks my.keystore \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --ks-pass pass:${{ secrets.KEY_STORE_PASSWORD }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$SIGNED_APK"

          # التحقق من التوقيع
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify "$SIGNED_APK"
          echo "✅ APK signed successfully with V2/V3 schemes"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Update-Signed
          path: client/android/app/build/outputs/apk/release/System-Update-Signed.apk

      - name: Upload Keystore (keep safe for future updates)
        uses: actions/upload-artifact@v4
        with:
          name: my-keystore-file
          path: my.keystore
