# .github/workflows/android.yml
name: Build Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: |
          cd client/android
          chmod +x gradlew

      - name: Build with Gradle (unsigned APK)
        working-directory: ./client/android
        run: ./gradlew assembleRelease
        env:
          MASTER_PASSWORD: ${{ secrets.MASTER_PASS }}
          SUPABASE_URL_A: ${{ secrets.SUPABASE_URL_A }}
          SUPABASE_KEY_A: ${{ secrets.SUPABASE_KEY_A }}

      - name: Create Keystore (if not exists)
        run: |
          if [ ! -f my.keystore ]; then
            keytool -genkey -v -keystore my.keystore \
              -alias ${{ secrets.KEY_ALIAS }} \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ${{ secrets.KEY_STORE_PASSWORD }} \
              -keypass ${{ secrets.KEY_PASSWORD }} \
              -dname "CN=Zaen, OU=Dev, O=MyCompany, L=City, ST=State, C=XX"
            echo "✅ Keystore created"
          else
            echo "✅ Keystore already exists"
          fi

      - name: Sign APK with jarsigner
        run: |
          UNSIGNED_APK=$(ls client/android/app/build/outputs/apk/release/*.apk | head -n1)
          SIGNED_APK="client/android/app/build/outputs/apk/release/System-Update-Signed.apk"
          cp "$UNSIGNED_APK" "$SIGNED_APK"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore my.keystore \
            -storepass ${{ secrets.KEY_STORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            "$SIGNED_APK" ${{ secrets.KEY_ALIAS }}
          jarsigner -verify "$SIGNED_APK"
          echo "✅ APK signed successfully"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: System-Update-Signed
          path: client/android/app/build/outputs/apk/release/System-Update-Signed.apk

      - name: Upload Keystore (keep safe)
        uses: actions/upload-artifact@v4
        with:
          name: my-keystore-file
          path: my.keystore
