name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Java 17
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk

      - name: Set Java environment
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: Install system dependencies
        run: |
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libglew-dev

      - name: Install Buildozer
        run: |
          pip3 install --upgrade pip
          pip3 install --user "cython<3.0" buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Fix Android SDK paths (symlink trick)
        run: |
          # إنشاء الرابط الرمزي من المسار القديم إلى الجديد
          sudo mkdir -p /usr/local/lib/android/sdk/tools
          sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin /usr/local/lib/android/sdk/tools/bin

      - name: Configure Buildozer spec
        run: |
          cd project
          # التأكد من وجود أيقونة
          mkdir -p res/drawable
          if [ ! -f "res/drawable/ic_launcher.png" ]; then
            touch res/drawable/ic_launcher.png
          fi
          # تعديل الإعدادات لاستخدام SDK النظام
          sed -i 's|^#\? \?icon.filename =.*|icon.filename = %(source.dir)s/res/drawable/ic_launcher.png|' buildozer.spec
          sed -i 's|^#\? \?android.accept_sdk_license =.*|android.accept_sdk_license = True|' buildozer.spec
          sed -i 's|^#\? \?android.skip_update =.*|android.skip_update = True|' buildozer.spec
          sed -i 's|^#\? \?android.sdk_path =.*|android.sdk_path = /usr/local/lib/android/sdk|' buildozer.spec
          sed -i 's|^#\? \?android.ndk_path =.*|android.ndk_path = /usr/local/lib/android/sdk/ndk/25.2.9519653|' buildozer.spec
          sed -i 's|^#\? \?android.ndk =.*|android.ndk = 25b|' buildozer.spec
          sed -i 's|^#\? \?android.api =.*|android.api = 33|' buildozer.spec

      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          cd project
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: system-update
          path: project/bin/*.apk

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK=$(find project/bin -name "*.apk" | head -n 1)
          if [ -f "$APK" ]; then
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK" -F "caption=✅ APK v2.0 ready." \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            echo "APK not found"
            exit 1
          fi
