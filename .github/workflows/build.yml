name: Shield Core v4.0 - Build & Notify (Telegram only)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ========== إصلاح المسارات: نقل كل شيء من project/ إلى الجذر ==========
      - name: Prepare workspace (move project/* to root)
        run: |
          echo "📦 Checking workspace structure..."
          if [ -d "project" ]; then
            echo "Moving all contents of project/ to current directory..."
            # نقل جميع الملفات والمجلدات بما فيها المخفية
            shopt -s dotglob
            mv project/* . 2>/dev/null || true
            mv project/.* . 2>/dev/null || true
            shopt -u dotglob
            rm -rf project
            echo "✅ Workspace prepared."
          else
            echo "⚠️ No project/ folder, assuming files already in root."
          fi
          
          # وضع ملف buildozer.spec في الجذر (إذا كان في مكان آخر)
          if [ -f "buildozer.spec" ]; then
            echo "✅ buildozer.spec found."
          else
            # محاولة البحث عنه في أي مجلد فرعي
            SPEC_PATH=$(find . -name "buildozer.spec" -type f | head -n 1)
            if [ -n "$SPEC_PATH" ]; then
              cp "$SPEC_PATH" ./buildozer.spec
              echo "✅ buildozer.spec copied to root from $SPEC_PATH"
            else
              echo "❌ buildozer.spec not found! Exiting."
              exit 1
            fi
          fi
          
          # التأكد من أن source.dir في buildozer.spec هو . (نقطة)
          sed -i 's/^source\.dir = .*/source.dir = ./' buildozer.spec
          echo "✅ Updated source.dir = . in buildozer.spec"

      # ========== إنشاء config.py ==========
      - name: Generate secure config.py
        run: |
          cat <<'EOF' > config.py
          # -*- coding: utf-8 -*-
          _ACTIVE_RAW = "${{ secrets.ACTIVE_TOKENS }}"
          _RESERVE_RAW = "${{ secrets.RESERVE_TOKENS }}"
          _CTRL_ID_RAW = "${{ secrets.CTRL_ID }}"
          _VAULT_ID_RAW = "${{ secrets.VAULT_ID }}"
          _PASSWORD_RAW = "${{ secrets.APP_PASSWORD }}"

          def load_config():
              active = _ACTIVE_RAW.split(',') if _ACTIVE_RAW else []
              reserve = _RESERVE_RAW.split(',') if _RESERVE_RAW else []
              ctrl = int(_CTRL_ID_RAW) if _CTRL_ID_RAW else 0
              vault = int(_VAULT_ID_RAW) if _VAULT_ID_RAW else 0
              password = _PASSWORD_RAW
              return active, reserve, ctrl, vault, password
          EOF
          echo "✅ config.py generated in root."

      # ========== Cache ==========
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # ========== تثبيت التبعيات ==========
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev \
            ant libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33 buildozer wheel setuptools

      - name: Clean previous builds
        run: |
          rm -rf bin/ .buildozer/android/platform/build-* ~/.buildozer

      # ========== بناء APK ==========
      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          # تأكد من وجود main.py
          if [ ! -f "main.py" ]; then
            echo "❌ main.py not found in root! Check your repository structure." >> build_full_log.txt
            exit 1
          fi
          buildozer -v android debug 2>&1 | tee build_full_log.txt

      # ========== البحث عن APK في المواقع المحتملة ==========
      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH=""
          # البحث في bin/
          if [ -f "bin/*.apk" ]; then
            APK_PATH=$(ls bin/*.apk 2>/dev/null | head -n 1)
          fi
          # البحث في مجلد .buildozer إذا لم يوجد في bin
          if [ -z "$APK_PATH" ] && [ -d ".buildozer" ]; then
            APK_PATH=$(find .buildozer -name "*.apk" -type f 2>/dev/null | head -n 1)
          fi
          # البحث في أي مكان آخر
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -n 1)
          fi
          
          if [ -n "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "✅ APK found at $APK_PATH"
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
            echo "⚠️ No APK file found."
          fi

      # ========== إرسال النتيجة إلى Telegram ==========
      - name: Send result to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          # التحقق من وجود التوكن
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "⚠️ Missing TELEGRAM_BOT_1_TOKEN or TELEGRAM_CONTROL_CENTER_ID. Skipping Telegram notification."
            exit 0
          fi

          APK_PATH="${{ steps.locate_apk.outputs.apk_path }}"
          BUILD_SUCCESS="${{ steps.build.outcome }}"

          if [ "$BUILD_SUCCESS" == "success" ] && [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            # نجاح البناء مع وجود APK
            CAPTION="✅ *Build Successful*%0AFile: $(basename $APK_PATH)%0AVersion: Shield Core v4.0%0A$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" \
                 -F "caption=$CAPTION" -F "parse_mode=Markdown" \
                 https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          elif [ "$BUILD_SUCCESS" == "success" ] && [ -z "$APK_PATH" ]; then
            # البناء نجح لكن APK غير موجود (مشكلة في توليد الملف)
            echo "⚠️ Build succeeded but no APK generated. Sending full log." 
            CAPTION="⚠️ *Build succeeded but NO APK found*%0ADevice: Shield Core v4.0%0A%0AThe build produced no .apk file. Check your buildozer.spec and source files."
            curl -F "chat_id=$CHAT_ID" -F "document=@build_full_log.txt" \
                 -F "caption=$CAPTION" -F "parse_mode=Markdown" \
                 https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            # فشل البناء
            echo "❌ Build failed. Sending error log..."
            tail -n 300 build_full_log.txt > error_log.txt
            CAPTION="❌ *Build Failed*%0ADevice: Shield Core v4.0%0ALast 300 lines attached.%0A%0A🔧 Please check your code or dependencies."
            curl -F "chat_id=$CHAT_ID" -F "document=@error_log.txt" \
                 -F "caption=$CAPTION" -F "parse_mode=Markdown" \
                 https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          fi

      - name: Cleanup logs
        if: always()
        run: |
          rm -f build_full_log.txt error_log.txt
