name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies for Kivy
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev shared-mime-info \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libglew-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install --user --upgrade Cython==0.29.33 buildozer
          pip install --user appdirs colorama jinja2 sh build toml packaging setuptools

      - name: Configure SDK & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.1" "platform-tools"
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          cp -r $ANDROID_HOME/licenses/* /home/runner/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true

      - name: Verify required project files
        run: |
          echo "Checking essential files..."
          MISSING=0
          for file in project/main.py project/buildozer.spec project/config/device_admin.xml project/android/AndroidManifest.xml project/res/drawable/ic_launcher.png; do
            if [ ! -f "$file" ]; then
              echo "MISSING: $file"
              MISSING=1
            fi
          done
          if [ $MISSING -eq 1 ]; then exit 1; fi

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          export ANDROID_HOME=$ANDROID_HOME
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANT_HOME=/usr/share/ant
          export PATH=$PATH:$ANT_HOME/bin
          cd project

          # توجيه Buildozer لاستخدام أدوات النظام الجاهزة
          sed -i 's/^#\? \?android.sdk_path =.*/android.sdk_path = \/usr\/local\/lib\/android\/sdk/' buildozer.spec
          sed -i 's/^#\? \?android.ant_path =.*/android.ant_path = \/usr\/share\/ant/' buildozer.spec

          export BUILDOZER_ALLOW_ORG_NAME_START=1
          echo "🚀 Starting Buildozer build..."
          buildozer -v android debug

      - name: Find and verify APK
        run: |
          APK_FILE=$(find project/bin -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK file found"
            exit 1
          fi
          echo "FULL_APK_PATH=$GITHUB_WORKSPACE/$APK_FILE" >> $GITHUB_ENV
          echo "✅ APK found at: $GITHUB_WORKSPACE/$APK_FILE"

      - name: Send APK to Telegram
        run: |
          curl -v -F "chat_id=${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}" \
               -F "document=@${{ env.FULL_APK_PATH }}" \
               -F "caption=✅ APK v2.0 ready." \
               https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_1_TOKEN }}/sendDocument
