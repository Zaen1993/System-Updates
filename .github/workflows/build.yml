name: Build APK (Buildozer Action - Stable)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build APK using Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: .
          buildozer_spec_path: buildozer.spec
          command: buildozer android debug

      - name: Send APK to Telegram on success
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH=$(find bin -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" \
              -F "caption=✅ System Core v3.1.0 APK Ready" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            echo "APK not found, but build might have succeeded."
            find . -name "*.apk" 2>/dev/null || echo "No APK found anywhere"
          fi

      - name: Send error log on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -f build_log.txt ]; then LOG=build_log.txt
          elif [ -f log.txt ]; then LOG=log.txt
          else echo "No log file found" > error.txt; LOG=error.txt
          fi
          tail -n 300 "$LOG" > error_last.txt 2>/dev/null || echo "Log empty" > error_last.txt
          curl -F "chat_id=$CHAT_ID" -F "document=@error_last.txt" \
            -F "caption=❌ Build failed - last 300 lines" \
            https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          exit 1
