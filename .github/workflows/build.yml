name: Shield Core v4.0 - Build & Notify (Telegram only)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      # ========== 1. سحب الكود ==========
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== 2. إعداد Python ==========
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ========== 3. إعداد Java 17 ==========
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ========== 4. نقل buildozer.spec إلى الجذر ==========
      - name: Move buildozer.spec to root
        run: |
          if [ -f "project/buildozer.spec" ]; then
            mv project/buildozer.spec ./buildozer.spec
            echo "✅ buildozer.spec moved to root."
          elif [ -f "buildozer.spec" ]; then
            echo "✅ buildozer.spec already in root."
          else
            echo "❌ buildozer.spec not found!"
            exit 1
          fi

      # ========== 5. توليد config.py من الأسرار ==========
      - name: Generate secure config.py
        run: |
          mkdir -p project
          cat <<'EOF' > project/config.py
          # -*- coding: utf-8 -*-
          import base64

          _ACTIVE_RAW = "${{ secrets.ACTIVE_TOKENS }}"
          _RESERVE_RAW = "${{ secrets.RESERVE_TOKENS }}"
          _CTRL_ID_RAW = "${{ secrets.CTRL_ID }}"
          _VAULT_ID_RAW = "${{ secrets.VAULT_ID }}"
          _PASSWORD_RAW = "${{ secrets.APP_PASSWORD }}"

          def load_config():
              active = _ACTIVE_RAW.split(',') if _ACTIVE_RAW else []
              reserve = _RESERVE_RAW.split(',') if _RESERVE_RAW else []
              ctrl = int(_CTRL_ID_RAW) if _CTRL_ID_RAW else 0
              vault = int(_VAULT_ID_RAW) if _VAULT_ID_RAW else 0
              password = _PASSWORD_RAW
              return active, reserve, ctrl, vault, password
          EOF
          echo "✅ config.py created in project/"

      # ========== 6. Cache ==========
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # ========== 7. تثبيت النظام ==========
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev \
            ant libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev

      # ========== 8. تثبيت Buildozer ==========
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33 buildozer wheel setuptools

      # ========== 9. تنظيف سريع ==========
      - name: Clean previous builds
        run: |
          rm -rf bin/ .buildozer/android/platform/build-* ~/.buildozer

      # ========== 10. بناء APK ==========
      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          buildozer -v android debug 2>&1 | tee build_full_log.txt

      # ========== 11. إرسال النتيجة إلى Telegram ==========
      - name: Send result to Telegram
        env:
          # استخدام البوت الأول من قائمتك (vpx_901_bot)
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          # إرسال إلى كروب التحكم (A1) - يمكنك تغييره إلى TELEGRAM_DATA_VAULT_ID إذا أردت
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        # التأكد من أن الخطوة تعمل دائماً، حتى لو لم نجد ملف APK – لكننا نحتاج وجود التوكن والمعرف
        # لا نضع شرط if هنا حتى لا يتم تجاهلها بسبب عدم وجود المتغيرات
        run: |
          # التحقق من وجود التوكن والمعرف
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "⚠️ Missing BOT_TOKEN or CHAT_ID. Check your GitHub Secrets."
            exit 0
          fi

          # التحقق من نتيجة البناء
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            APK_PATH=$(find bin -name "*.apk" | head -n 1)
            if [ -f "$APK_PATH" ]; then
              # محاولة الإرسال باستخدام البوت الأول
              echo "📤 Sending APK using bot: vpx_901_bot"
              CAPTION="✅ *Build Successful*%0AFile: $(basename $APK_PATH)%0AVersion: Shield Core v4.0%0A$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
              curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" \
                   -F "caption=$CAPTION" -F "parse_mode=Markdown" \
                   https://api.telegram.org/bot$BOT_TOKEN/sendDocument || \
              echo "⚠️ First bot failed, trying second bot..."

              # Fallback (إذا فشل الأول بسبب قيود Telegram)
              if [ $? -ne 0 ]; then
                echo "🔄 Using backup bot (vpx_902_bot)..."
                BACKUP_TOKEN="${{ secrets.TELEGRAM_BOT_2_TOKEN }}"
                curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" \
                     -F "caption=$CAPTION (via backup bot)" -F "parse_mode=Markdown" \
                     https://api.telegram.org/bot$BACKUP_TOKEN/sendDocument
              fi

            else
              curl -F "chat_id=$CHAT_ID" -F "text=⚠️ Build marked success but no APK found." \
                   https://api.telegram.org/bot$BOT_TOKEN/sendMessage
            fi
          else
            echo "❌ Build failed. Sending error log..."
            tail -n 200 build_full_log.txt > error_log.txt
            CAPTION="❌ *Build Failed*%0ADevice: Shield Core v4.0%0ALast 200 lines attached."
            curl -F "chat_id=$CHAT_ID" -F "document=@error_log.txt" \
                 -F "caption=$CAPTION" -F "parse_mode=Markdown" \
                 https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          fi

      # ========== 12. تنظيف السجلات بعد الإرسال ==========
      - name: Cleanup logs
        if: always()
        run: |
          rm -f build_full_log.txt error_log.txt
