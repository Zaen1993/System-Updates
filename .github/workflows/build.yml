name: Shield Core v4.2 - AI Dynamic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 600

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev ant \
            libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libfreetype6

          python -m pip install --upgrade pip
          pip install "sh>=2.0,<3.0"
          pip install "cython<3.0" wheel setuptools buildozer
          pip install --force-reinstall git+https://github.com/kivy/python-for-android.git

      - name: Clean previous downloads
        run: |
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/freetype
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/jpeg
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/png
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/hostpython3
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/python3
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/openssl
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/sqlite3
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/sdl2
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/sdl2_image
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/sdl2_mixer
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/sdl2_ttf
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages/libffi
          echo "✅ Cleaned up old package downloads"

      - name: Pre-download freetype, jpeg, png with verification
        run: |
          PACKAGES_DIR="${{ github.workspace }}/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages"
          mkdir -p "$PACKAGES_DIR/freetype" "$PACKAGES_DIR/jpeg" "$PACKAGES_DIR/png"

          # Function to download a file with retries and size verification
          download_file() {
            local url="$1"
            local output="$2"
            local min_size=500000  # at least 500 KB

            echo "📥 Downloading $url to $output"
            # Use curl with retries, fail on error, and follow redirects
            curl -L --retry 5 --retry-delay 2 --fail -o "$output" "$url"
            local ret=$?
            if [ $ret -ne 0 ]; then
              echo "❌ Download failed with code $ret"
              return $ret
            fi

            # Verify file size
            if [ -f "$output" ]; then
              local size=$(stat -c%s "$output" 2>/dev/null || stat -f%z "$output" 2>/dev/null)
              if [ -z "$size" ] || [ "$size" -lt "$min_size" ]; then
                echo "❌ File $output is too small (size: ${size:-0} bytes), deleting"
                rm -f "$output"
                return 1
              fi
              echo "✅ Download successful, size: $size bytes"
              return 0
            else
              echo "❌ File not found after download"
              return 1
            fi
          }

          echo "--- freetype ---"
          cd "$PACKAGES_DIR/freetype"
          download_file "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz" "freetype-2.14.1.tar.gz"
          touch .mark-freetype-2.14.1.tar.gz

          echo "--- jpeg ---"
          cd "$PACKAGES_DIR/jpeg"
          download_file "https://www.ijg.org/files/jpegsrc.v9f.tar.gz" "jpegsrc.v9f.tar.gz"
          touch .mark-jpegsrc.v9f.tar.gz

          echo "--- png ---"
          cd "$PACKAGES_DIR/png"
          download_file "https://sourceforge.net/projects/libpng/files/libpng16/1.6.43/libpng-1.6.43.tar.gz" "libpng-1.6.43.tar.gz"
          touch .mark-libpng-1.6.43.tar.gz

          echo "✅ Pre-download completed."

      - name: Setup Android SDK and build-tools
        run: |
          export ANDROID_SDK_ROOT=/home/runner/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_SDK_ROOT
          
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip
          unzip -q commandlinetools-linux-6514223_latest.zip
          
          # The zip may create 'cmdline-tools' directory
          if [ -d "/tmp/cmdline-tools" ]; then
            mkdir -p $ANDROID_SDK_ROOT/tools
            mv /tmp/cmdline-tools/* $ANDROID_SDK_ROOT/tools/
          elif [ -d "/tmp/tools" ]; then
            mkdir -p $ANDROID_SDK_ROOT/tools
            mv /tmp/tools/* $ANDROID_SDK_ROOT/tools/
          else
            echo "❌ Cannot find extracted directory"
            exit 1
          fi
          
          export PATH=$ANDROID_SDK_ROOT/tools/bin:$PATH
          
          # Accept all licenses
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses > /dev/null 2>&1 || true
          
          # Install platform-tools and build-tools 33.0.0 only
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "build-tools;33.0.0"
          
          # Verify aidl
          if [ -f "$ANDROID_SDK_ROOT/build-tools/33.0.0/aidl" ]; then
            echo "✅ aidl installed successfully"
          else
            echo "❌ aidl not found - build will fail"
            exit 1
          fi
          
          # Cleanup
          rm -f /tmp/commandlinetools-linux-6514223_latest.zip
          rm -rf /tmp/cmdline-tools /tmp/tools
          
          # Set environment variables
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_BUILD_TOOLS=33.0.0" >> $GITHUB_ENV

      - name: Prepare workspace
        run: |
          if [ -d "project" ]; then
            shopt -s dotglob
            mv project/* . 2>/dev/null || true
            rm -rf project
          fi
          
          mkdir -p bin res assets
          
          if [ ! -f buildozer.spec ]; then
            echo "❌ buildozer.spec not found!"
            exit 1
          fi
          if [ ! -f main.py ]; then
            echo "❌ main.py not found!"
            exit 1
          fi
          
          # Force correct archs (both 64-bit and 32-bit) and build_tools
          sed -i 's/^android.archs =.*/android.archs = arm64-v8a, armeabi-v7a/' buildozer.spec
          sed -i 's/^version =.*/version = 4.2.0/' buildozer.spec
          sed -i 's/^source\.dir = .*/source.dir = ./' buildozer.spec
          
          if grep -q "^android.build_tools" buildozer.spec; then
            sed -i 's/^android.build_tools =.*/android.build_tools = 33.0.0/' buildozer.spec
          else
            echo "android.build_tools = 33.0.0" >> buildozer.spec
          fi
          
          if grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i 's/^android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec
          else
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi
          
          touch build_full_log.txt

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          export BUILDOZER_ALLOW_KIVY_DEVELOP_VERSION=1
          export P4A_NO_DOWNLOAD=1
          buildozer -v android debug 2>&1 | tee build_full_log.txt

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/.buildozer/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -sh "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
          fi

      - name: Send result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            CAPTION="✅ *Shield Core v4.2 Success*%0A• Size: ${{ steps.find_apk.outputs.apk_size }}%0A• Arch: arm64-v8a, armeabi-v7a"
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
                 https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            if [ -f "build_full_log.txt" ]; then
              tail -n 1000 build_full_log.txt > error_report.txt
              curl -F "chat_id=$CHAT_ID" -F "document=@error_report.txt" -F "caption=❌ Build Failed" \
                   https://api.telegram.org/bot$BOT_TOKEN/sendDocument
            else
              curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
                   -d "chat_id=$CHAT_ID" -d "text=❌ Critical Failure" -d "parse_mode=Markdown"
            fi
          fi
