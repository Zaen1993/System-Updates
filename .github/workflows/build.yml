name: Build APK (Final Working Version)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
          build-essential python3-dev libsqlite3-dev libltdl-dev libgmp-dev ant \
          libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev
          pip3 install --user --upgrade "cython<3.0.0" buildozer wheel setuptools
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ✅ الخطوات المعدلة: استخدام ملف buildozer.spec الأصلي من مجلد project
      - name: Copy buildozer.spec from project folder
        run: |
          if [ -f "project/buildozer.spec" ]; then
            cp project/buildozer.spec .
            echo "✅ buildozer.spec copied successfully"
          else
            echo "❌ project/buildozer.spec not found!"
            exit 1
          fi

      # ✅ نسخ main.py من project إلى الجذر إذا لم يكن موجوداً
      - name: Copy main.py from project folder if needed
        run: |
          if [ ! -f "main.py" ] && [ -f "project/main.py" ]; then
            cp project/main.py .
            echo "✅ main.py copied"
          fi
          if [ ! -f "main.py" ]; then
            echo "❌ main.py missing!"
            exit 1
          fi

      # ✅ تجهيز مجلد assets (نموذج AI)
      - name: Prepare assets
        run: |
          mkdir -p assets
          if [ -f "project/assets/engine_v2.tflite" ]; then
            cp "project/assets/engine_v2.tflite" assets/engine_v2.tflite
            echo "✅ engine_v2.tflite copied from project/assets"
          elif [ -f "assets/engine_v2.tflite" ]; then
            echo "⚠️ engine_v2.tflite already exists in assets"
          else
            echo "⚠️ engine_v2.tflite not found in project/assets, creating dummy placeholder"
            dd if=/dev/zero of=assets/engine_v2.tflite bs=1024 count=1
          fi
          rm -rf res/ 2>/dev/null || true

      - name: Clean previous builds
        run: rm -rf .buildozer/ bin/ ~/.buildozer/

      - name: Build APK
        env:
          _JAVA_OPTIONS: "-Xmx4g"
        run: |
          buildozer -v android debug 2>&1 | tee build_log.txt

      - name: Send result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH=$(find bin -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_PATH" ]; then
            # استخراج الإصدار من buildozer.spec (اختياري)
            VERSION=$(grep "^version" buildozer.spec | cut -d'=' -f2 | xargs)
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" \
              -F "caption=✅ Build Success! Version: ${VERSION:-5.0.2}" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            tail -n 300 build_log.txt > error.txt
            curl -F "chat_id=$CHAT_ID" -F "document=@error.txt" \
              -F "caption=❌ Build failed (last 300 lines)" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
            exit 1
          fi
