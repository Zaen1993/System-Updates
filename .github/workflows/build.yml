name: Shield Core v4.0 - Final Production Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python & Java
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev build-essential python3-dev libsqlite3-dev libltdl-dev libgmp-dev ant libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev
          pip install --upgrade pip
          pip install cython==0.29.33 wheel setuptools
          pip install git+https://github.com/kivy/buildozer.git
          pip install git+https://github.com/kivy/python-for-android.git

      - name: Prepare workspace
        run: |
          if [ -d "project" ]; then
            shopt -s dotglob
            mv project/* . 2>/dev/null || true
            mv project/.* . 2>/dev/null || true
            shopt -u dotglob
            rm -rf project
          fi
          # تعطيل المانيفست المخصص
          sed -i 's/^android\.manifest =/# android.manifest =/' buildozer.spec
          sed -i 's/^source\.dir = .*/source.dir = ./' buildozer.spec

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build_full_log.txt

      - name: Send to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH=$(find bin -name "*.apk" 2>/dev/null | head -n 1)
          if [ -f "$APK_PATH" ]; then
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=✅ Shield Core v4.0 Build Success" https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            tail -n 500 build_full_log.txt > error_log.txt
            curl -F "chat_id=$CHAT_ID" -F "document=@error_log.txt" -F "caption=❌ Build Failed - Check Log" https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          fi
