name: Shield Core v4.2 - AI Dynamic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ANDROID_API: "31"
      ANDROID_MIN_API: "24"
      NDK_VERSION: "25.1.8937393"
      P4A_CUSTOM: "${{ github.workspace }}/.buildozer/p4a_custom"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev \
            libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libfreetype6 gfortran curl ccache ant

      - name: Install Buildozer (without p4a)
        run: |
          python3 -m pip install --upgrade pip wheel setuptools
          python3 -m pip install "Cython==0.29.33"
          python3 -m pip install "sh<2.0,>=1.10"
          python3 -m pip install pexpect appdirs colorama jinja2 virtualenv packaging
          python3 -m pip install buildozer==1.5.0
          # python-for-android سيتم تجهيزه محلياً

      - name: Install Android SDK, NDK 25b
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses || true
          sdkmanager \
            "platforms;android-$ANDROID_API" \
            "build-tools;31.0.0" \
            "ndk;$NDK_VERSION" \
            "platform-tools"
          yes | sdkmanager --licenses || true

          # إعداد روابط Buildozer
          BUILDOZER_PLATFORM="$HOME/.buildozer/android/platform"
          mkdir -p "$BUILDOZER_PLATFORM"
          NDK_PATH="$SDK_ROOT/ndk/$NDK_VERSION"

          ln -sfn "$NDK_PATH" "$BUILDOZER_PLATFORM/android-ndk-r25b"
          ln -sfn "$NDK_PATH" "$BUILDOZER_PLATFORM/android-ndk"
          ln -sfn "$SDK_ROOT" "$BUILDOZER_PLATFORM/android-sdk"

          # إصلاح sdkmanager
          BUILDOZER_SDK="$BUILDOZER_PLATFORM/android-sdk"
          mkdir -p "$BUILDOZER_SDK/tools/bin"
          if [ -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$BUILDOZER_SDK/tools/bin/sdkmanager"
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROIDNDK=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROIDAPI=$ANDROID_API" >> $GITHUB_ENV
          echo "ANDROIDMINAPI=$ANDROID_MIN_API" >> $GITHUB_ENV
          echo "APP_ANDROID_NDK_API=$ANDROID_MIN_API" >> $GITHUB_ENV

      - name: Verify AI model
        run: |
          if [ -f "project/assets/engine_v2.tflite" ]; then
            echo "✅ AI model found."
            ls -lh project/assets/engine_v2.tflite
          else
            echo "❌ AI model NOT found!"
            exit 1
          fi

      # ===== إعداد نسخة p4a محلية مع تعديل دقيق للوصفات =====
      - name: Prepare custom patched p4a with Python script
        run: |
          set -e
          P4A_CUSTOM="$GITHUB_WORKSPACE/.buildozer/p4a_custom"
          rm -rf "$P4A_CUSTOM"
          mkdir -p "$P4A_CUSTOM"

          git clone --depth 1 --branch v2024.01.21 \
            https://github.com/kivy/python-for-android.git "$P4A_CUSTOM"

          # استخدام سكريبت Python لاستبدال الروابط بدقة متناهية
          python3 << 'PYEOF'
          import re
          import pathlib

          base = pathlib.Path("${{ env.P4A_CUSTOM }}")
          target_url = "https://www.python.org/ftp/python/3.10.11/Python-3.10.11.tar.xz"
          github_pattern = re.compile(r'https://github\.com/python/cpython/archive/[^\s"]+')

          for recipe_name in ["hostpython3", "python3"]:
              recipe_file = base / "pythonforandroid" / "recipes" / recipe_name / "__init__.py"
              if recipe_file.exists():
                  content = recipe_file.read_text(encoding="utf-8")
                  new_content, count = github_pattern.subn(target_url, content)
                  if count > 0:
                      recipe_file.write_text(new_content, encoding="utf-8")
                      print(f"✅ Patched {count} URL(s) in {recipe_file}")
                  else:
                      print(f"⚠️ No GitHub Python URL found in {recipe_file}, adding fallback")
                      # في حالة عدم وجود رابط GitHub، نضبط المتغير url مباشرة
                      new_content = re.sub(
                          r'url\s*=\s*"[^"]*"',
                          f'url = "{target_url}"',
                          content
                      )
                      recipe_file.write_text(new_content, encoding="utf-8")
                      print(f"✅ Set url directly in {recipe_file}")
                  
                  # طباعة أول 10 أسطر للتحقق
                  for line in new_content.splitlines()[:10]:
                      print(f"  {line}")
          PYEOF

          echo "✅ Custom p4a ready with verified patches"

      # ===== تنزيل الحزم ووضعها في جميع المسارات المتوقعة =====
      - name: Pre-download recipes and create marker files
        run: |
          set -e
          # المسار الأساسي الذي يستخدمه Buildozer
          BASE1="$GITHUB_WORKSPACE/project/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages"
          # المسار الاحتياطي في الكاش العام
          BASE2="$HOME/.buildozer/cache/packages"

          for BASE in "$BASE1" "$BASE2"; do
            mkdir -p "$BASE/freetype" "$BASE/openssl" "$BASE/sqlite3" "$BASE/hostpython3" "$BASE/python3"

            # FreeType 2.14.1
            curl -sSL --retry 10 -o "$BASE/freetype/freetype-2.14.1.tar.gz" \
              "https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz"
            touch "$BASE/freetype/.mark-freetype-2.14.1.tar.gz"

            # OpenSSL 1.1.1w
            curl -sSL --retry 10 -o "$BASE/openssl/openssl-1.1.1w.tar.gz" \
              "https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz"
            touch "$BASE/openssl/.mark-openssl-1.1.1w.tar.gz"

            # SQLite3 3390200
            curl -sSL --retry 10 -o "$BASE/sqlite3/sqlite-autoconf-3390200.tar.gz" \
              "https://github.com/andrey-utkin/sqlite-mirror/releases/download/sqlite-autoconf-3390200/sqlite-autoconf-3390200.tar.gz"
            touch "$BASE/sqlite3/.mark-sqlite-autoconf-3390200.tar.gz"

            # Python 3.10.11 للمضيف (hostpython3) وللتطبيق (python3)
            curl -sSL --retry 10 -o "$BASE/hostpython3/Python-3.10.11.tar.xz" \
              "https://www.python.org/ftp/python/3.10.11/Python-3.10.11.tar.xz"
            touch "$BASE/hostpython3/.mark-Python-3.10.11.tar.xz"

            curl -sSL --retry 10 -o "$BASE/python3/Python-3.10.11.tar.xz" \
              "https://www.python.org/ftp/python/3.10.11/Python-3.10.11.tar.xz"
            touch "$BASE/python3/.mark-Python-3.10.11.tar.xz"
          done

          echo "✅ All packages and marker files in place"

      # ===== كتابة buildozer.spec مع مسارات مطلقة =====
      - name: Write buildozer.spec
        run: |
          set -e
          cd project
          cat > buildozer.spec << EOF
          [app]
          title = Shield Core
          package.name = shieldcore
          package.domain = com.sys
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,txt,json,tflite
          source.include_files = assets/engine_v2.tflite, res/
          version = 4.2.0

          requirements = hostpython3==3.10,python3==3.10,kivy==2.3.0,Cython==0.29.33,requests==2.31.0,pillow,numpy

          orientation = portrait
          fullscreen = 0

          [android]
          api = $ANDROID_API
          minapi = $ANDROID_MIN_API
          ndk = 25b
          ndk_api = $ANDROID_MIN_API
          archs = arm64-v8a, armeabi-v7a
          build_tools = 31.0.0

          android.skip_update = True
          android.accept_sdk_license = True
          android.allow_backup = False

          permissions = INTERNET, CAMERA, RECORD_AUDIO, WAKE_LOCK, FOREGROUND_SERVICE

          android.manifest.foreground_service_type = dataSync
          android.gradle_dependencies = androidx.core:core:1.9.0, androidx.work:work-runtime:2.8.0
          android.resdir = res

          android.sdk_path = /usr/local/lib/android/sdk
          android.ndk_path = /usr/local/lib/android/sdk/ndk/25.1.8937393

          [buildozer]
          log_level = 2
          warn_on_root = 0
          p4a.source_dir = $P4A_CUSTOM
          EOF
          echo "✅ buildozer.spec written."
          cd ..

      # ===== بناء APK =====
      - name: Build APK
        id: build
        run: |
          set -o pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROIDMINAPI="$ANDROID_MIN_API"
          export ANDROIDNDK="$ANDROID_NDK_HOME"

          P4A_CUSTOM="$GITHUB_WORKSPACE/.buildozer/p4a_custom"
          cd project
          touch build_log.txt

          echo "Using custom p4a dir: $P4A_CUSTOM"
          ls -la "$P4A_CUSTOM/pythonforandroid/recipes/hostpython3/"

          buildozer -v android debug \
            --p4a-dir="$P4A_CUSTOM" \
            --sdk-dir="$ANDROID_HOME" \
            --ndk-dir="$ANDROID_NDK_HOME" \
            --android-api="$ANDROID_API" \
            --ndk-api="$ANDROID_MIN_API" \
            2>&1 | tee -a build_log.txt

          find bin -maxdepth 1 -type f -name "*.apk" -ls
          cd ..

      - name: Locate APK
        if: always()
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/.buildozer/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -sh "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shield-core-build-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            project/**/*.apk
            project/build_log.txt

      - name: Send Result
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "⚠️ Telegram secrets missing!"
            exit 1
          fi

          BUILD_STATUS="${{ steps.find_apk.outputs.status }}"

          if [ "$BUILD_STATUS" = "success" ]; then
            APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
            CAPTION="✅ *Shield Core v4.2 Success*%0A• Size: ${{ steps.find_apk.outputs.apk_size }}%0A• Arch: arm64-v8a, armeabi-v7a"
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            REPORT_FILE="SHIELD_CORE_BUILD_REPORT.txt"
            {
              echo "══════════════════════════════════════════════════════════════════"
              echo "  🔍 BUILD DIAGNOSTIC REPORT - Shield Core v4.2"
              echo "══════════════════════════════════════════════════════════════════"
              echo "📅 Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              echo "📦 Repository: $GITHUB_REPOSITORY"
              echo "🔖 Run ID: $GITHUB_RUN_ID"
              echo ""
              if [ -f "project/build_log.txt" ]; then
                echo "--- Recipe URL after patching ---"
                grep -A2 "url = " "$GITHUB_WORKSPACE/.buildozer/p4a_custom/pythonforandroid/recipes/hostpython3/__init__.py" 2>/dev/null || true
                echo ""
                echo "--- Download errors ---"
                grep -i -E "Downloading|HTTP Error|urlopen|error:|exception|failed" project/build_log.txt | tail -n 50
              else
                echo "No build log found."
              fi
              echo ""
              echo "--- LAST 200 LOG LINES ---"
              tail -n 200 project/build_log.txt 2>/dev/null || echo "Log unavailable"
            } > "$REPORT_FILE"

            curl -s -F "chat_id=$CHAT_ID" \
              -F "document=@$REPORT_FILE" \
              -F "caption=❌ *Build Failed - Shield Core v4.2*%0A📋 Full diagnostic report attached." \
              -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          fi
