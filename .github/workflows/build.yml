name: Shield Core v4.2 - AI Dynamic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== 1. تنظيف المساحة ==========
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      # ========== 2. إعداد Python 3.10 ==========
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      # ========== 3. إعداد Java 17 ==========
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ========== 4. تثبيت تبعيات النظام ==========
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev \
            libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libfreetype6 gfortran curl ccache

      # ========== 5. تثبيت Buildozer و p4a + Pre-cache كامل للتبعيات ==========
      - name: Install Buildozer and p4a
        run: |
          python3 -m pip install --upgrade pip wheel setuptools
          python3 -m pip install "Cython==0.29.33"
          python3 -m pip install "sh<2.0,>=1.10"
          python3 -m pip install pexpect appdirs colorama jinja2 virtualenv packaging
          python3 -m pip install buildozer==1.5.0
          python3 -m pip install python-for-android==2024.1.21

          # تحميل مسبق لعجلات Python (للاحتياط)
          mkdir -p ~/.cache/pip
          python3 -m pip download kivy==2.3.0 requests==2.31.0 Pillow==9.5.0 numpy -d ~/.cache/pip/ || true

          echo "✅ Buildozer, p4a, and pre-cached wheels ready."

      # ========== 5b. تنزيل جميع مصادر الوصفات (Recipes) مسبقاً ==========
      - name: Pre-cache all p4a recipe sources
        run: |
          python3 << 'PYEOF'
          import os, urllib.request, ssl, shutil, hashlib
          from pythonforandroid.recipe import Recipe
          from pythonforandroid.arch import Arch

          CACHE_DIR = os.path.expanduser("~/.local/share/python-for-android/cache")
          os.makedirs(CACHE_DIR, exist_ok=True)

          # إعداد طلب HTTP محصن
          USER_AGENT = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          def download_file(url, dest, retries=5):
              for i in range(retries):
                  try:
                      print(f"  Downloading {url} (attempt {i+1})")
                      req = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
                      with urllib.request.urlopen(req, context=ctx, timeout=30) as response, open(dest, 'wb') as out_file:
                          shutil.copyfileobj(response, out_file)
                      print(f"    ✅ Saved to {dest}")
                      return True
                  except Exception as e:
                      print(f"    ⚠️ Attempt {i+1} failed: {e}")
                      if i < retries-1:
                          import time; time.sleep(3)
              return False

          # قائمة الوصفات الأساسية التي يحتاجها المشروع
          required_recipes = [
              "python3",
              "sdl2",
              "sdl2_image",
              "sdl2_mixer",
              "sdl2_ttf",
              "libffi",
              "openssl",
              "sqlite3",
              "pyjnius",
              "kivy",
              "requests",
              "pillow",
              "numpy",
          ]

          # إنشاء كائنات وصفات وهمية لاستخراج رابط التحميل
          # لكننا نستخدم طريقة بديلة: نجلب الروابط المباشرة المعروفة لإصدار p4a 2024.1.21
          # لأن تحميل كل الوصفات ديناميكياً معقد في هذه المرحلة.
          # الروابط أدناه تم التحقق منها وتتوافق مع هذا الإصدار.

          source_urls = {
              "libffi": "https://github.com/libffi/libffi/releases/download/v3.4.4/libffi-3.4.4.tar.gz",
              "openssl": "https://www.openssl.org/source/openssl-1.1.1w.tar.gz",
              "sqlite3": "https://www.sqlite.org/2023/sqlite-autoconf-3390200.tar.gz",
              "sdl2": "https://www.libsdl.org/release/SDL2-2.26.5.tar.gz",
              "sdl2_image": "https://www.libsdl.org/projects/SDL_image/release/SDL2_image-2.6.3.tar.gz",
              "sdl2_mixer": "https://www.libsdl.org/projects/SDL_mixer/release/SDL2_mixer-2.6.3.tar.gz",
              "sdl2_ttf": "https://www.libsdl.org/projects/SDL_ttf/release/SDL2_ttf-2.20.2.tar.gz",
              "python3": "https://www.python.org/ftp/python/3.10.11/Python-3.10.11.tar.xz",
          }

          success = True
          for name, url in source_urls.items():
              filename = os.path.basename(url)
              dest = os.path.join(CACHE_DIR, filename)
              if os.path.exists(dest):
                  print(f"✅ {filename} already cached, skipping.")
                  continue
              if not download_file(url, dest):
                  print(f"❌ Failed to download {name} after retries.")
                  success = False

          # الخروج مع خطأ إذا فشل أي تنزيل أساسي
          if not success:
              print("One or more essential source downloads failed.")
              exit(1)
          else:
              print("🎉 All recipe sources cached successfully!")
          PYEOF

      # ========== 6. إعداد SDK و NDK 25b ==========
      - name: Install Android SDK, NDK 25b, and pre-accept licenses
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses || true
          sdkmanager \
            "platforms;android-31" \
            "platforms;android-33" \
            "build-tools;31.0.0" \
            "build-tools;33.0.2" \
            "ndk;25.1.8937393" \
            "platform-tools"

          yes | sdkmanager --licenses || true

          BUILDOZER_PLATFORM="$HOME/.buildozer/android/platform"
          mkdir -p "$BUILDOZER_PLATFORM"
          NDK_PATH="$SDK_ROOT/ndk/25.1.8937393"

          ln -sfn "$NDK_PATH" "$BUILDOZER_PLATFORM/android-ndk-r25b"
          ln -sfn "$NDK_PATH" "$BUILDOZER_PLATFORM/android-ndk"
          ln -sfn "$NDK_PATH" "$BUILDOZER_PLATFORM/android-ndk-r28c"
          ln -sfn "$SDK_ROOT" "$BUILDOZER_PLATFORM/android-sdk"

          BUILDOZER_SDK="$BUILDOZER_PLATFORM/android-sdk"
          mkdir -p "$BUILDOZER_SDK/licenses"
          mkdir -p "$BUILDOZER_SDK/tools/bin"
          cp -r "$SDK_ROOT/licenses/"* "$BUILDOZER_SDK/licenses/" 2>/dev/null || true

          if [ -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$BUILDOZER_SDK/tools/bin/sdkmanager"
            ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" "$BUILDOZER_SDK/tools/bin/avdmanager"
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROIDNDK=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROIDAPI=31" >> $GITHUB_ENV
          echo "ANDROIDMINAPI=24" >> $GITHUB_ENV
          echo "APP_ANDROID_NDK_API=24" >> $GITHUB_ENV
          echo "✅ SDK APIs & NDK 25b configured."

      # ========== 7. التحقق من النموذج ==========
      - name: Verify AI model
        run: |
          if [ -f "project/assets/engine_v2.tflite" ]; then
            echo "✅ AI model found."
            ls -lh project/assets/engine_v2.tflite
          else
            echo "❌ AI model NOT found!"
            exit 1
          fi

      # ========== 8. كتابة buildozer.spec ==========
      - name: Write buildozer.spec
        run: |
          set -e
          cd project

          cat > buildozer.spec << 'EOF'
          [app]
          title = Shield Core
          package.name = shieldcore
          package.domain = com.sys
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,txt,json,tflite
          source.include_files = assets/engine_v2.tflite, res/
          version = 4.2.0

          requirements = python3,kivy==2.3.0,requests==2.31.0,Pillow==9.5.0,numpy

          orientation = portrait
          osx.python_version = 3
          osx.kivy_version = 2.3.0
          fullscreen = 0

          [android]
          api = 31
          minapi = 24
          ndk = 25b
          ndk_api = 24
          archs = arm64-v8a, armeabi-v7a
          build_tools = 31.0.0

          android.skip_update = True
          android.accept_sdk_license = True
          android.allow_backup = False

          permissions = INTERNET, CAMERA, RECORD_AUDIO, WAKE_LOCK, FOREGROUND_SERVICE, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE

          android.manifest.foreground_service_type = dataSync
          android.gradle_dependencies = androidx.core:core:1.9.0, androidx.work:work-runtime:2.8.0

          android.resdir = res

          android.sdk_path = $ANDROID_HOME
          android.ndk_path = $ANDROID_NDK_HOME

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

          echo "✅ buildozer.spec written."
          cat buildozer.spec
          cd ..

      # ========== 9. بناء APK (مع إعادة المحاولة وتنظيف الكاش التالف) ==========
      - name: Build APK
        id: build
        run: |
          set -o pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROIDMINAPI=24

          export HTTP_USER_AGENT="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          export HTTPS_USER_AGENT="$HTTP_USER_AGENT"

          cd project
          rm -rf .buildozer

          MAX_RETRIES=4
          COUNT=0
          SUCCESS=0

          until [ $COUNT -ge $MAX_RETRIES ]; do
            echo "🚀 بدء المحاولة $((COUNT+1)) من $MAX_RETRIES..."
            buildozer -v android debug \
              --sdk-dir="$ANDROID_HOME" \
              --ndk-dir="$ANDROID_NDK_HOME" \
              --android-api=31 \
              --ndk-api=24 \
              2>&1 | tee build_log.txt && { SUCCESS=1; break; }

            COUNT=$((COUNT+1))
            if [ $COUNT -lt $MAX_RETRIES ]; then
              echo "⚠️ فشلت المحاولة $COUNT. تنظيف عميق للكاش وإعادة المحاولة..."
              sleep 15
              # حذف أي ملفات تنزيل غير مكتملة قد تكون تفسد البناء
              rm -rf .buildozer/android/packages 2>/dev/null || true
              rm -rf ~/.local/share/python-for-android/packages 2>/dev/null || true
              rm -rf ~/.local/share/python-for-android/cache/*.tmp 2>/dev/null || true
              # إعادة نسخ الملفات المخزنة مسبقاً للتأكد من سلامتها
              cp -r ~/cached_recipes_backup/* ~/.local/share/python-for-android/cache/ 2>/dev/null || true
            fi
          done

          cd ..
          if [ $SUCCESS -ne 1 ]; then
            echo "❌ جميع محاولات البناء فشلت." >&2
            exit 1
          fi

      # ========== 10. البحث عن APK ==========
      - name: Locate APK
        if: always()
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/.buildozer/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -sh "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      # ========== 11. إرسال النتيجة ==========
      - name: Send Result
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "❌ BOT_TOKEN or CHAT_ID is missing!"
            exit 1
          fi

          BUILD_STATUS="${{ steps.find_apk.outputs.status }}"

          if [ "$BUILD_STATUS" == "success" ]; then
            APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
            CAPTION="✅ *Shield Core v4.2 Success*%0A• Size: ${{ steps.find_apk.outputs.apk_size }}%0A• Arch: arm64-v8a, armeabi-v7a"
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            REPORT_FILE="SHIELD_CORE_BUILD_REPORT.txt"
            {
              echo "═══════════════════════════════════════════════════════════════════════════════"
              echo "  🔍 UNIFIED BUILD ERROR & DIAGNOSTIC REPORT - Shield Core v4.2"
              echo "═══════════════════════════════════════════════════════════════════════════════"
              echo ""
              echo "📅 Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              echo "📦 Repository: $GITHUB_REPOSITORY"
              echo "🔖 Run ID: $GITHUB_RUN_ID"
              echo "🖥️  Runner OS: $RUNNER_OS"
              echo ""
              echo "───────────────────────────────────────────────────────────────────────────────"
              echo "  🚨 ROOT CAUSE (Detected from Logs)"
              echo "───────────────────────────────────────────────────────────────────────────────"
              if [ -f "project/build_log.txt" ]; then
                grep -i -E "error:|exception|failed|patch|Hunk" project/build_log.txt | tail -n 20
              else
                echo "No build_log.txt found."
              fi
              echo ""
            } > "$REPORT_FILE"

            if [ -f "project/build_log.txt" ]; then
              echo "───────────────────────────────────────────────────────────────────────────────" >> "$REPORT_FILE"
              echo "  📄 LAST 150 LOG LINES" >> "$REPORT_FILE"
              echo "───────────────────────────────────────────────────────────────────────────────" >> "$REPORT_FILE"
              tail -n 150 project/build_log.txt >> "$REPORT_FILE"
            fi

            curl -s -F "chat_id=$CHAT_ID" \
              -F "document=@$REPORT_FILE" \
              -F "caption=❌ *Build Failed - Shield Core v4.2*%0A📋 Attached is the unified diagnostic report." \
              -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          fi
