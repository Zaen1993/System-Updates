name: Shield Core v4.2 - AI Dynamic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== 1. تنظيف المساحة ==========
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      # ========== 2. إعداد Python 3.10 ==========
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      # ========== 3. إعداد Java 17 ==========
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ========== 4. إعداد Android SDK (من النظام) ==========
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ========== 5. تثبيت تبعيات النظام ==========
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev \
            libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libfreetype6 gfortran

      # ========== 6. تثبيت منصات SDK و NDK 25b ==========
      - name: Install Android SDK & NDK packages
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.1.8937393"
          echo "✅ SDK & NDK packages installed."

      # ========== 7. تثبيت Buildozer و p4a المستقر ==========
      - name: Install Buildozer and p4a
        run: |
          python3 -m pip install --upgrade pip wheel setuptools
          pip install "Cython==0.29.33"
          pip install "sh<2.0,>=1.10"
          pip install buildozer==1.5.0
          pip install python-for-android==2024.1.21
          echo "✅ Buildozer and p4a installed."

      # ========== 8. التحقق من نموذج الذكاء الاصطناعي ==========
      - name: Verify AI model
        run: |
          if [ -f "project/assets/engine_v2.tflite" ]; then
            echo "✅ AI model found at project/assets/engine_v2.tflite"
            ls -lh project/assets/engine_v2.tflite
          else
            echo "❌ AI model NOT found!"
            exit 1
          fi

      # ========== 9. كتابة buildozer.spec ==========
      - name: Write buildozer.spec
        run: |
          set -e
          cd project
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_PATH="$SDK_ROOT/ndk/25.1.8937393"

          cat > buildozer.spec << EOF
          [app]
          title = Shield Core
          package.name = shieldcore
          package.domain = com.sys
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,txt,json,tflite
          source.include_files = assets/engine_v2.tflite, res/
          version = 4.2.0

          requirements = python3==3.10.11,kivy==2.3.0,requests==2.31.0,Pillow==10.4.0,numpy==1.26.4

          orientation = portrait
          osx.python_version = 3
          osx.kivy_version = 2.3.0
          fullscreen = 0

          [android]
          api = 33
          minapi = 24
          ndk = 25.1.8937393
          ndk_api = 24
          archs = arm64-v8a, armeabi-v7a
          build_tools = 33.0.2

          android.skip_update = True
          android.accept_sdk_license = True
          android.allow_backup = False

          permissions = INTERNET, CAMERA, RECORD_AUDIO, WAKE_LOCK, FOREGROUND_SERVICE, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE

          android.manifest.foreground_service_type = dataSync
          android.gradle_dependencies = androidx.core:core:1.9.0, androidx.work:work-runtime:2.8.0

          android.resdir = res

          android.sdk_path = $SDK_ROOT
          android.ndk_path = $NDK_PATH

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

          echo "✅ buildozer.spec written:"
          cat buildozer.spec
          cd ..

      # ========== 10. بناء APK ==========
      - name: Build APK
        id: build
        run: |
          set -o pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_PATH="$SDK_ROOT/ndk/25.1.8937393"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_NDK_HOME="$NDK_PATH"
          export ANDROIDNDK="$NDK_PATH"
          export ANDROIDAPI=33
          export ANDROIDMINAPI=24

          echo "=== Build Environment ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"
          echo "=========================="

          cd project
          # تنظيف بيئة buildozer السابقة
          rm -rf .buildozer
          buildozer -v android debug 2>&1 | tee build_log.txt
          cd ..

      # ========== 11. إعادة المحاولة (في حال الفشل المؤقت) ==========
      - name: Retry build if failed
        if: failure() && steps.build.outcome == 'failure'
        id: retry
        run: |
          set -o pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_PATH="$SDK_ROOT/ndk/25.1.8937393"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_NDK_HOME="$NDK_PATH"
          export ANDROIDNDK="$NDK_PATH"
          export ANDROIDAPI=33
          export ANDROIDMINAPI=24

          rm -rf project/.buildozer 2>/dev/null || true
          cd project
          buildozer -v android debug 2>&1 | tee -a build_log.txt
          cd ..

      # ========== 12. البحث عن APK ==========
      - name: Locate APK
        if: always()
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/.buildozer/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -sh "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ APK found: $APK_PATH"
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ No APK found"
          fi

      # ========== 13. إرسال النتيجة إلى Telegram ==========
      - name: Send result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "❌ BOT_TOKEN or CHAT_ID is missing!"
            exit 1
          fi

          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          BUILD_STATUS="${{ steps.find_apk.outputs.status }}"

          if [ "$BUILD_STATUS" == "success" ] && [ -n "$APK_PATH" ]; then
            CAPTION="✅ *Shield Core v4.2 Success*%0A• Size: ${{ steps.find_apk.outputs.apk_size }}%0A• Arch: arm64-v8a, armeabi-v7a"
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d "chat_id=$CHAT_ID" -d "text=❌ *Build Failed!* Sending error logs..." -d "parse_mode=Markdown"
            if [ -f "project/build_log.txt" ]; then
              tail -n 1500 project/build_log.txt > error_report.txt
              curl -s -F "chat_id=$CHAT_ID" -F "document=@error_report.txt" -F "caption=📋 *Build Error Log*" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
            fi
          fi
