name: Build APK (Auto - No Manual SDK/NDK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
          build-essential python3-dev libsqlite3-dev libltdl-dev libgmp-dev ant libncurses5
          pip3 install --user --upgrade "cython<3.0.0" buildozer wheel setuptools
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Clean previous build artifacts
        run: |
          rm -rf .buildozer/ ~/.buildozer/ bin/ build_log.txt
          buildozer android clean || true

      - name: Prepare buildozer.spec (minimal changes)
        run: |
          # البحث عن ملف buildozer.spec ونسخه إلى الجذر
          SPEC_FILE=$(find . -name "buildozer.spec" -type f | head -n 1)
          if [ -z "$SPEC_FILE" ]; then
            echo "❌ buildozer.spec not found!"
            exit 1
          fi
          cp "$SPEC_FILE" ./buildozer.spec
          # حذف أي مسارات SDK/NDK يدوية (لنترك Buildozer يتحكم بها)
          sed -i '/^android.sdk_path\s*=/d' buildozer.spec
          sed -i '/^android.ndk_path\s*=/d' buildozer.spec
          # تفعيل قبول التراخيص التلقائي
          sed -i 's|^#\?android.accept_sdk_license\s*=.*|android.accept_sdk_license = True|' buildozer.spec
          # تثبيت مسار Ant
          sed -i 's|^#\?android.ant_path\s*=.*|android.ant_path = /usr/bin/ant|' buildozer.spec
          # تعطيل tflite-runtime مؤقتاً لتجنب فشل التصحيح
          sed -i 's/,tflite-runtime==2.14.0//g' buildozer.spec
          sed -i 's/,tflite-runtime//g' buildozer.spec
          echo "✅ buildozer.spec ready"

      - name: Prepare assets (model only, no icon)
        run: |
          mkdir -p assets
          if [ -f "project/assets/engine_v2.tflite" ]; then
            cp "project/assets/engine_v2.tflite" assets/engine_v2.tflite
          elif [ ! -f "assets/engine_v2.tflite" ]; then
            dd if=/dev/zero of=assets/engine_v2.tflite bs=1024 count=1
          fi
          # حذف أي مجلد res/ قد يسبب تعارضاً مع Gradle
          rm -rf res/ 2>/dev/null || true
          echo "✅ assets ready"

      - name: Build APK
        env:
          _JAVA_OPTIONS: "-Xmx4g"
        run: |
          buildozer -v android debug 2>&1 | tee build_log.txt

      - name: Send result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH=$(find bin -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" \
              -F "caption=✅ System Core v.3.1.0 built successfully" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            [ ! -f build_log.txt ] && echo "No log" > build_log.txt
            curl -F "chat_id=$CHAT_ID" -F "document=@build_log.txt" \
              -F "caption=❌ Build failed - Check log" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
            exit 1
          fi
