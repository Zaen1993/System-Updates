name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Java 17 and system dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libglew-dev

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: Set Java environment variables
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Install Python and Buildozer
        run: |
          pip3 install --upgrade pip
          pip3 install --user "cython<3.0" buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Android SDK and NDK manually
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          mkdir -p ~/.buildozer/android/platform
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
          mv cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q android-ndk-r25b-linux.zip
          mv android-ndk-r25b ~/.buildozer/android/platform/android-ndk-r25b
          
          yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.1" "platform-tools"

      - name: Configure Buildozer
        run: |
          cd project
          mkdir -p res/drawable
          if [ ! -f "res/drawable/ic_launcher.png" ]; then
            touch res/drawable/ic_launcher.png
          fi
          sed -i 's|^#\? \?icon.filename =.*|icon.filename = %(source.dir)s/res/drawable/ic_launcher.png|' buildozer.spec
          sed -i 's|^#\? \?android.accept_sdk_license =.*|android.accept_sdk_license = True|' buildozer.spec
          sed -i 's|^#\? \?android.skip_update =.*|android.skip_update = True|' buildozer.spec
          sed -i 's|^#\? \?android.api =.*|android.api = 33|' buildozer.spec
          sed -i 's|^#\? \?android.ndk =.*|android.ndk = 25b|' buildozer.spec

      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          cd project
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: system-update
          path: project/bin/*.apk

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK=$(find project/bin -name "*.apk" | head -n 1)
          if [ -f "$APK" ]; then
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK" -F "caption=✅ APK v2.0 ready." \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            echo "APK not found"
            exit 1
          fi
