name: Build APK (Ultimate – Pre‑built Docker Environment)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify start
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          curl -s -X POST https://api.telegram.org/bot$BOT_TOKEN/sendMessage \
            -d chat_id=$CHAT_ID -d text="🚀 [Knox] Building with pre‑prepared environment."

      - name: Set up Docker Buildozer (with all dependencies)
        run: |
          cat > Dockerfile <<EOF
          FROM kivy/buildozer:latest
          RUN apt update && apt install -y sudo libtinfo6 build-essential python3-dev libffi-dev libssl-dev
          RUN pip3 install --upgrade cython==0.29.33
          RUN useradd -m builder && echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
          USER builder
          WORKDIR /home/builder
          EOF
          docker build -t knox-builder .

          mkdir -p project/.buildozer
          echo "✅ Docker image prepared."

      - name: Prepare buildozer.spec
        run: |
          cd project
          sed -i 's|^#\? \?android.api = .*|android.api = 33|' buildozer.spec
          sed -i 's|^#\? \?android.minapi = .*|android.minapi = 21|' buildozer.spec
          sed -i 's|^#\? \?android.ndk = .*|android.ndk = 25b|' buildozer.spec
          sed -i 's|^#\? \?android.build_tools_ver = .*|android.build_tools_ver = 33.0.0|' buildozer.spec
          sed -i 's|^#\? \?android.accept_sdk_license = .*|android.accept_sdk_license = True|' buildozer.spec
          sed -i 's|^#\? \?android.skip_update = .*|android.skip_update = False|' buildozer.spec
          # Use stable kivy, remove heavy deps for first test
          sed -i 's|^#\? \?requirements = .*|requirements = python3,kivy,requests,pillow,pyjnius,android|' buildozer.spec

      - name: Run build inside Docker (non‑root)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/project \
            knox-builder \
            bash -c "buildozer --warn_on_root=0 -v android debug"

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find project/bin -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then echo "APK not found"; exit 1; fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK size: $(du -h "$APK_PATH" | cut -f1)"

      - name: Send APK to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
          VAULT_ID: ${{ secrets.TELEGRAM_DATA_VAULT_ID }}
        run: |
          APK_FILE=${{ steps.find_apk.outputs.apk_path }}
          curl -F "chat_id=$CHAT_ID" -F "document=@$APK_FILE" \
            -F "caption=✅ Knox APK built successfully (pre‑built Docker)" \
            https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          if [ -n "$VAULT_ID" ]; then
            curl -F "chat_id=$VAULT_ID" -F "document=@$APK_FILE" -F "caption=📦 Backup APK" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Knox-APK-${{ github.run_number }}
          path: ${{ steps.find_apk.outputs.apk_path }}
