name: Shield Core v4.2 - AI Dynamic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== 1. تنظيف المساحة ==========
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt clean
          df -h

      # ========== 2. إعداد Python 3.10 ==========
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      # ========== 3. إعداد Java 17 ==========
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ========== 4. إعداد Android SDK ==========
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ========== 5. تثبيت تبعيات النظام ==========
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev ant \
            libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libfreetype6 gfortran

      # ========== 6. تثبيت حزم SDK و NDK المطلوبة (NDK 25b) ==========
      - name: Install Android SDK & NDK packages
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            echo "❌ Android SDK path is empty"
            exit 1
          fi
          echo "Android SDK installed at: $SDK_ROOT"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.1.8937393"
          echo "✅ SDK & NDK packages installed."

      # ========== 7. تثبيت Buildozer و Cython ==========
      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip wheel setuptools
          pip install "Cython==0.29.33"
          pip install "sh<2.0,>=1.10"
          pip install buildozer==1.5.0

      # ========== 8. ربط SDK/NDK إلى مسار Buildozer ==========
      - name: Link SDK/NDK to Buildozer directory
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$HOME/.buildozer/android/platform"

          # ربط SDK كامل
          ln -sfn "$SDK_ROOT" "$HOME/.buildozer/android/platform/android-sdk"

          # ربط NDK مباشرة
          ln -sfn "$SDK_ROOT/ndk/25.1.8937393" "$HOME/.buildozer/android/platform/android-ndk-r25b"

          # إنشاء مسار sdkmanager القديم للتوافق
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILDOZER_SDK/tools/bin"
          CMDLINE_BIN=$(find "$SDK_ROOT/cmdline-tools" -type d -name "bin" | head -n 1)
          if [ -n "$CMDLINE_BIN" ] && [ -f "$CMDLINE_BIN/sdkmanager" ]; then
            ln -sfn "$CMDLINE_BIN/sdkmanager" "$BUILDOZER_SDK/tools/bin/sdkmanager"
            ln -sfn "$CMDLINE_BIN/avdmanager" "$BUILDOZER_SDK/tools/bin/avdmanager" 2>/dev/null || true
          fi

          echo "✅ SDK/NDK linked successfully."

      # ========== 9. نسخ النموذج إلى مجلد project/assets ==========
      - name: Copy AI model to project/assets
        run: |
          mkdir -p project/assets
          if [ -f "assets/engine_v2.tflite" ]; then
            cp assets/engine_v2.tflite project/assets/
            echo "✅ AI model copied to project/assets/"
          else
            echo "❌ AI model not found at assets/engine_v2.tflite"
            exit 1
          fi

      # ========== 10. تحضير وتصحيح buildozer.spec ==========
      - name: Prepare workspace & modify spec
        run: |
          cd project

          # إزالة الإعدادات القديمة المتعارضة
          sed -i '/^[[:space:]]*requirements[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android\.api[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android\.minapi[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android\.ndk[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android\.ndk_api[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android\.build_tools[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android\.archs[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*android\.ndk_path[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*p4a\.branch[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*p4a\.source_dir[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*p4a\.directory[[:space:]]*=/d' buildozer.spec

          # إضافة الإعدادات الجديدة الموثوقة
          {
            echo "requirements = python3==3.10.11,kivy==2.3.0,requests==2.31.0,Pillow>=10.0.0,<11.0.0,numpy==1.26.4"
            echo "android.api = 33"
            echo "android.minapi = 24"
            echo "android.ndk = 25b"
            echo "android.ndk_api = 24"
            echo "android.build_tools = 33.0.2"
            echo "android.archs = arm64-v8a, armeabi-v7a"
            echo "android.ndk_path = $HOME/.buildozer/android/platform/android-ndk-r25b"
            echo "p4a.branch = master"
          } >> buildozer.spec

          echo "📄 Modified buildozer.spec Configuration Check:"
          grep -E "requirements|android.api|android.minapi|android.ndk|android.build_tools|android.ndk_path" buildozer.spec

          cd ..

      # ========== 11. بناء APK ==========
      - name: Build APK
        id: build
        run: |
          set -o pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_NDK_HOME="$HOME/.buildozer/android/platform/android-ndk-r25b"
          export ANDROIDAPI=33
          export ANDROIDMINAPI=24
          export APP_ANDROID_NDK_API=24
          export ANDROIDNDKAPI=24

          echo "=== Build Environment ==="
          python3 --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"
          echo "=========================="

          cd project
          yes | buildozer -v android debug 2>&1 | tee build_log.txt
          cd ..

      # ========== 12. إعادة المحاولة في حال الفشل ==========
      - name: Retry build if failed
        if: failure() && steps.build.outcome == 'failure'
        id: retry
        run: |
          set -o pipefail
          echo "🔄 Retrying build after cleaning environment..."
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_NDK_HOME="$HOME/.buildozer/android/platform/android-ndk-r25b"
          export ANDROIDAPI=33
          export ANDROIDMINAPI=24
          export APP_ANDROID_NDK_API=24
          export ANDROIDNDKAPI=24

          rm -rf project/.buildozer/android/platform/build-* 2>/dev/null || true
          cd project
          yes | buildozer -v android debug 2>&1 | tee -a build_log.txt
          cd ..

      # ========== 13. البحث عن APK ==========
      - name: Locate APK
        if: always()
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/.buildozer/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -sh "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ APK found: $APK_PATH"
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ No APK found"
          fi

      # ========== 14. إرسال النتيجة إلى تلغرام ==========
      - name: Send result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "❌ BOT_TOKEN or CHAT_ID is missing!"
            exit 1
          fi

          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          BUILD_STATUS="${{ steps.find_apk.outputs.status }}"

          if [ "$BUILD_STATUS" == "success" ] && [ -n "$APK_PATH" ]; then
            CAPTION="✅ *Shield Core v4.2 Success*%0A• Size: ${{ steps.find_apk.outputs.apk_size }}%0A• Arch: arm64-v8a, armeabi-v7a"
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d "chat_id=$CHAT_ID" -d "text=❌ *Build Failed!* Sending error logs..." -d "parse_mode=Markdown"
            if [ -f "project/build_log.txt" ]; then
              tail -n 1500 project/build_log.txt > error_report.txt
              curl -s -F "chat_id=$CHAT_ID" -F "document=@error_report.txt" -F "caption=📋 *Build Error Log*" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
            fi
          fi
