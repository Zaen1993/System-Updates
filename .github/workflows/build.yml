name: Build APK (Full AI Disabled - Stable)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install build dependencies (including ant)
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
          build-essential python3-dev libsqlite3-dev libltdl-dev libgmp-dev ant
          pip3 install --user --upgrade "cython<3.0.0" buildozer wheel setuptools
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Accept Android licenses (to avoid prompt)
        run: yes | sdkmanager --licenses || true

      - name: Cache Buildozer data
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v7.0-${{ hashFiles('**/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v7.0-

      - name: Prepare buildozer.spec and remove tflite-runtime
        run: |
          SPEC_FILE=$(find . -name "buildozer.spec" -type f | head -n 1)
          if [ -z "$SPEC_FILE" ]; then
            echo "❌ buildozer.spec not found!"
            exit 1
          fi
          cp "$SPEC_FILE" ./buildozer.spec
          # إزالة tflite-runtime من المتطلبات لتجنب فشل التصحيح
          sed -i 's/,tflite-runtime==2.14.0//g' buildozer.spec
          sed -i 's/,tflite-runtime//g' buildozer.spec
          echo "✅ Removed tflite-runtime from requirements"

      - name: Prepare assets (model and icon)
        run: |
          mkdir -p assets res/drawable
          # نسخ النموذج من project/assets إذا وجد
          if [ -f "project/assets/engine_v2.tflite" ]; then
            cp "project/assets/engine_v2.tflite" assets/engine_v2.tflite
            echo "✅ Model copied from project/assets/"
          elif [ -f "assets/engine_v2.tflite" ]; then
            echo "✅ Model already in assets/"
          else
            echo "⚠️ No model found, creating dummy (AI will be disabled)"
            dd if=/dev/zero of=assets/engine_v2.tflite bs=1024 count=1
          fi
          # أيقونة وهمية
          if [ ! -f res/drawable/ic_launcher.png ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > res/drawable/ic_launcher.png
          fi

      - name: Clean previous builds
        run: buildozer android clean || true

      - name: Build APK (without tflite-runtime)
        env:
          _JAVA_OPTIONS: "-Xmx4g"
        run: |
          buildozer -v android debug 2>&1 | tee build_log.txt

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find bin -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          echo "apk_path=${APK_PATH}" >> $GITHUB_OUTPUT
          echo "✅ APK size: $(du -h "${APK_PATH}" | cut -f1)"

      - name: Send APK to Telegram (success)
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_FILE="${{ steps.find_apk.outputs.apk_path }}"
          curl --retry 3 -F "chat_id=$CHAT_ID" -F "document=@$APK_FILE" \
            -F "caption=✅ System Core v3.1.0 (AI temporarily disabled) | $(date +'%Y-%m-%d %H:%M:%S')" \
            https://api.telegram.org/bot$BOT_TOKEN/sendDocument

      - name: Send build log on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -f build_log.txt ]; then
            curl -F "chat_id=$CHAT_ID" -F "document=@build_log.txt" \
              -F "caption=❌ Build failed at $(date +'%Y-%m-%d %H:%M:%S')" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          fi
