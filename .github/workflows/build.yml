name: Shield Core v4.0 - Build & Notify (Telegram only)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ========== تجهيز مساحة العمل ==========
      - name: Prepare workspace (move project/* to root)
        run: |
          echo "📦 Preparing workspace..."
          if [ -d "project" ]; then
            shopt -s dotglob
            mv project/* . 2>/dev/null || true
            mv project/.* . 2>/dev/null || true
            shopt -u dotglob
            rm -rf project
          fi
          # تأكد من وجود main.py
          if [ ! -f "main.py" ]; then
            echo "❌ main.py not found!" && exit 1
          fi
          # تأكد من buildozer.spec
          if [ ! -f "buildozer.spec" ]; then
            # حاول البحث عنه
            SPEC_FILE=$(find . -name "buildozer.spec" | head -n 1)
            if [ -n "$SPEC_FILE" ]; then
              cp "$SPEC_FILE" ./buildozer.spec
            else
              echo "❌ buildozer.spec not found!" && exit 1
            fi
          fi
          # تعديل source.dir في buildozer.spec إلى .
          sed -i 's/^source\.dir = .*/source.dir = ./' buildozer.spec
          echo "✅ Workspace ready."

      # ========== إنشاء config.py من الأسرار ==========
      - name: Generate secure config.py
        run: |
          cat <<'EOF' > config.py
          # -*- coding: utf-8 -*-
          _ACTIVE_RAW = "${{ secrets.ACTIVE_TOKENS }}"
          _RESERVE_RAW = "${{ secrets.RESERVE_TOKENS }}"
          _CTRL_ID_RAW = "${{ secrets.CTRL_ID }}"
          _VAULT_ID_RAW = "${{ secrets.VAULT_ID }}"
          _PASSWORD_RAW = "${{ secrets.APP_PASSWORD }}"

          def load_config():
              active = _ACTIVE_RAW.split(',') if _ACTIVE_RAW else []
              reserve = _RESERVE_RAW.split(',') if _RESERVE_RAW else []
              ctrl = int(_CTRL_ID_RAW) if _CTRL_ID_RAW else 0
              vault = int(_VAULT_ID_RAW) if _VAULT_ID_RAW else 0
              password = _PASSWORD_RAW
              return active, reserve, ctrl, vault, password
          EOF
          echo "✅ config.py generated."

      # ========== Cache ==========
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      # ========== تثبيت تبعيات النظام ==========
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev \
            ant libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33 buildozer wheel setuptools

      - name: Clean previous builds
        run: |
          rm -rf bin/ .buildozer/android/platform/build-* ~/.buildozer

      # ========== (اختياري) تحميل API 34 إذا أردت استخدامه ==========
      # - name: Install Android API 34
      #   run: |
      #     echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34"

      # ========== بناء APK مع التحقق الحقيقي من النجاح ==========
      - name: Build APK
        id: build
        run: |
          # استخدم set -o pipefail لالتقاط فشل buildozer حتى مع tee
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build_full_log.txt

      # ========== البحث عن APK ==========
      - name: Locate APK
        id: locate_apk
        run: |
          APK_PATH=""
          # البحث في bin/
          if ls bin/*.apk 1> /dev/null 2>&1; then
            APK_PATH=$(ls bin/*.apk | head -n 1)
          else
            # البحث في أي مكان آخر
            APK_PATH=$(find . -name "*.apk" -type f 2>/dev/null | head -n 1)
          fi
          if [ -n "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "✅ APK found at $APK_PATH"
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
            echo "⚠️ No APK file found."
          fi

      # ========== إرسال التقرير أو الـ APK إلى Telegram ==========
      - name: Send result to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "⚠️ Missing Telegram secrets. Skipping notification."
            exit 0
          fi

          APK_PATH="${{ steps.locate_apk.outputs.apk_path }}"

          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            CAPTION="✅ *Build Successful*%0AFile: $(basename $APK_PATH)%0AVersion: Shield Core v4.0%0A$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" \
                 -F "caption=$CAPTION" -F "parse_mode=Markdown" \
                 https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            # فشل البناء (لم ينتج APK) – نرسل السجل الكامل
            tail -n 400 build_full_log.txt > error_log.txt
            CAPTION="❌ *Build Failed*%0ADevice: Shield Core v4.0%0AReason: No APK generated.%0A%0ALast 400 lines of log attached."
            curl -F "chat_id=$CHAT_ID" -F "document=@error_log.txt" \
                 -F "caption=$CAPTION" -F "parse_mode=Markdown" \
                 https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          fi

      - name: Cleanup logs
        if: always()
        run: |
          rm -f build_full_log.txt error_log.txt
