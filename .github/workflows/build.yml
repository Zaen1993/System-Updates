name: Shield Core v4.2 - AI Dynamic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== 1. تنظيف المساحة ==========
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      # ========== 2. إعداد Python 3.10 ==========
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      # ========== 3. إعداد Java 17 ==========
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ========== 4. إعداد Android SDK ==========
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ========== 5. تثبيت تبعيات النظام ==========
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev \
            libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libfreetype6 gfortran

      # ========== 6. تثبيت SDK (API 31 + 33) و NDK 25b ==========
      - name: Install Android SDK & NDK packages
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_PATH="$SDK_ROOT/ndk/25.1.8937393"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses || true

          # تثبيت API 31 و 33 معاً
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-31" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.1.8937393"

          # إعداد مسار Buildozer وقبول التراخيص
          BUILDOZER_SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILDOZER_SDK_DIR/licenses"
          mkdir -p "$BUILDOZER_SDK_DIR/tools/bin"

          echo "24333f8a637b3744d16de1229303181f4247e684" > "$BUILDOZER_SDK_DIR/licenses/android-sdk-license"
          echo "84831b9402116e267be31215b248a33045ce379a" >> "$BUILDOZER_SDK_DIR/licenses/android-sdk-license"
          echo "d97531e834a4173572f1593404534000e026d7bc" >> "$BUILDOZER_SDK_DIR/licenses/android-sdk-license"
          echo "2737080b29717cd60468788561da5881071d9e24" > "$BUILDOZER_SDK_DIR/licenses/android-sdk-preview-license"

          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$BUILDOZER_SDK_DIR" --licenses || true

          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$BUILDOZER_SDK_DIR/tools/bin/sdkmanager"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" "$BUILDOZER_SDK_DIR/tools/bin/avdmanager"

          # حفظ المتغيرات في بيئة GitHub الرسمية
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROIDNDK=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROIDAPI=33" >> $GITHUB_ENV
          echo "ANDROIDMINAPI=24" >> $GITHUB_ENV

          echo "✅ SDK (API 31 & 33) & NDK 25b installed successfully."

      # ========== 7. تثبيت Buildozer و p4a مع التبعيات ==========
      - name: Install Buildozer and p4a
        run: |
          python3 -m pip install --upgrade pip wheel setuptools
          python3 -m pip install "Cython==0.29.33"
          python3 -m pip install "sh<2.0,>=1.10"
          python3 -m pip install pexpect appdirs colorama jinja2 virtualenv packaging
          python3 -m pip install buildozer==1.5.0 --no-deps
          python3 -m pip install python-for-android==2024.1.21 --no-deps
          echo "✅ Buildozer and dependencies installed."

      # ========== 8. التحقق من نموذج الذكاء الاصطناعي ==========
      - name: Verify AI model
        run: |
          if [ -f "project/assets/engine_v2.tflite" ]; then
            echo "✅ AI model found at project/assets/engine_v2.tflite"
            ls -lh project/assets/engine_v2.tflite
          else
            echo "❌ AI model NOT found!"
            exit 1
          fi

      # ========== 9. كتابة buildozer.spec ==========
      - name: Write buildozer.spec
        run: |
          set -e
          cd project

          cat > buildozer.spec << 'EOF'
          [app]
          title = Shield Core
          package.name = shieldcore
          package.domain = com.sys
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,txt,json,tflite
          source.include_files = assets/engine_v2.tflite, res/
          version = 4.2.0

          # ===== إجبار python3 و hostpython3 على نفس الإصدار =====
          requirements = python3==3.10.11,hostpython3==3.10.11,kivy==2.3.0,requests==2.31.0,Pillow==10.4.0,numpy==1.26.4

          orientation = portrait
          osx.python_version = 3
          osx.kivy_version = 2.3.0
          fullscreen = 0

          [android]
          api = 33
          minapi = 24
          ndk = 25.1.8937393
          ndk_api = 24
          archs = arm64-v8a, armeabi-v7a
          build_tools = 33.0.2

          android.skip_update = True
          android.accept_sdk_license = True
          android.allow_backup = False

          permissions = INTERNET, CAMERA, RECORD_AUDIO, WAKE_LOCK, FOREGROUND_SERVICE, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE

          android.manifest.foreground_service_type = dataSync
          android.gradle_dependencies = androidx.core:core:1.9.0, androidx.work:work-runtime:2.8.0

          android.resdir = res

          # ===== نمرر المسارات كوسائط لأمر buildozer، وليس هنا =====

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

          echo "✅ buildozer.spec written."
          cat buildozer.spec
          cd ..

      # ========== 10. بناء APK ==========
      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_PATH="$SDK_ROOT/ndk/25.1.8937393"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_NDK_HOME="$NDK_PATH"
          export ANDROIDNDK="$NDK_PATH"
          export ANDROIDAPI=33
          export ANDROIDMINAPI=24

          echo "=== Build Environment ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"
          echo "=========================="

          cd project
          rm -rf .buildozer

          # ===== تمرير SDK و NDK كوسائط مباشرة =====
          buildozer -v android debug \
            --sdk-dir="$SDK_ROOT" \
            --ndk-dir="$NDK_PATH" \
            2>&1 | tee build_log.txt
          cd ..

      # ========== 11. إعادة المحاولة ==========
      - name: Retry build if failed
        if: failure() && steps.build.outcome == 'failure'
        id: retry
        continue-on-error: true
        run: |
          set -o pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_PATH="$SDK_ROOT/ndk/25.1.8937393"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_NDK_HOME="$NDK_PATH"
          export ANDROIDNDK="$NDK_PATH"
          export ANDROIDAPI=33
          export ANDROIDMINAPI=24

          rm -rf project/.buildozer 2>/dev/null || true
          cd project
          buildozer -v android debug \
            --sdk-dir="$SDK_ROOT" \
            --ndk-dir="$NDK_PATH" \
            2>&1 | tee -a build_log.txt
          cd ..

      # ========== 12. البحث عن APK ==========
      - name: Locate APK
        if: always()
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/.buildozer/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -sh "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ APK found: $APK_PATH"
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ No APK found"
          fi

      # ========== 13. إنشاء تقرير موحد ==========
      - name: Generate Unified Build Report
        if: always() && steps.find_apk.outputs.status == 'failure'
        id: report
        run: |
          LOG_FILE="project/build_log.txt"
          REPORT_FILE="SHIELD_CORE_BUILD_REPORT.txt"

          {
            echo "╔═══════════════════════════════════════════════════════════════════════════════╗"
            echo "║           🔍 UNIFIED BUILD ERROR & DIAGNOSTIC REPORT - Shield Core v4.2        ║"
            echo "╚═══════════════════════════════════════════════════════════════════════════════╝"
            echo ""
            echo "📅 Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "📦 Repository: $GITHUB_REPOSITORY"
            echo "🔖 Run ID: $GITHUB_RUN_ID"
            echo "🖥️  Runner OS: $RUNNER_OS"
            echo ""
            echo "═══════════════════════════════════════════════════════════════════════════════════"
            echo "  🚨 PRIMARY ERROR LINES DETECTED"
            echo "═══════════════════════════════════════════════════════════════════════════════════"
            echo ""
          } > "$REPORT_FILE"

          if [ -f "$LOG_FILE" ]; then
            grep -i -E "error:|exception|failed|does not exist|NoClassDefFoundError|fatal|Build failed|ModuleNotFoundError|hostpython3" "$LOG_FILE" | head -n 50 >> "$REPORT_FILE" || echo "No specific error patterns matched." >> "$REPORT_FILE"
            echo "" >> "$REPORT_FILE"

            echo "═══════════════════════════════════════════════════════════════════════════════════" >> "$REPORT_FILE"
            echo "  📄 LAST 100 BUILD LOG LINES (TRACE)" >> "$REPORT_FILE"
            echo "═══════════════════════════════════════════════════════════════════════════════════" >> "$REPORT_FILE"
            echo "" >> "$REPORT_FILE"
            tail -n 100 "$LOG_FILE" >> "$REPORT_FILE"
            echo "" >> "$REPORT_FILE"
          else
            echo "❌ CRITICAL: No build_log.txt was produced." >> "$REPORT_FILE"
            echo "" >> "$REPORT_FILE"
          fi

          {
            echo "═══════════════════════════════════════════════════════════════════════════════════"
            echo "  💡 DIAGNOSTIC BREAKDOWN & APPLIED FIXES"
            echo "═══════════════════════════════════════════════════════════════════════════════════"
            echo ""
            echo "1. Python Version Mismatch (3.10.11 != 3.14.2):"
            echo "   → Fixed by forcing hostpython3==3.10.11 in requirements."
            echo "   → This ensures p4a uses the same Python version for both."
            echo ""
            echo "2. Buildozer ignoring p4a.branch and using master:"
            echo "   → Fixed by passing SDK/NDK paths via --sdk-dir and --ndk-dir."
            echo "   → This prevents Buildozer from cloning master."
            echo ""
            echo "3. SDK/NDK Paths not found:"
            echo "   → Fixed by exporting ANDROID_HOME, ANDROID_NDK_HOME via GITHUB_ENV."
            echo ""
            echo "4. API 31 Missing:"
            echo "   → Fixed by installing platforms;android-31 alongside android-33."
            echo ""
            echo "5. sh Version Conflict:"
            echo "   → Fixed by installing sh<2.0 before buildozer."
            echo ""
            echo "6. pexpect Missing:"
            echo "   → Fixed by installing pexpect explicitly in step 7."
            echo ""
            echo "═══════════════════════════════════════════════════════════════════════════════════"
            echo "  ✅ RECOMMENDED SOLUTIONS (in accordance with GitHub Actions best practices)"
            echo "═══════════════════════════════════════════════════════════════════════════════════"
            echo ""
            echo "1. 🔹 Use --sdk-dir and --ndk-dir in buildozer command instead of buildozer.spec"
            echo "2. 🔹 Export environment variables via GITHUB_ENV (not just export in steps)"
            echo "3. 🔹 Always install pexpect and sh<2.0 before buildozer"
            echo "4. 🔹 Use p4a.directory or p4a.source_dir with a pre-cloned p4a version"
            echo "5. 🔹 Install both API 31 and 33 to satisfy p4a requirements"
            echo "6. 🔹 Use --no-deps when installing buildozer and p4a"
            echo ""
            echo "───────────────────────────────────────────────────────────────────────────────"
            echo "End of Unified Report - $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } >> "$REPORT_FILE"

          echo "✅ Unified report generated: $REPORT_FILE"

      # ========== 14. إرسال النتيجة ==========
      - name: Send Result (APK or Unified Report)
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "❌ BOT_TOKEN or CHAT_ID is missing!"
            exit 1
          fi

          BUILD_STATUS="${{ steps.find_apk.outputs.status }}"

          if [ "$BUILD_STATUS" == "success" ]; then
            APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
            CAPTION="✅ *Shield Core v4.2 Success*%0A• Size: ${{ steps.find_apk.outputs.apk_size }}%0A• Arch: arm64-v8a, armeabi-v7a"
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            if [ -f "SHIELD_CORE_BUILD_REPORT.txt" ]; then
              curl -s -F "chat_id=$CHAT_ID" \
                -F "document=@SHIELD_CORE_BUILD_REPORT.txt" \
                -F "caption=❌ *Build Failed - Shield Core v4.2*%0A📋 Attached is the unified diagnostic & log report." \
                -F "parse_mode=Markdown" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
            else
              curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
                -d "chat_id=$CHAT_ID" -d "text=❌ *Build Failed!*%0ANo report or APK generated." -d "parse_mode=Markdown"
            fi
          fi
