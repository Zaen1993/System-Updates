name: Build APK (Final Working Version)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
          build-essential python3-dev libsqlite3-dev libltdl-dev libgmp-dev ant libncurses5 \
          cmake ninja-build
          pip3 install --user --upgrade "cython<3.0.0" buildozer wheel setuptools
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup legacy Android SDK (compatible with Buildozer)
        run: |
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-6609375_latest.zip -O clt.zip
          unzip -q clt.zip
          # هذه النسخة لديها المجلد 'tools' مباشرة وليس 'cmdline-tools'
          # نعيد تسميته إلى 'tools' إذا لزم الأمر (هو بالفعل tools)
          ls -la
          echo "$HOME/android-sdk/tools/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          # قبول التراخيص
          yes | $HOME/android-sdk/tools/bin/sdkmanager --licenses || true

      - name: Create minimal buildozer.spec
        run: |
          cat <<'EOF' > buildozer.spec
          [app]
          title = System Core
          package.name = systemcore
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,tflite
          version = 3.1.0
          requirements = python3,kivy==2.3.0,requests,pillow
          orientation = portrait
          fullscreen = 0
          android.accept_sdk_license = True
          android.minapi = 21
          android.api = 34
          android.ndk = 25b
          android.sdk = 34
          android.archs = arm64-v8a
          android.allow_backup = True
          android.gradle_dependencies_cache = True
          [buildozer]
          log_level = 2
          EOF
          echo "✅ buildozer.spec created"

      - name: Prepare assets
        run: |
          mkdir -p assets
          if [ -f "project/assets/engine_v2.tflite" ]; then
            cp "project/assets/engine_v2.tflite" assets/engine_v2.tflite
          elif [ ! -f "assets/engine_v2.tflite" ]; then
            dd if=/dev/zero of=assets/engine_v2.tflite bs=1024 count=1
          fi
          rm -rf res/ 2>/dev/null || true
          echo "✅ assets ready"

      - name: Clean previous builds
        run: rm -rf .buildozer/ bin/ ~/.buildozer/

      - name: Build APK
        env:
          _JAVA_OPTIONS: "-Xmx4g"
        run: |
          buildozer -v android debug 2>&1 | tee build_log.txt

      - name: Send result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH=$(find bin -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" \
              -F "caption=✅ Build Success! APK ready." \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            [ ! -f build_log.txt ] && echo "No log" > build_log.txt
            curl -F "chat_id=$CHAT_ID" -F "document=@build_log.txt" \
              -F "caption=❌ Build failed - Check log" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
            exit 1
          fi
