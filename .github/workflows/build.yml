name: Shield Core v4.2 - AI Dynamic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== 1. تنظيف المساحة ==========
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      # ========== 2. إعداد Python 3.10 ==========
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      # ========== 3. إعداد Java 17 ==========
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ========== 4. إعداد Android SDK (بيئة Runner المثبتة مسبقاً) ==========
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ========== 5. تثبيت تبعيات النظام ==========
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev \
            libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libfreetype6 gfortran curl ccache

      # ========== 6. تثبيت Buildozer و p4a ==========
      - name: Install Buildozer and p4a
        run: |
          python3 -m pip install --upgrade pip wheel setuptools
          python3 -m pip install "Cython==0.29.33"
          python3 -m pip install "sh<2.0,>=1.10"
          python3 -m pip install pexpect appdirs colorama jinja2 virtualenv packaging
          python3 -m pip install buildozer==1.5.0
          python3 -m pip install python-for-android==2024.1.21
          echo "✅ Buildozer and p4a installed."

      # ========== 7. تثبيت NDK 25b عبر sdkmanager ==========
      - name: Install NDK 25b
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          # قبول التراخيص
          yes | sdkmanager --licenses || true

          # تثبيت NDK 25b و platform 33 و build-tools 33.0.2
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "ndk;25.1.8937393" "platform-tools"

          # إعداد مجلد Buildozer للربط
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILDOZER_SDK/licenses"
          mkdir -p "$BUILDOZER_SDK/tools/bin"

          # نسخ التراخيص
          cp -r "$SDK_ROOT/licenses/"* "$BUILDOZER_SDK/licenses/" 2>/dev/null || true

          # إنشاء Symlink للأدوات القديمة
          if [ -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$BUILDOZER_SDK/tools/bin/sdkmanager"
            ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" "$BUILDOZER_SDK/tools/bin/avdmanager"
          fi

          # تعيين البيئة
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "ANDROIDNDK=$SDK_ROOT/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "ANDROIDAPI=33" >> $GITHUB_ENV
          echo "ANDROIDMINAPI=24" >> $GITHUB_ENV

          echo "✅ NDK 25b installed and configured."

      # ========== 8. التحقق من النموذج ==========
      - name: Verify AI model
        run: |
          if [ -f "project/assets/engine_v2.tflite" ]; then
            echo "✅ AI model found."
            ls -lh project/assets/engine_v2.tflite
          else
            echo "❌ AI model NOT found!"
            exit 1
          fi

      # ========== 9. كتابة buildozer.spec ==========
      - name: Write buildozer.spec
        run: |
          set -e
          cd project

          cat > buildozer.spec << 'EOF'
          [app]
          title = Shield Core
          package.name = shieldcore
          package.domain = com.sys
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,txt,json,tflite
          source.include_files = assets/engine_v2.tflite, res/
          version = 4.2.0

          requirements = python3==3.10.11,hostpython3==3.10.11,kivy==2.3.0,requests==2.31.0,Pillow==10.4.0,numpy==1.26.4

          orientation = portrait
          osx.python_version = 3
          osx.kivy_version = 2.3.0
          fullscreen = 0

          [android]
          api = 33
          minapi = 24
          ndk = 25b
          ndk_api = 24
          archs = arm64-v8a, armeabi-v7a
          build_tools = 33.0.2

          android.skip_update = True
          android.accept_sdk_license = True
          android.allow_backup = False

          permissions = INTERNET, CAMERA, RECORD_AUDIO, WAKE_LOCK, FOREGROUND_SERVICE, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE

          android.manifest.foreground_service_type = dataSync
          android.gradle_dependencies = androidx.core:core:1.9.0, androidx.work:work-runtime:2.8.0

          android.resdir = res

          android.sdk_path = $ANDROID_HOME
          android.ndk_path = $ANDROID_NDK_HOME

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

          echo "✅ buildozer.spec written."
          cat buildozer.spec
          cd ..

      # ========== 10. بناء APK ==========
      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "=== Build Environment ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"
          echo "=========================="

          cd project
          rm -rf .buildozer
          buildozer -v android debug \
            --sdk-dir="$ANDROID_HOME" \
            --ndk-dir="$ANDROID_NDK_HOME" \
            2>&1 | tee build_log.txt
          cd ..

      # ========== 11. إعادة المحاولة ==========
      - name: Retry build if failed
        if: failure() && steps.build.outcome == 'failure'
        id: retry
        continue-on-error: true
        run: |
          set -o pipefail

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          rm -rf project/.buildozer 2>/dev/null || true
          cd project
          buildozer -v android debug \
            --sdk-dir="$ANDROID_HOME" \
            --ndk-dir="$ANDROID_NDK_HOME" \
            2>&1 | tee -a build_log.txt
          cd ..

      # ========== 12. البحث عن APK ==========
      - name: Locate APK
        if: always()
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/.buildozer/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -sh "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      # ========== 13. إرسال النتيجة إلى Telegram ==========
      - name: Send Result
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "❌ BOT_TOKEN or CHAT_ID is missing!"
            exit 1
          fi

          BUILD_STATUS="${{ steps.find_apk.outputs.status }}"

          if [ "$BUILD_STATUS" == "success" ]; then
            APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
            CAPTION="✅ *Shield Core v4.2 Success*%0A• Size: ${{ steps.find_apk.outputs.apk_size }}%0A• Arch: arm64-v8a, armeabi-v7a"
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            # إنشاء تقرير شامل في جميع الحالات
            REPORT_FILE="SHIELD_CORE_BUILD_REPORT.txt"

            {
              echo "╔═══════════════════════════════════════════════════════════════════════════════╗"
              echo "║           🔍 UNIFIED BUILD ERROR & DIAGNOSTIC REPORT - Shield Core v4.2        ║"
              echo "╚═══════════════════════════════════════════════════════════════════════════════╝"
              echo ""
              echo "📅 Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              echo "📦 Repository: $GITHUB_REPOSITORY"
              echo "🔖 Run ID: $GITHUB_RUN_ID"
              echo "🖥️  Runner OS: $RUNNER_OS"
              echo ""
              echo "═══════════════════════════════════════════════════════════════════════════════════"
              echo "  🚨 ERROR DIAGNOSIS"
              echo "═══════════════════════════════════════════════════════════════════════════════════"
              echo ""
            } > "$REPORT_FILE"

            if [ -f "project/build_log.txt" ]; then
              echo "📋 Build log found. Extracting errors..." >> "$REPORT_FILE"
              echo "" >> "$REPORT_FILE"
              echo "───────────────────────────────────────────────────────────────────────────────" >> "$REPORT_FILE"
              echo "ERROR LINES:" >> "$REPORT_FILE"
              echo "───────────────────────────────────────────────────────────────────────────────" >> "$REPORT_FILE"
              grep -i -E "error:|exception|failed|does not exist|NoClassDefFoundError|fatal|Build failed|ModuleNotFoundError" project/build_log.txt | head -n 50 >> "$REPORT_FILE" || echo "No specific error patterns matched." >> "$REPORT_FILE"
              echo "" >> "$REPORT_FILE"
              echo "───────────────────────────────────────────────────────────────────────────────" >> "$REPORT_FILE"
              echo "LAST 100 LOG LINES:" >> "$REPORT_FILE"
              echo "───────────────────────────────────────────────────────────────────────────────" >> "$REPORT_FILE"
              tail -n 100 project/build_log.txt >> "$REPORT_FILE"
            else
              echo "❌ No build_log.txt found. Failure occurred before Buildozer stage." >> "$REPORT_FILE"
              echo "   Check GitHub Actions logs for setup/dependency errors." >> "$REPORT_FILE"
            fi

            echo "" >> "$REPORT_FILE"
            echo "═══════════════════════════════════════════════════════════════════════════════════" >> "$REPORT_FILE"
            echo "  💡 FIXES APPLIED IN THIS WORKFLOW" >> "$REPORT_FILE"
            echo "═══════════════════════════════════════════════════════════════════════════════════" >> "$REPORT_FILE"
            echo "" >> "$REPORT_FILE"
            echo "1. ✅ Using system Android SDK (no manual download of commandlinetools)" >> "$REPORT_FILE"
            echo "2. ✅ NDK 25b installed via sdkmanager" >> "$REPORT_FILE"
            echo "3. ✅ Symlink for sdkmanager in tools/bin/ created" >> "$REPORT_FILE"
            echo "4. ✅ Licenses pre-accepted in both paths" >> "$REPORT_FILE"
            echo "5. ✅ buildozer and p4a installed with pexpect and sh<2.0" >> "$REPORT_FILE"
            echo "6. ✅ --sdk-dir and --ndk-dir passed as command arguments" >> "$REPORT_FILE"
            echo "7. ✅ android.skip_update = True to prevent automatic updates" >> "$REPORT_FILE"
            echo "" >> "$REPORT_FILE"
            echo "───────────────────────────────────────────────────────────────────────────────" >> "$REPORT_FILE"
            echo "End of Report - $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$REPORT_FILE"

            # إرسال التقرير
            curl -s -F "chat_id=$CHAT_ID" \
              -F "document=@$REPORT_FILE" \
              -F "caption=❌ *Build Failed - Shield Core v4.2*%0A📋 Attached is the unified diagnostic & log report." \
              -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          fi
