name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential
          pip install --user --upgrade Cython==3.0.10 buildozer

      - name: Build with Buildozer
        run: |
          # تنظيف أي محاولة سابقة فاشلة
          rm -rf .buildozer
          
          # مسح المتغيرات لفرض التحميل المحلي
          unset ANDROID_HOME
          unset ANDROID_NDK_HOME
          
          export PATH=$PATH:~/.local/bin
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME/bin:$PATH
          
          # الموافقة التلقائية على تراخيص SDK
          yes | buildozer android sdk_update || true
          
          # البدء بالبناء
          buildozer -v android debug
        env:
          ACCEPT_SDK_LICENSE: 1
          GRADLE_OPTS: "-Xmx2048m -Dorg.gradle.daemon=false"
          # تصفير المسارات لضمان عدم حدوث تضارب مع NDK 27
          ANDROID_HOME: ""
          ANDROID_NDK_HOME: ""
