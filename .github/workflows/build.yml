name: Shield Core v4.2 - AI Dynamic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== 1. تنظيف المساحة ==========
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      # ========== 2. إعداد Python 3.10 ==========
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      # ========== 3. إعداد Java 17 ==========
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ========== 4. تثبيت تبعيات النظام ==========
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev \
            libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libfreetype6 gfortran curl ccache

      # ========== 5. تثبيت Buildozer والتبعيات (بدون تعارض) ==========
      - name: Install Buildozer and dependencies
        run: |
          python3 -m pip install --upgrade pip wheel setuptools
          python3 -m pip install "Cython==0.29.33"
          python3 -m pip install "sh<2.0,>=1.10"
          python3 -m pip install pexpect appdirs colorama jinja2 virtualenv packaging
          python3 -m pip install buildozer==1.5.0
          python3 -m pip install python-for-android==2024.1.21
          echo "✅ Buildozer and dependencies installed."

      # ========== 6. تنزيل وتثبيت SDK و NDK يدوياً (الطريقة المضمونة) ==========
      - name: Install Android SDK & NDK with licenses
        shell: bash
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          
          # تحميل commandlinetools
          curl -sS https://dl.google.com/android/repository/commandlinetools-linux-9441835_latest.zip -o cmdline.zip
          unzip -q cmdline.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          rm cmdline.zip
          
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          
          # قبول التراخيص إجبارياً (مرتين للتأكيد)
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses || true
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses || true
          
          # تثبيت الحزم الأساسية
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;28.2.13676358"
          
          # قبول التراخيص مرة أخيرة
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses || true
          
          # إنشاء مجلد licenses لـ Buildozer
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILDOZER_SDK/licenses"
          cp -r "$SDK_ROOT/licenses/"* "$BUILDOZER_SDK/licenses/" 2>/dev/null || true
          
          # إنشاء Symlink لـ sdkmanager في المسار القديم (لـ Buildozer)
          mkdir -p "$BUILDOZER_SDK/tools/bin"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$BUILDOZER_SDK/tools/bin/sdkmanager"
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" "$BUILDOZER_SDK/tools/bin/avdmanager"
          
          # تصدير المتغيرات
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "ANDROIDNDK=$SDK_ROOT/ndk/28.2.13676358" >> $GITHUB_ENV
          echo "ANDROIDAPI=33" >> $GITHUB_ENV
          echo "ANDROIDMINAPI=24" >> $GITHUB_ENV
          
          echo "✅ SDK & NDK installed successfully."

      # ========== 7. التحقق من نموذج الذكاء الاصطناعي ==========
      - name: Verify AI model
        run: |
          if [ -f "project/assets/engine_v2.tflite" ]; then
            echo "✅ AI model found."
            ls -lh project/assets/engine_v2.tflite
          else
            echo "❌ AI model NOT found!"
            exit 1
          fi

      # ========== 8. كتابة buildozer.spec ==========
      - name: Write buildozer.spec
        run: |
          set -e
          cd project
          cat > buildozer.spec << 'EOF'
          [app]
          title = Shield Core
          package.name = shieldcore
          package.domain = com.sys
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,txt,json,tflite
          source.include_files = assets/engine_v2.tflite, res/
          version = 4.2.0

          requirements = python3==3.10.11,hostpython3==3.10.11,kivy==2.3.0,requests==2.31.0,Pillow==10.4.0,numpy==1.26.4

          orientation = portrait
          osx.python_version = 3
          osx.kivy_version = 2.3.0
          fullscreen = 0

          [android]
          api = 33
          minapi = 24
          ndk = 28c
          ndk_api = 24
          archs = arm64-v8a, armeabi-v7a
          build_tools = 33.0.2

          android.skip_update = True
          android.accept_sdk_license = True
          android.allow_backup = False

          permissions = INTERNET, CAMERA, RECORD_AUDIO, WAKE_LOCK, FOREGROUND_SERVICE, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE

          android.manifest.foreground_service_type = dataSync
          android.gradle_dependencies = androidx.core:core:1.9.0, androidx.work:work-runtime:2.8.0

          android.resdir = res

          android.sdk_path = $ANDROID_HOME
          android.ndk_path = $ANDROID_NDK_HOME

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

          echo "✅ buildozer.spec written."
          cat buildozer.spec
          cd ..

      # ========== 9. بناء APK ==========
      - name: Build APK
        id: build
        run: |
          set -o pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          
          echo "=== Build Environment ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"
          echo "=========================="
          
          cd project
          rm -rf .buildozer
          buildozer -v android debug \
            --sdk-dir="$ANDROID_HOME" \
            --ndk-dir="$ANDROID_NDK_HOME" \
            2>&1 | tee build_log.txt
          cd ..

      # ========== 10. إعادة المحاولة (في حال فشل مؤقت) ==========
      - name: Retry build if failed
        if: failure() && steps.build.outcome == 'failure'
        id: retry
        continue-on-error: true
        run: |
          set -o pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          
          rm -rf project/.buildozer 2>/dev/null || true
          cd project
          buildozer -v android debug \
            --sdk-dir="$ANDROID_HOME" \
            --ndk-dir="$ANDROID_NDK_HOME" \
            2>&1 | tee -a build_log.txt
          cd ..

      # ========== 11. البحث عن APK ==========
      - name: Locate APK
        if: always()
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/.buildozer/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -sh "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      # ========== 12. إرسال النتيجة ==========
      - name: Send Result
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "❌ BOT_TOKEN or CHAT_ID is missing!"
            exit 1
          fi

          BUILD_STATUS="${{ steps.find_apk.outputs.status }}"

          if [ "$BUILD_STATUS" == "success" ]; then
            APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
            CAPTION="✅ *Shield Core v4.2 Success*%0A• Size: ${{ steps.find_apk.outputs.apk_size }}%0A• Arch: arm64-v8a, armeabi-v7a"
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            # إرسال آخر 100 سطر من السجل
            if [ -f "project/build_log.txt" ]; then
              tail -n 100 project/build_log.txt > error_report.txt
              curl -s -F "chat_id=$CHAT_ID" -F "document=@error_report.txt" \
                -F "caption=❌ *Build Failed*%0A📋 Last 100 log lines attached." \
                "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
            fi
          fi
