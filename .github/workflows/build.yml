name: Build APK (Final - Non‑Root User)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify build start
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          curl -s -X POST https://api.telegram.org/bot$BOT_TOKEN/sendMessage \
            -d chat_id=$CHAT_ID -d text="🚀 Building APK (non‑root Docker)"

      - name: Build APK inside Docker (non‑root user)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/project \
            --user root \
            kivy/buildozer:latest \
            bash -c "\
              chmod -R 777 /workspace && \
              useradd -m builduser && \
              su builduser -c 'buildozer -v android debug' \
            "

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find project/bin -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK size: $(du -h "$APK_PATH" | cut -f1)"

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          curl -F "chat_id=$CHAT_ID" -F "document=@${{ steps.find_apk.outputs.apk_path }}" \
            -F "caption=✅ APK ready (final non‑root build)" \
            https://api.telegram.org/bot$BOT_TOKEN/sendDocument

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Knox-APK-${{ github.run_number }}
          path: ${{ steps.find_apk.outputs.apk_path }}
