name: Shield Core v4.2 - AI Dynamic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev \
            libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libfreetype6 gfortran curl ccache

      - name: Install Buildozer and p4a
        run: |
          python3 -m pip install --upgrade pip wheel setuptools
          python3 -m pip install "Cython==0.29.33"
          python3 -m pip install "sh<2.0,>=1.10"
          python3 -m pip install pexpect appdirs colorama jinja2 virtualenv packaging
          python3 -m pip install buildozer==1.5.0
          python3 -m pip install python-for-android==2024.1.21
          echo "✅ Buildozer and p4a installed."

      # ===== أهم خطوة: تعديل وصفة freetype في p4a المثبّتة =====
      - name: Patch freetype recipe in installed p4a
        run: |
          P4A_DIR=$(python3 -c "import pythonforandroid, os; print(os.path.dirname(pythonforandroid.__file__))")
          RECIPE_FILE="$P4A_DIR/recipes/freetype/__init__.py"
          if [ -f "$RECIPE_FILE" ]; then
            echo "Patching freetype URL in $RECIPE_FILE"
            sed -i 's|https://download.savannah.gnu.org/releases/freetype/freetype-{version}.tar.gz|https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz|g' "$RECIPE_FILE"
            grep 'sourceforge' "$RECIPE_FILE" && echo "✅ Patch applied." || echo "⚠️ Patch may have failed."
          else
            echo "❌ Recipe file not found!"
          fi

      - name: Install Android SDK, NDK 25b, and pre-accept licenses
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses || true
          sdkmanager \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "ndk;25.1.8937393" \
            "platform-tools"
          yes | sdkmanager --licenses || true

          BUILDOZER_PLATFORM="$HOME/.buildozer/android/platform"
          mkdir -p "$BUILDOZER_PLATFORM"
          NDK_PATH="$SDK_ROOT/ndk/25.1.8937393"

          # الروابط الصحيحة فقط (بدون r28c الوهمي)
          ln -sfn "$NDK_PATH" "$BUILDOZER_PLATFORM/android-ndk-r25b"
          ln -sfn "$NDK_PATH" "$BUILDOZER_PLATFORM/android-ndk"
          ln -sfn "$SDK_ROOT" "$BUILDOZER_PLATFORM/android-sdk"

          BUILDOZER_SDK="$BUILDOZER_PLATFORM/android-sdk"
          mkdir -p "$BUILDOZER_SDK/licenses" "$BUILDOZER_SDK/tools/bin"
          cp -r "$SDK_ROOT/licenses/"* "$BUILDOZER_SDK/licenses/" 2>/dev/null || true

          if [ -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$BUILDOZER_SDK/tools/bin/sdkmanager"
            ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" "$BUILDOZER_SDK/tools/bin/avdmanager"
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROIDNDK=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROIDAPI=31" >> $GITHUB_ENV
          echo "ANDROIDMINAPI=24" >> $GITHUB_ENV
          echo "APP_ANDROID_NDK_API=24" >> $GITHUB_ENV

      - name: Verify AI model
        run: |
          if [ -f "project/assets/engine_v2.tflite" ]; then
            echo "✅ AI model found."
            ls -lh project/assets/engine_v2.tflite
          else
            echo "❌ AI model NOT found!"
            exit 1
          fi

      - name: Write buildozer.spec
        run: |
          set -e
          cd project
          cat > buildozer.spec << 'EOF'
          [app]
          title = Shield Core
          package.name = shieldcore
          package.domain = com.sys
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,txt,json,tflite
          source.include_files = assets/engine_v2.tflite, res/
          version = 4.2.0

          requirements = hostpython3==3.10.11,python3==3.10.11,kivy==2.3.0,Cython==0.29.33,requests==2.31.0,pillow,numpy

          orientation = portrait
          fullscreen = 0

          [android]
          api = 31
          minapi = 24
          ndk = 25b
          ndk_api = 24
          archs = arm64-v8a, armeabi-v7a
          build_tools = 31.0.0

          android.skip_update = True
          android.accept_sdk_license = True
          android.allow_backup = False

          permissions = INTERNET, CAMERA, RECORD_AUDIO, WAKE_LOCK, FOREGROUND_SERVICE

          android.manifest.foreground_service_type = dataSync
          android.gradle_dependencies = androidx.core:core:1.9.0, androidx.work:work-runtime:2.8.0
          android.resdir = res

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF
          echo "✅ buildozer.spec written."
          cd ..

      # ===== تنزيل حزم إضافية للتأمين (اختياري لكن مفيد) =====
      - name: Pre-download remaining critical recipes
        run: |
          # تنزيل الحزم التي قد تواجه مشاكل 502 إلى مسار الكاش العام
          CACHE_DIR="$HOME/.buildozer/cache/packages"
          mkdir -p "$CACHE_DIR/freetype" "$CACHE_DIR/openssl" "$CACHE_DIR/sqlite3" "$CACHE_DIR/hostpython3" "$CACHE_DIR/python3"

          curl -sSL --retry 10 --retry-delay 15 -o "$CACHE_DIR/freetype/freetype-2.14.1.tar.gz" \
            "https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz"

          curl -sSL --retry 10 --retry-delay 15 -o "$CACHE_DIR/openssl/openssl-1.1.1w.tar.gz" \
            "https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-1.1.1w.tar.gz"

          curl -sSL --retry 10 --retry-delay 15 -o "$CACHE_DIR/sqlite3/sqlite-autoconf-3390200.tar.gz" \
            "https://github.com/andrey-utkin/sqlite-mirror/releases/download/sqlite-autoconf-3390200/sqlite-autoconf-3390200.tar.gz"

          curl -sSL --retry 10 --retry-delay 15 -o "$CACHE_DIR/hostpython3/Python-3.10.11.tar.xz" \
            "https://www.python.org/ftp/python/3.10.11/Python-3.10.11.tar.xz"

          curl -sSL --retry 10 --retry-delay 15 -o "$CACHE_DIR/python3/Python-3.10.11.tar.xz" \
            "https://www.python.org/ftp/python/3.10.11/Python-3.10.11.tar.xz"

          echo "✅ Critical packages pre-downloaded to global cache."

      - name: Build APK
        id: build
        run: |
          set -o pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROIDMINAPI=24

          cd project
          touch build_log.txt
          rm -rf .buildozer   # تنظيف أولي فقط (لن يؤثر على التعديل في site-packages)

          # مرة أخرى نؤكد أن وصفة freetype معدلة في حال استخدم buildozer نسخة من p4a
          P4A_RECIPE=".buildozer/android/platform/python-for-android/pythonforandroid/recipes/freetype/__init__.py"
          mkdir -p "$(dirname "$P4A_RECIPE")"
          # ننسخ الوصفة المعدلة من site-packages إلى مكانها المحلي إن وُجدت
          SITE_P4A_RECIPE=$(python3 -c "import pythonforandroid, os; print(os.path.join(os.path.dirname(pythonforandroid.__file__), 'recipes/freetype/__init__.py'))")
          if [ -f "$SITE_P4A_RECIPE" ]; then
            cp "$SITE_P4A_RECIPE" "$P4A_RECIPE"
          fi

          buildozer -v android debug \
            --sdk-dir="$ANDROID_HOME" \
            --ndk-dir="$ANDROID_NDK_HOME" \
            --android-api=31 \
            --ndk-api=24 \
            2>&1 | tee -a build_log.txt && { SUCCESS=1; exit 0; }

          echo "❌ Build failed. Check build_log.txt"
          exit 1

      - name: Locate APK
        if: always()
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/.buildozer/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -sh "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shield-core-build-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            project/**/*.apk
            project/build_log.txt

      - name: Send Result
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "⚠️ Telegram secrets missing!"
            exit 1
          fi

          BUILD_STATUS="${{ steps.find_apk.outputs.status }}"

          if [ "$BUILD_STATUS" = "success" ]; then
            APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
            CAPTION="✅ *Shield Core v4.2 Success*%0A• Size: ${{ steps.find_apk.outputs.apk_size }}%0A• Arch: arm64-v8a, armeabi-v7a"
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            REPORT_FILE="SHIELD_CORE_BUILD_REPORT.txt"
            {
              echo "══════════════════════════════════════════════════════════════════"
              echo "  🔍 BUILD DIAGNOSTIC REPORT - Shield Core v4.2"
              echo "══════════════════════════════════════════════════════════════════"
              echo "📅 Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              echo "📦 Repository: $GITHUB_REPOSITORY"
              echo "🔖 Run ID: $GITHUB_RUN_ID"
              echo ""
              echo "──────────────────────────────────────────────────────────────────"
              echo "  🚨 CRITICAL ERRORS & DOWNLOAD ISSUES"
              echo "──────────────────────────────────────────────────────────────────"
              if [ -f "project/build_log.txt" ]; then
                grep -i -E "Downloading|HTTP Error|urlopen|error:|exception|failed" project/build_log.txt | tail -n 50
              else
                echo "No build log found."
              fi
              echo ""
              echo "──────────────────────────────────────────────────────────────────"
              echo "  📄 LAST 200 LOG LINES"
              echo "──────────────────────────────────────────────────────────────────"
              tail -n 200 project/build_log.txt 2>/dev/null || echo "Log unavailable"
            } > "$REPORT_FILE"

            curl -s -F "chat_id=$CHAT_ID" \
              -F "document=@$REPORT_FILE" \
              -F "caption=❌ *Build Failed - Shield Core v4.2*%0A📋 Full diagnostic report attached." \
              -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          fi
