name: Build APK (Official Buildozer Action)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build APK with Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v2
        with:
          workdir: .
          buildozer_spec_path: buildozer.spec
          command: buildozer android debug

      - name: Send APK to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH=$(find bin -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" \
              -F "caption=✅ System Core v3.1.0 APK Ready" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            echo "No APK found"
            exit 1
          fi

      - name: Send log on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          [ -f build_log.txt ] && LOG_FILE=build_log.txt || LOG_FILE=log.txt
          tail -n 300 $LOG_FILE > error_last.txt 2>/dev/null || echo "No log" > error_last.txt
          curl -F "chat_id=$CHAT_ID" -F "document=@error_last.txt" \
            -F "caption=❌ Build failed - last 300 lines" \
            https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          exit 1
