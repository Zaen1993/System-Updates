name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev shared-mime-info \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libglew-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install --user --upgrade Cython==0.29.33 buildozer
          pip install --user appdirs colorama jinja2 sh build toml packaging setuptools

      - name: Configure SDK & Accept ALL Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.1" "platform-tools"
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          cp -r $ANDROID_HOME/licenses/* /home/runner/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true

      - name: Verify required project files
        run: |
          echo "Checking essential files..."
          MISSING=0
          for file in project/main.py project/buildozer.spec project/config/device_admin.xml project/android/AndroidManifest.xml project/res/drawable/ic_launcher.png; do
            if [ ! -f "$file" ]; then
              echo "MISSING: $file"
              MISSING=1
            fi
          done
          if [ $MISSING -eq 1 ]; then exit 1; fi

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          cd project
          export BUILDOZER_ALLOW_ORG_NAME_START=1
          buildozer -v android debug

      - name: Send APK to Telegram
        run: |
          APK_PATH=$(find project/bin -name "*.apk" | head -n 1)
          curl -F "chat_id=${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}" \
               -F "document=@$APK_PATH" \
               -F "caption=✅ APK Build Success" \
               https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_1_TOKEN }}/sendDocument
