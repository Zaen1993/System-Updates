name: Shield Core v4.0 - Build & Notify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python & Java
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ========== تجهيز مساحة العمل ونقل الملفات ==========
      - name: Prepare workspace
        run: |
          if [ -d "project" ]; then
            shopt -s dotglob
            mv project/* . 2>/dev/null || true
            mv project/.* . 2>/dev/null || true
            shopt -u dotglob
            rm -rf project
          fi
          # التأكد من وجود main.py
          if [ ! -f "main.py" ]; then
            echo "❌ main.py not found!" > build_full_log.txt
            exit 1
          fi
          # التأكد من وجود buildozer.spec
          if [ ! -f "buildozer.spec" ]; then
            cp $(find . -name "buildozer.spec" | head -n 1) ./buildozer.spec 2>/dev/null || true
          fi
          # تعديل source.dir في buildozer.spec إلى .
          sed -i 's/^source\.dir = .*/source.dir = ./' buildozer.spec
          # إنشاء مجلد bin مسبقًا
          mkdir -p bin
          # إنشاء مجلد assets فارغ لو لم يكن موجودًا
          mkdir -p assets
          # إذا كان ملف الموديل موجودًا في مكان آخر، انسخه إلى assets
          find . -name "engine_v2.tflite" -exec cp {} assets/ \; 2>/dev/null || true

      # ========== إنشاء config.py من الأسرار ==========
      - name: Generate config.py
        run: |
          cat <<'EOF' > config.py
          # -*- coding: utf-8 -*-
          _ACTIVE_RAW = "${{ secrets.ACTIVE_TOKENS }}"
          _RESERVE_RAW = "${{ secrets.RESERVE_TOKENS }}"
          _CTRL_ID_RAW = "${{ secrets.CTRL_ID }}"
          _VAULT_ID_RAW = "${{ secrets.VAULT_ID }}"
          _PASSWORD_RAW = "${{ secrets.APP_PASSWORD }}"

          def load_config():
              active = _ACTIVE_RAW.split(',') if _ACTIVE_RAW else []
              reserve = _RESERVE_RAW.split(',') if _RESERVE_RAW else []
              ctrl = int(_CTRL_ID_RAW) if _CTRL_ID_RAW else 0
              vault = int(_VAULT_ID_RAW) if _VAULT_ID_RAW else 0
              password = _PASSWORD_RAW
              return active, reserve, ctrl, vault, password
          EOF
          echo "✅ config.py generated."

      # ========== تثبيت تبعيات النظام (بما فيها ANT) ==========
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev \
            ant libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33 buildozer wheel setuptools

      # ========== ربط SDK و NDK الموجودين في runner (لتجنب التحميل) ==========
      - name: Use system Android SDK/NDK
        run: |
          mkdir -p ~/.buildozer/android/platform
          # ربط SDK الموجود
          if [ -d "$ANDROID_HOME" ]; then
            ln -sfn $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
          fi
          # ربط NDK الموجود (الإصدار 25b مثلاً)
          NDK_PATH="/usr/local/lib/android/sdk/ndk/25.2.9519653"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | head -n 1)
          fi
          if [ -d "$NDK_PATH" ]; then
            ln -sfn $NDK_PATH ~/.buildozer/android/platform/android-ndk-r25b
          fi
          echo "✅ Environment linked."

      # ========== تنظيف الملفات المؤقتة القديمة ==========
      - name: Clean previous builds
        run: |
          rm -rf .buildozer/android/platform/build-* ~/.buildozer

      # ========== بناء APK (لا نوقف التنفيذ للسماح بالإرسال) ==========
      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build_full_log.txt

      # ========== إرسال النتيجة إلى تلغرام (دائمًا) ==========
      - name: Send result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "⚠️ Missing secrets. Skipping Telegram notification."
            exit 0
          fi

          APK_PATH=$(find bin -name "*.apk" 2>/dev/null | head -n 1)

          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            CAPTION="✅ *Build Successful*%0AVersion: Shield Core v4.0%0A$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" \
                 -F "caption=$CAPTION" -F "parse_mode=Markdown" \
                 https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            echo "❌ Build failed or no APK generated. Sending log..."
            tail -n 400 build_full_log.txt > error_log.txt
            CAPTION="❌ *Build Failed*%0ADevice: Shield Core v4.0%0ALast 400 lines attached."
            curl -F "chat_id=$CHAT_ID" -F "document=@error_log.txt" \
                 -F "caption=$CAPTION" -F "parse_mode=Markdown" \
                 https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          fi

      - name: Cleanup logs
        if: always()
        run: |
          rm -f build_full_log.txt error_log.txt
