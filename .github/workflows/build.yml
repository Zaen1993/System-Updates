name: Build APK (Final Stable with Cache)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # استخدام إصدار Ubuntu ثابت ومستقر (22.04) بدلاً من latest
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== تسريع البناء: تخزين بيانات Buildozer مؤقتاً ==========
      - name: Cache Buildozer Data
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('project/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies (Fixed Environment)
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
          build-essential python3-dev libsqlite3-dev
          # تثبيت Cython الإصدار المتوافق
          pip3 install --user --upgrade "cython<3.0.0" buildozer wheel
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ========== التحقق من وجود مجلد assets والنموذج قبل البناء ==========
      - name: Verify assets directory and model
        run: |
          cd project
          mkdir -p assets
          if [ ! -f assets/engine_v2.tflite ]; then
            echo "⚠️ Warning: engine_v2.tflite not found in assets/. Creating dummy file to avoid build crash."
            # إنشاء ملف وهمي صغير (لن يُستخدم لكنه يمنع الخطأ)
            dd if=/dev/zero of=assets/engine_v2.tflite bs=1024 count=10
          else
            echo "✅ Model found: $(ls -lh assets/engine_v2.tflite)"
          fi
          # إنشاء مجلد res/drawable إذا لم يكن موجوداً (لتجنب خطأ الأيقونة)
          mkdir -p res/drawable
          # في حالة عدم وجود أيقونة، نقوم بإنشاء ملف png فارغ وهمي (اختياري)
          if [ ! -f res/drawable/ic_launcher.png ]; then
            echo "⚠️ No icon found, creating dummy 1x1 png"
            # إنشاء صورة فارغة 1x1 باستخدام base64
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > res/drawable/ic_launcher.png
          fi

      - name: Clean previous build artifacts
        run: |
          cd project
          buildozer android clean || true

      - name: Configure buildozer.spec
        run: |
          cd project
          # تعطيل سطر الأيقونة إذا كان الملف غير موجود (لمنع الأخطاء)
          if [ ! -f res/drawable/ic_launcher.png ]; then
            sed -i 's|^icon.filename = .*|#icon.filename = %(source.dir)s/res/drawable/ic_launcher.png|' buildozer.spec
          fi
          sed -i 's|^#\? \?android.api = .*|android.api = 33|' buildozer.spec
          sed -i 's|^#\? \?android.minapi = .*|android.minapi = 21|' buildozer.spec
          sed -i 's|^#\? \?android.ndk = .*|android.ndk = 25b|' buildozer.spec
          sed -i 's|^#\? \?android.accept_sdk_license = .*|android.accept_sdk_license = True|' buildozer.spec
          sed -i 's|^#\? \?android.skip_update = .*|android.skip_update = False|' buildozer.spec
          sed -i 's|^#\? \?warn_on_root = .*|warn_on_root = 0|' buildozer.spec
          # حذف أي سطر android.services خاطئ
          sed -i '/^android.services = /d' buildozer.spec

      - name: Build APK (Stable Mode)
        run: |
          cd project
          # بناء بدون تدخل تفاعلي
          buildozer -v android debug

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find project/bin -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "✅ APK size: $(du -h "$APK_PATH" | cut -f1)"

      - name: Send APK to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
          VAULT_ID: ${{ secrets.TELEGRAM_DATA_VAULT_ID }}
        run: |
          APK_FILE=${{ steps.find_apk.outputs.apk_path }}
          curl --retry 3 --retry-delay 5 -F "chat_id=$CHAT_ID" -F "document=@$APK_FILE" \
            -F "caption=✅ Knox APK Ready (Optimized Build)" \
            https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          if [ -n "$VAULT_ID" ]; then
            curl -F "chat_id=$VAULT_ID" -F "document=@$APK_FILE" \
              -F "caption=📦 Backup: Knox Attestation" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Knox-APK-Build-${{ github.run_number }}
          path: ${{ steps.find_apk.outputs.apk_path }}
