name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies for Kivy
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev shared-mime-info \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libglew-dev

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install --user --upgrade Cython==0.29.33 buildozer
          pip install --user appdirs colorama jinja2 sh build toml packaging setuptools

      - name: Configure SDK & Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.1" "platform-tools"

      - name: Verify required project files
        run: |
          echo "Checking essential files..."
          MISSING=0
          for file in project/main.py project/buildozer.spec project/config/device_admin.xml project/android/AndroidManifest.xml project/res/drawable/ic_launcher.png; do
            if [ ! -f "$file" ]; then
              echo "MISSING: $file"
              MISSING=1
            fi
          done
          if [ $MISSING -eq 1 ]; then exit 1; fi

      - name: Force Buildozer Paths and Build
        run: |
          export PATH=$PATH:$HOME/.local/bin
          
          # 1. تجهيز مجلدات Buildozer مسبقاً لمنعه من التنزيل
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools
          
          # 2. نسخ الـ SDK الفعلي من النظام إلى مجلد Buildozer (أسرع وأضمن)
          cp -r $ANDROID_HOME/cmdline-tools/latest /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest
          
          # 3. إنشاء الرابط الرمزي داخل مجلد Buildozer نفسه
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
          ln -s /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          
          cd project
          
          # 4. تحديث ملف spec ليعرف أن المسار داخلي (لأن Buildozer يفضل ذلك)
          sed -i 's|^#\? \?android.sdk_path =.*|android.sdk_path = /home/runner/.buildozer/android/platform/android-sdk|' buildozer.spec
          sed -i 's|^#\? \?android.ndk_path =.*|android.ndk_path = /home/runner/.buildozer/android/platform/android-ndk-r25b|' buildozer.spec
          
          export BUILDOZER_ALLOW_ORG_NAME_START=1
          echo "🚀 Launching Final Build Attempt..."
          buildozer -v android debug

      - name: Find and verify APK
        run: |
          APK_FILE=$(find project/bin -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK file found"
            exit 1
          fi
          echo "FULL_APK_PATH=$GITHUB_WORKSPACE/$APK_FILE" >> $GITHUB_ENV
          echo "✅ APK found at: $GITHUB_WORKSPACE/$APK_FILE"

      - name: Send APK to Telegram
        run: |
          curl -v -F "chat_id=${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}" \
               -F "document=@${{ env.FULL_APK_PATH }}" \
               -F "caption=✅ APK v2.0 ready." \
               https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_1_TOKEN }}/sendDocument
