name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies for Kivy
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev shared-mime-info \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libglew-dev

      - name: Install Python dependencies
        run: |
          pip install --user --upgrade Cython==0.29.33 buildozer

      - name: Setup Android NDK 25b
        run: |
          mkdir -p $HOME/.buildozer/android/platform
          cd $HOME/.buildozer/android/platform
          if [ ! -d "android-ndk-r25b" ]; then
            wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
            unzip -q android-ndk-r25b-linux.zip
            rm android-ndk-r25b-linux.zip
          fi
          echo "ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV
          echo "ANDROIDNDK=$HOME/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV
          echo "NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r25b" >> $GITHUB_ENV

      - name: Accept Android SDK Licenses
        run: |
          # إنشاء مجلد التراخيص يدوياً
          mkdir -p $ANDROID_HOME/licenses
          mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
          # كتابة بصمات التراخيص المطلوبة (لتجنب طلب قبول يدوي)
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f51874794514c1090601dfa46c5b302144843" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
          # نسخ إلى مجلد buildozer أيضاً
          cp $ANDROID_HOME/licenses/* /home/runner/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
          # استخدام sdkmanager لقبول التراخيص (طريقة آمنة)
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --licenses || true

      - name: Install Android Build-Tools 33 (Stable)
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.1" "platform-tools" "platforms;android-33" || true
          /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager "build-tools;33.0.1" "platform-tools" "platforms;android-33" || true

      - name: Verify required project files
        run: |
          echo "🔍 Checking essential files..."
          MISSING=0
          for file in project/main.py project/buildozer.spec project/config/device_admin.xml project/android/AndroidManifest.xml project/res/drawable/ic_launcher.png; do
            if [ ! -f "$file" ]; then
              echo "❌ MISSING FILE: $file"
              MISSING=1
            else
              echo "✅ $file exists"
            fi
          done
          if [ $MISSING -eq 1 ]; then
            echo "ERROR: One or more required files are missing. Check the list above."
            exit 1
          fi
          echo "✅ All required files present."

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:$HOME/.local/bin
          cd project
          mkdir -p .buildozer/android/platform
          echo "🚀 Starting Buildozer build (may take 15-25 minutes)..."
          buildozer -v android debug

      - name: Find and verify APK
        run: |
          APK_FILE=$(find project/bin -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK file found"
            exit 1
          fi
          echo "FULL_APK_PATH=$GITHUB_WORKSPACE/$APK_FILE" >> $GITHUB_ENV
          echo "✅ APK found at: $GITHUB_WORKSPACE/$APK_FILE"

      - name: Send APK to Telegram
        run: |
          curl -v -F "chat_id=${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}" \
               -F "document=@${{ env.FULL_APK_PATH }}" \
               -F "caption=✅ Build completed successfully! Version 2.0.0 ready for installation." \
               https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_1_TOKEN }}/sendDocument
