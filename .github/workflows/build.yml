name: Shield Core v4.2 - AI Dynamic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev \
            libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libfreetype6 gfortran curl ccache

      - name: Install Buildozer and p4a
        run: |
          python3 -m pip install --upgrade pip wheel setuptools
          python3 -m pip install "Cython==0.29.33"
          python3 -m pip install "sh<2.0,>=1.10"
          python3 -m pip install pexpect appdirs colorama jinja2 virtualenv packaging
          python3 -m pip install buildozer==1.5.0
          python3 -m pip install python-for-android==2024.1.21
          echo "✅ Buildozer and p4a installed."

      # ===== (اختياري) تشخيص الروابط قبل التصحيح =====
      - name: Diagnose recipe download URLs (optional)
        run: |
          set -e
          P4A_DIR=$(python3 -c "import pythonforandroid, os; print(os.path.dirname(pythonforandroid.__file__))")
          echo "p4a installed at: $P4A_DIR"
          echo ""
          echo "=== Extracted url/version from critical recipes ==="
          for r in python3 hostpython3 openssl sqlite3 libffi sdl2 sdl2_image sdl2_mixer sdl2_ttf; do
            f="$P4A_DIR/recipes/$r/recipe.py"
            if [ -f "$f" ]; then
              echo "--- $r ---"
              grep -E "^\s*(url|version)\s*=" "$f" || echo "(dynamic recipe)"
            fi
          done
          echo ""
          echo "=== Probing candidate hosts ==="
          for host in "https://www.python.org" "https://www.openssl.org" "https://www.sqlite.org" "https://www.libsdl.org" "https://github.com" "https://sourceware.org"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$host" || echo "TIMEOUT")
            echo "$host -> HTTP $code"
          done

      # ===== أهم خطوة: تعديل وصفات p4a إلى مرايا GitHub =====
      - name: Patch p4a recipes with GitHub mirrors
        run: |
          set -e
          P4A_DIR=$(python3 -c "import pythonforandroid, os; print(os.path.dirname(pythonforandroid.__file__))")
          echo "P4A directory: $P4A_DIR"

          # OpenSSL -> GitHub Releases
          OPENSSL_RECIPE="$P4A_DIR/recipes/openssl/recipe.py"
          if [ -f "$OPENSSL_RECIPE" ]; then
            echo "Patching OpenSSL..."
            sed -i 's|https://www.openssl.org/source/openssl-{version}.tar.gz|https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-{version}.tar.gz|g' "$OPENSSL_RECIPE"
          fi

          # SQLite3 -> مرآة مستقرة
          SQLITE_RECIPE="$P4A_DIR/recipes/sqlite3/recipe.py"
          if [ -f "$SQLITE_RECIPE" ]; then
            echo "Patching SQLite3..."
            sed -i 's|https://www.sqlite.org/2023/sqlite-autoconf-{version}.tar.gz|https://github.com/andrey-utkin/sqlite-mirror/releases/download/sqlite-autoconf-{version}/sqlite-autoconf-{version}.tar.gz|g' "$SQLITE_RECIPE"
            sed -i 's|https://www.sqlite.org/2022/sqlite-autoconf-{version}.tar.gz|https://github.com/andrey-utkin/sqlite-mirror/releases/download/sqlite-autoconf-{version}/sqlite-autoconf-{version}.tar.gz|g' "$SQLITE_RECIPE"
          fi

          # Python3 -> GitHub cpython mirror
          PYTHON3_RECIPE="$P4A_DIR/recipes/python3/recipe.py"
          if [ -f "$PYTHON3_RECIPE" ]; then
            echo "Patching Python3..."
            sed -i 's|https://www.python.org/ftp/python/{version}/Python-{version}.tgz|https://github.com/python/cpython/archive/refs/tags/v{version}.tar.gz|g' "$PYTHON3_RECIPE"
            sed -i 's|https://www.python.org/ftp/python/{version}/Python-{version}.tar.xz|https://github.com/python/cpython/archive/refs/tags/v{version}.tar.gz|g' "$PYTHON3_RECIPE"
          fi

          echo "✅ All critical recipes patched."

      - name: Install Android SDK, NDK 25b, and pre-accept licenses
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses || true
          sdkmanager \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "ndk;25.1.8937393" \
            "platform-tools"
          yes | sdkmanager --licenses || true

          BUILDOZER_PLATFORM="$HOME/.buildozer/android/platform"
          mkdir -p "$BUILDOZER_PLATFORM"
          NDK_PATH="$SDK_ROOT/ndk/25.1.8937393"

          ln -sfn "$NDK_PATH" "$BUILDOZER_PLATFORM/android-ndk-r25b"
          ln -sfn "$NDK_PATH" "$BUILDOZER_PLATFORM/android-ndk"
          ln -sfn "$SDK_ROOT" "$BUILDOZER_PLATFORM/android-sdk"

          BUILDOZER_SDK="$BUILDOZER_PLATFORM/android-sdk"
          mkdir -p "$BUILDOZER_SDK/licenses" "$BUILDOZER_SDK/tools/bin"
          cp -r "$SDK_ROOT/licenses/"* "$BUILDOZER_SDK/licenses/" 2>/dev/null || true

          if [ -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "$BUILDOZER_SDK/tools/bin/sdkmanager"
            ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" "$BUILDOZER_SDK/tools/bin/avdmanager"
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROIDNDK=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROIDAPI=31" >> $GITHUB_ENV
          echo "ANDROIDMINAPI=24" >> $GITHUB_ENV
          echo "APP_ANDROID_NDK_API=24" >> $GITHUB_ENV

      - name: Verify AI model
        run: |
          if [ -f "project/assets/engine_v2.tflite" ]; then
            echo "✅ AI model found."
            ls -lh project/assets/engine_v2.tflite
          else
            echo "❌ AI model NOT found!"
            exit 1
          fi

      - name: Write buildozer.spec
        run: |
          set -e
          cd project
          cat > buildozer.spec << 'EOF'
          [app]
          title = Shield Core
          package.name = shieldcore
          package.domain = com.sys
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,txt,json,tflite
          source.include_files = assets/engine_v2.tflite, res/
          version = 4.2.0

          requirements = hostpython3==3.10,python3==3.10,kivy==2.3.0,Cython==0.29.33,requests==2.31.0,pillow,numpy

          orientation = portrait
          osx.python_version = 3
          osx.kivy_version = 2.3.0
          fullscreen = 0

          [android]
          api = 31
          minapi = 24
          ndk = 25b
          ndk_api = 24
          archs = arm64-v8a, armeabi-v7a
          build_tools = 31.0.0

          android.skip_update = True
          android.accept_sdk_license = True
          android.allow_backup = False

          permissions = INTERNET, CAMERA, RECORD_AUDIO, WAKE_LOCK, FOREGROUND_SERVICE, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE

          android.manifest.foreground_service_type = dataSync
          android.gradle_dependencies = androidx.core:core:1.9.0, androidx.work:work-runtime:2.8.0
          android.resdir = res

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF
          echo "✅ buildozer.spec written."
          cat buildozer.spec
          cd ..

      - name: Build APK with retries
        id: build
        run: |
          set -o pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROIDMINAPI=24
          # تعيين User-Agent لتحسين فرص التحميل
          export HTTP_USER_AGENT="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          export HTTPS_USER_AGENT="$HTTP_USER_AGENT"

          cd project
          touch build_log.txt
          rm -rf .buildozer   # تنظيف أولي فقط

          MAX_RETRIES=5
          COUNT=0
          SUCCESS=0

          until [ $COUNT -ge $MAX_RETRIES ]; do
            echo "=== Attempt $((COUNT+1)) of $MAX_RETRIES ==="
            buildozer -v android debug \
              --sdk-dir="$ANDROID_HOME" \
              --ndk-dir="$ANDROID_NDK_HOME" \
              --android-api=31 \
              --ndk-api=24 \
              2>&1 | tee -a build_log.txt && { SUCCESS=1; break; }

            COUNT=$((COUNT+1))
            if [ $COUNT -lt $MAX_RETRIES ]; then
              WAIT=$((COUNT * 30))
              echo "⚠️ Attempt $COUNT failed. Retrying in ${WAIT}s (preserving .buildozer)..."
              sleep "$WAIT"
            fi
          done

          cd ..
          if [ $SUCCESS -ne 1 ]; then
            echo "❌ All build attempts failed." >&2
            exit 1
          fi

      - name: Locate APK
        if: always()
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/.buildozer/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -sh "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK and log as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shield-core-build-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            project/**/*.apk
            project/build_log.txt

      - name: Send Result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "⚠️ Telegram secrets missing!"
            exit 1
          fi

          BUILD_STATUS="${{ steps.find_apk.outputs.status }}"

          if [ "$BUILD_STATUS" = "success" ]; then
            APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
            CAPTION="✅ *Shield Core v4.2 Success*%0A• Size: ${{ steps.find_apk.outputs.apk_size }}%0A• Arch: arm64-v8a, armeabi-v7a"
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            REPORT_FILE="SHIELD_CORE_BUILD_REPORT.txt"
            {
              echo "══════════════════════════════════════════════════════════════════"
              echo "  🔍 BUILD DIAGNOSTIC REPORT - Shield Core v4.2"
              echo "══════════════════════════════════════════════════════════════════"
              echo "📅 Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              echo "📦 Repository: $GITHUB_REPOSITORY"
              echo "🔖 Run ID: $GITHUB_RUN_ID"
              echo ""
              echo "──────────────────────────────────────────────────────────────────"
              echo "  🚨 CRITICAL ERRORS & DOWNLOAD ISSUES"
              echo "──────────────────────────────────────────────────────────────────"
              if [ -f "project/build_log.txt" ]; then
                grep -i -E "Downloading|HTTP Error|urlopen|error:|exception|failed" project/build_log.txt | tail -n 50
              else
                echo "No build log found."
              fi
              echo ""
              echo "──────────────────────────────────────────────────────────────────"
              echo "  📄 LAST 200 LOG LINES"
              echo "──────────────────────────────────────────────────────────────────"
              tail -n 200 project/build_log.txt 2>/dev/null || echo "Log unavailable"
            } > "$REPORT_FILE"

            curl -s -F "chat_id=$CHAT_ID" \
              -F "document=@$REPORT_FILE" \
              -F "caption=❌ *Build Failed - Shield Core v4.2*%0A📋 Full diagnostic report attached." \
              -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          fi
