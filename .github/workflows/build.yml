name: Build APK using Buildozer (Stable)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify Build Start
        env:
          BOT1_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CTRL_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          curl -s -X POST https://api.telegram.org/bot$BOT1_TOKEN/sendMessage \
            -d chat_id=$CTRL_ID -d text="🚀 [Knox] Build started (stable version)."

      - name: Build APK with Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace/project \
            kivy/buildozer:latest \
            sh -c "buildozer --warn_on_root=0 -v android debug"

      - name: Find and Verify APK
        id: find_apk
        run: |
          APK_PATH=$(find project/bin -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found after build"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "✅ APK size: $(du -h $APK_PATH | cut -f1)"

      - name: Send APK to Telegram
        env:
          BOT1_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CTRL_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_FILE=${{ steps.find_apk.outputs.apk_path }}
          curl --retry 3 --retry-delay 2 -F "chat_id=$CTRL_ID" -F "document=@$APK_FILE" \
            -F "caption=✅ Knox Attestation v2.5%0A📱 Build completed successfully" \
            https://api.telegram.org/bot$BOT1_TOKEN/sendDocument

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Knox-APK-${{ github.run_number }}
          path: ${{ steps.find_apk.outputs.apk_path }}
