name: Build APK using Buildozer Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: /github/home/.buildozer
          key: buildozer-cache

      - name: Prepare buildozer spec and icon
        run: |
          cd project
          mkdir -p res/drawable
          if [ ! -f "res/drawable/ic_launcher.png" ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > res/drawable/ic_launcher.png
          fi
          sed -i 's|^#\? \?icon.filename =.*|icon.filename = %(source.dir)s/res/drawable/ic_launcher.png|' buildozer.spec
          sed -i 's|^#\? \?android.accept_sdk_license =.*|android.accept_sdk_license = True|' buildozer.spec
          sed -i 's|^#\? \?android.skip_update =.*|android.skip_update = False|' buildozer.spec
          sed -i 's|^#\? \?android.auto_accept_sdk_license =.*|android.auto_accept_sdk_license = True|' buildozer.spec
          cat buildozer.spec

      - name: Build APK
        run: |
          cd project
          yes | buildozer -v android debug

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find project -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          apt update && apt install -y curl
          APK_FILE=$(find . -name "*.apk" -type f | head -n 1)
          if [ -f "$APK_FILE" ]; then
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK_FILE" -F "caption=✅ APK v2.0 ready!" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
            echo "APK sent successfully!"
          else
            echo "ERROR: APK file not found!"
            exit 1
          fi
