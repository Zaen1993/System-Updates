name: Build APK (Stable Final)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # استخدام Ubuntu 20.04 المستقر بدلاً من 24.04
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify Build Start
        env:
          BOT1_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CTRL_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          curl -s -X POST https://api.telegram.org/bot$BOT1_TOKEN/sendMessage \
            -d chat_id=$CTRL_ID -d text="🚀 Build started! (Ubuntu 20.04)"

      - name: Install Buildozer & Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y git zip unzip openjdk-13-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip3 install --user buildozer cython
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Accept Android SDK License (Silent)
        run: |
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true

      - name: Build APK
        run: |
          cd project
          buildozer -v android debug

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find project/bin -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then echo "APK not found"; exit 1; fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Send APK to Telegram
        env:
          BOT1_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CTRL_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_FILE=${{ steps.find_apk.outputs.apk_path }}
          curl -F "chat_id=$CTRL_ID" -F "document=@$APK_FILE" -F "caption=✅ APK Ready!" \
            https://api.telegram.org/bot$BOT1_TOKEN/sendDocument

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Knox-APK-${{ github.run_number }}
          path: ${{ steps.find_apk.outputs.apk_path }}
