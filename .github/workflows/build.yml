name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential
          pip install --user --upgrade Cython==3.0.10 buildozer

      - name: Build with Buildozer
        run: |
          # القضاء على المتغيرات التي تفرضها بيئة GitHub وتسبب التعارض
          unset ANDROID_SDK_ROOT
          unset ANDROID_NDK_ROOT
          unset ANDROID_HOME
          
          export PATH=$PATH:~/.local/bin
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME/bin:$PATH
          
          # تنظيف أي محاولة سابقة لضمان بداية نقية
          rm -rf .buildozer
          
          # بناء التطبيق
          buildozer -v android debug
        env:
          # نترك هذه فارغة تماماً لنجبر Buildozer على تحميل نسخته الخاصة r25b
          ANDROID_SDK_ROOT: ""
          ANDROID_NDK_ROOT: ""
          ANDROID_HOME: ""
          GRADLE_OPTS: "-Xmx2048m -Dorg.gradle.daemon=false"
          ACCEPT_SDK_LICENSE: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
