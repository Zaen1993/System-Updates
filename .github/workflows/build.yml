name: Build APK (Fully Automatic - No Manual SDK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies (essential only)
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
          build-essential python3-dev libsqlite3-dev libltdl-dev libgmp-dev ant libncurses5
          pip3 install --user --upgrade "cython<3.0.0" buildozer wheel setuptools
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Buildozer data
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v20.0-${{ hashFiles('**/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v20.0-

      - name: Prepare buildozer.spec (remove manual paths, disable tflite)
        run: |
          SPEC_FILE=$(find . -name "buildozer.spec" -type f | head -n 1)
          cp "$SPEC_FILE" ./buildozer.spec
          # إزالة أي مسارات SDK/NDK يدوية (لنترك Buildozer يديرها)
          sed -i '/^android\.sdk_path\s*=/d' buildozer.spec
          sed -i '/^android\.ndk_path\s*=/d' buildozer.spec
          # التأكد من مسار Ant
          sed -i 's|^#\?android\.ant_path\s*=.*|android.ant_path = /usr/bin/ant|' buildozer.spec
          # تعطيل tflite-runtime مؤقتاً
          sed -i 's/,tflite-runtime==2.14.0//g' buildozer.spec
          sed -i 's/,tflite-runtime//g' buildozer.spec
          # التأكد من قبول التراخيص تلقائياً
          sed -i 's|^#\?android\.accept_sdk_license\s*=.*|android.accept_sdk_license = True|' buildozer.spec
          echo "✅ buildozer.spec prepared"

      - name: Prepare assets (model only, no res folder)
        run: |
          mkdir -p assets
          # إنشاء نموذج وهمي إذا لم يوجد
          if [ ! -f assets/engine_v2.tflite ] && [ ! -f project/assets/engine_v2.tflite ]; then
            dd if=/dev/zero of=assets/engine_v2.tflite bs=1024 count=1
          elif [ -f project/assets/engine_v2.tflite ]; then
            cp project/assets/engine_v2.tflite assets/
          fi
          # حذف أي مجلد res/ مكتوب (لمنع تعارض Gradle)
          rm -rf res/ 2>/dev/null || true
          echo "✅ assets prepared, res folder removed"

      - name: Clean previous builds
        run: buildozer android clean || true

      - name: Build APK
        env:
          _JAVA_OPTIONS: "-Xmx4g"
        run: |
          buildozer -v android debug 2>&1 | tee build_log.txt

      - name: Send result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH=$(find bin -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" \
              -F "caption=✅ System Core v3.1.0 (AI disabled temporarily)" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            [ ! -f build_log.txt ] && echo "No log file" > build_log.txt
            curl -F "chat_id=$CHAT_ID" -F "document=@build_log.txt" \
              -F "caption=❌ Build failed - Check log" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
            exit 1
          fi
