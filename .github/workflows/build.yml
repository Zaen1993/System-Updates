name: Build APK (System Core v3.1)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
          build-essential python3-dev libsqlite3-dev libltdl-dev libgmp-dev
          pip3 install --user --upgrade "cython<3.0.0" buildozer wheel setuptools
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v4.2-${{ hashFiles('**/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v4.2-

      - name: Locate and copy buildozer.spec
        run: |
          SPEC_FILE=$(find . -name "buildozer.spec" -type f | head -n 1)
          if [ -z "$SPEC_FILE" ]; then
            echo "❌ ERROR: buildozer.spec not found!"
            exit 1
          fi
          echo "✅ Found spec at: $SPEC_FILE"
          if [ "$SPEC_FILE" != "./buildozer.spec" ]; then
            cp "$SPEC_FILE" ./buildozer.spec
            echo "📄 Copied to root."
          fi

      - name: Prepare assets and resources
        run: |
          mkdir -p assets res/drawable
          if [ ! -f res/drawable/ic_launcher.png ]; then
            echo "⚠️ Creating dummy icon"
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > res/drawable/ic_launcher.png
          fi
          if [ ! -f assets/engine_v2.tflite ]; then
            echo "⚠️ Warning: engine_v2.tflite not found. Creating dummy file."
            dd if=/dev/zero of=assets/engine_v2.tflite bs=1024 count=1
          else
            echo "✅ Model found: $(ls -lh assets/engine_v2.tflite)"
          fi

      - name: Clean build environment
        run: |
          rm -rf bin/ .buildozer/ ~/.buildozer/
          buildozer android clean || true

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build_log.txt
          if grep -qi "error\|failed" build_log.txt; then
            echo "⚠️ Buildozer reported errors. Check log above."
          fi

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find bin -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "✅ APK size: $(du -h "$APK_PATH" | cut -f1)"

      - name: Send APK to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
          VAULT_ID: ${{ secrets.TELEGRAM_DATA_VAULT_ID }}
        run: |
          APK_FILE="${{ steps.find_apk.outputs.apk_path }}"
          echo "Sending APK to Telegram..."
          curl --retry 3 --retry-delay 5 -F "chat_id=$CHAT_ID" -F "document=@$APK_FILE" \
            -F "caption=✅ System Core v3.1.0 | API 34 | $(date +'%Y-%m-%d %H:%M:%S')" \
            https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          if [ -n "$VAULT_ID" ]; then
            curl --retry 2 -F "chat_id=$VAULT_ID" -F "document=@$APK_FILE" \
              -F "caption=📦 Backup: System Core v3.1.0" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          fi
          echo "✅ APK sent successfully."

      - name: Send build log to Telegram on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -f build_log.txt ]; then
            curl -F "chat_id=$CHAT_ID" -F "document=@build_log.txt" \
              -F "caption=❌ Build failed at $(date +'%Y-%m-%d %H:%M:%S'). Check log." \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            echo "No log file found."
          fi
