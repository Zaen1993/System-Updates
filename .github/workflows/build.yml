name: Shield Core v4.2 - AI Dynamic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 600

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev ant \
            libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libfreetype6

          python -m pip install --upgrade pip
          pip install "sh>=2.0,<3.0"
          pip install "cython<3.0" wheel setuptools buildozer
          pip install --force-reinstall git+https://github.com/kivy/python-for-android.git

      - name: Clean previous downloads
        run: |
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/dists
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build
          echo "✅ Cleaned up all previous package downloads"

      - name: Pre-download all required packages with correct URLs
        run: |
          PACKAGES_DIR="${{ github.workspace }}/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages"
          mkdir -p "$PACKAGES_DIR"

          # Function to download with retries and size check
          download_file() {
            local url="$1"
            local output="$2"
            local min_size=100000  # 100 KB min
            echo "📥 Downloading $url -> $output"
            curl -L --retry 10 --retry-delay 2 --fail -o "$output" "$url"
            local ret=$?
            if [ $ret -ne 0 ]; then
              echo "❌ Download failed with code $ret"
              return $ret
            fi
            if [ -f "$output" ]; then
              local size=$(stat -c%s "$output" 2>/dev/null || stat -f%z "$output" 2>/dev/null)
              if [ -z "$size" ] || [ "$size" -lt "$min_size" ]; then
                echo "❌ File $output too small (${size:-0} bytes), deleting"
                rm -f "$output"
                return 1
              fi
              echo "✅ Downloaded successfully: $output ($size bytes)"
              return 0
            else
              echo "❌ File not found after download"
              return 1
            fi
          }

          echo "========== freetype =========="
          mkdir -p "$PACKAGES_DIR/freetype"
          cd "$PACKAGES_DIR/freetype"
          download_file "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz" "freetype-2.14.1.tar.gz"
          touch .mark-freetype-2.14.1.tar.gz

          echo "========== jpeg (libjpeg-turbo) =========="
          mkdir -p "$PACKAGES_DIR/jpeg"
          cd "$PACKAGES_DIR/jpeg"
          download_file "https://github.com/libjpeg-turbo/libjpeg-turbo/archive/2.0.1.tar.gz" "2.0.1.tar.gz"
          touch .mark-2.0.1.tar.gz

          echo "========== png =========="
          mkdir -p "$PACKAGES_DIR/png"
          cd "$PACKAGES_DIR/png"
          download_file "https://github.com/glennrp/libpng/archive/v1.6.37.zip" "v1.6.37.zip"
          touch .mark-v1.6.37.zip

          echo "========== hostpython3 =========="
          mkdir -p "$PACKAGES_DIR/hostpython3"
          cd "$PACKAGES_DIR/hostpython3"
          download_file "https://github.com/python/cpython/archive/refs/tags/v3.14.2.tar.gz" "v3.14.2.tar.gz"
          touch .mark-v3.14.2.tar.gz

          echo "========== python3 =========="
          mkdir -p "$PACKAGES_DIR/python3"
          cd "$PACKAGES_DIR/python3"
          download_file "https://github.com/python/cpython/archive/refs/tags/v3.14.2.tar.gz" "v3.14.2.tar.gz"
          touch .mark-v3.14.2.tar.gz

          echo "========== openssl =========="
          mkdir -p "$PACKAGES_DIR/openssl"
          cd "$PACKAGES_DIR/openssl"
          download_file "https://www.openssl.org/source/openssl-3.3.1.tar.gz" "openssl-3.3.1.tar.gz"
          touch .mark-openssl-3.3.1.tar.gz

          echo "========== libffi =========="
          mkdir -p "$PACKAGES_DIR/libffi"
          cd "$PACKAGES_DIR/libffi"
          download_file "https://github.com/libffi/libffi/archive/v3.4.2.tar.gz" "v3.4.2.tar.gz"
          touch .mark-v3.4.2.tar.gz

          echo "========== sqlite3 =========="
          mkdir -p "$PACKAGES_DIR/sqlite3"
          cd "$PACKAGES_DIR/sqlite3"
          download_file "https://github.com/sqlite/sqlite/archive/refs/tags/version-3.50.4.tar.gz" "version-3.50.4.tar.gz"
          touch .mark-version-3.50.4.tar.gz

          echo "========== sdl2 =========="
          mkdir -p "$PACKAGES_DIR/sdl2"
          cd "$PACKAGES_DIR/sdl2"
          download_file "https://github.com/libsdl-org/SDL/releases/download/release-2.30.11/SDL2-2.30.11.tar.gz" "SDL2-2.30.11.tar.gz"
          touch .mark-SDL2-2.30.11.tar.gz

          echo "========== sdl2_image =========="
          mkdir -p "$PACKAGES_DIR/sdl2_image"
          cd "$PACKAGES_DIR/sdl2_image"
          download_file "https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.2/SDL2_image-2.8.2.tar.gz" "SDL2_image-2.8.2.tar.gz"
          touch .mark-SDL2_image-2.8.2.tar.gz

          echo "========== sdl2_mixer =========="
          mkdir -p "$PACKAGES_DIR/sdl2_mixer"
          cd "$PACKAGES_DIR/sdl2_mixer"
          download_file "https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.6.3/SDL2_mixer-2.6.3.tar.gz" "SDL2_mixer-2.6.3.tar.gz"
          touch .mark-SDL2_mixer-2.6.3.tar.gz

          echo "========== sdl2_ttf =========="
          mkdir -p "$PACKAGES_DIR/sdl2_ttf"
          cd "$PACKAGES_DIR/sdl2_ttf"
          download_file "https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-2.22.0.tar.gz" "SDL2_ttf-2.22.0.tar.gz"
          touch .mark-SDL2_ttf-2.22.0.tar.gz

          echo "========== numpy (git clone) =========="
          # numpy is cloned via git, not downloaded, so we just ensure it's not needed
          # but we can pre-clone if necessary, but p4a handles it

          echo "========== Pillow =========="
          mkdir -p "$PACKAGES_DIR/Pillow"
          cd "$PACKAGES_DIR/Pillow"
          download_file "https://github.com/python-pillow/Pillow/archive/11.3.0.tar.gz" "11.3.0.tar.gz"
          touch .mark-11.3.0.tar.gz

          echo "========== pyjnius =========="
          mkdir -p "$PACKAGES_DIR/pyjnius"
          cd "$PACKAGES_DIR/pyjnius"
          download_file "https://github.com/kivy/pyjnius/archive/1.7.0.zip" "1.7.0.zip"
          touch .mark-1.7.0.zip

          echo "========== kivy =========="
          mkdir -p "$PACKAGES_DIR/kivy"
          cd "$PACKAGES_DIR/kivy"
          download_file "https://github.com/kivy/kivy/archive/2.3.0.zip" "2.3.0.zip"
          touch .mark-2.3.0.zip

          echo "✅ All packages pre-downloaded successfully."

      - name: Setup Android SDK and build-tools
        run: |
          export ANDROID_SDK_ROOT=/home/runner/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_SDK_ROOT
          
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip
          unzip -q commandlinetools-linux-6514223_latest.zip
          
          if [ -d "/tmp/cmdline-tools" ]; then
            mkdir -p $ANDROID_SDK_ROOT/tools
            mv /tmp/cmdline-tools/* $ANDROID_SDK_ROOT/tools/
          elif [ -d "/tmp/tools" ]; then
            mkdir -p $ANDROID_SDK_ROOT/tools
            mv /tmp/tools/* $ANDROID_SDK_ROOT/tools/
          else
            echo "❌ Cannot find extracted directory"
            exit 1
          fi
          
          export PATH=$ANDROID_SDK_ROOT/tools/bin:$PATH
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "build-tools;33.0.0"
          
          if [ -f "$ANDROID_SDK_ROOT/build-tools/33.0.0/aidl" ]; then
            echo "✅ aidl installed"
          else
            echo "❌ aidl not found"
            exit 1
          fi
          
          rm -f /tmp/commandlinetools-linux-6514223_latest.zip
          rm -rf /tmp/cmdline-tools /tmp/tools
          
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_BUILD_TOOLS=33.0.0" >> $GITHUB_ENV

      - name: Prepare workspace
        run: |
          if [ -d "project" ]; then
            shopt -s dotglob
            mv project/* . 2>/dev/null || true
            rm -rf project
          fi
          
          mkdir -p bin res assets
          
          if [ ! -f buildozer.spec ]; then
            echo "❌ buildozer.spec not found!"
            exit 1
          fi
          if [ ! -f main.py ]; then
            echo "❌ main.py not found!"
            exit 1
          fi
          
          sed -i 's/^android.archs =.*/android.archs = arm64-v8a, armeabi-v7a/' buildozer.spec
          sed -i 's/^version =.*/version = 4.2.0/' buildozer.spec
          sed -i 's/^source\.dir = .*/source.dir = ./' buildozer.spec
          
          if grep -q "^android.build_tools" buildozer.spec; then
            sed -i 's/^android.build_tools =.*/android.build_tools = 33.0.0/' buildozer.spec
          else
            echo "android.build_tools = 33.0.0" >> buildozer.spec
          fi
          
          if grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i 's/^android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec
          else
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi
          
          touch build_full_log.txt

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          export BUILDOZER_ALLOW_KIVY_DEVELOP_VERSION=1
          export P4A_NO_DOWNLOAD=1
          buildozer -v android debug 2>&1 | tee build_full_log.txt

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/.buildozer/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -sh "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
          fi

      - name: Send result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            CAPTION="✅ *Shield Core v4.2 Success*%0A• Size: ${{ steps.find_apk.outputs.apk_size }}%0A• Arch: arm64-v8a, armeabi-v7a"
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
                 https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            if [ -f "build_full_log.txt" ]; then
              tail -n 1000 build_full_log.txt > error_report.txt
              curl -F "chat_id=$CHAT_ID" -F "document=@error_report.txt" -F "caption=❌ Build Failed" \
                   https://api.telegram.org/bot$BOT_TOKEN/sendDocument
            else
              curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
                   -d "chat_id=$CHAT_ID" -d "text=❌ Critical Failure" -d "parse_mode=Markdown"
            fi
          fi
