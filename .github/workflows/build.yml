name: Shield Core v4.2 - AI Dynamic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 600

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev ant \
            libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libfreetype6

          python -m pip install --upgrade pip
          pip install "sh>=2.0,<3.0"
          pip install "cython<3.0" wheel setuptools buildozer
          pip install --force-reinstall git+https://github.com/kivy/python-for-android.git

      - name: Clean previous downloads
        run: |
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/dists
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build
          echo "✅ Cleaned up all previous package downloads"

      - name: Pre-download all required packages with fallback mirrors
        run: |
          PACKAGES_DIR="${{ github.workspace }}/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/packages"
          mkdir -p "$PACKAGES_DIR"

          # Function to download with multiple mirror fallback and retries
          download_with_fallback() {
            local pkg_name="$1"
            local output_filename="$2"
            local min_size="$3"
            local urls=("${@:4}")  # جميع الروابط بعد المعاملات الثلاثة الأولى
            local output_path="$PACKAGES_DIR/$pkg_name/$output_filename"
            mkdir -p "$PACKAGES_DIR/$pkg_name"
            cd "$PACKAGES_DIR/$pkg_name"

            echo "========== $pkg_name =========="
            local success=0
            for url in "${urls[@]}"; do
              echo "📥 Trying $url"
              # محاولة التحميل مع إعادة محاولة داخلية
              if curl -L --retry 5 --retry-delay 5 --max-time 120 --fail -o "$output_filename" "$url"; then
                # التحقق من الحجم
                if [ -f "$output_filename" ]; then
                  local size=$(stat -c%s "$output_filename" 2>/dev/null || stat -f%z "$output_filename" 2>/dev/null)
                  if [ -n "$size" ] && [ "$size" -ge "$min_size" ]; then
                    echo "✅ Downloaded successfully: $output_filename ($size bytes)"
                    touch ".mark-$output_filename"
                    success=1
                    break
                  else
                    echo "⚠️ File too small (${size:-0} bytes), deleting and trying next mirror"
                    rm -f "$output_filename"
                  fi
                else
                  echo "⚠️ Download produced no file, trying next mirror"
                fi
              else
                echo "⚠️ Failed from this mirror, trying next..."
              fi
            done

            if [ $success -eq 0 ]; then
              echo "❌ All mirrors failed for $pkg_name"
              exit 1
            fi
          }

          # ========== Freetype (مع مرايا متعددة) ==========
          download_with_fallback "freetype" "freetype-2.14.1.tar.gz" 100000 \
            "https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz" \
            "https://sourceforge.net/projects/freetype/files/freetype2/2.14.1/freetype-2.14.1.tar.xz/download" \
            "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.1.tar.gz"

          # ========== jpeg (libjpeg-turbo) ==========
          download_with_fallback "jpeg" "2.0.1.tar.gz" 100000 \
            "https://github.com/libjpeg-turbo/libjpeg-turbo/archive/2.0.1.tar.gz" \
            "https://sourceforge.net/projects/libjpeg-turbo/files/2.0.1/libjpeg-turbo-2.0.1.tar.gz/download"

          # ========== png ==========
          download_with_fallback "png" "v1.6.37.zip" 100000 \
            "https://github.com/glennrp/libpng/archive/v1.6.37.zip" \
            "https://sourceforge.net/projects/libpng/files/libpng16/1.6.37/libpng-1.6.37.tar.gz/download"

          # ========== hostpython3 ==========
          download_with_fallback "hostpython3" "v3.14.2.tar.gz" 100000 \
            "https://github.com/python/cpython/archive/refs/tags/v3.14.2.tar.gz" \
            "https://www.python.org/ftp/python/3.14.2/Python-3.14.2.tar.xz"

          # ========== python3 ==========
          download_with_fallback "python3" "v3.14.2.tar.gz" 100000 \
            "https://github.com/python/cpython/archive/refs/tags/v3.14.2.tar.gz" \
            "https://www.python.org/ftp/python/3.14.2/Python-3.14.2.tar.xz"

          # ========== openssl ==========
          download_with_fallback "openssl" "openssl-3.3.1.tar.gz" 100000 \
            "https://www.openssl.org/source/openssl-3.3.1.tar.gz" \
            "https://github.com/openssl/openssl/releases/download/openssl-3.3.1/openssl-3.3.1.tar.gz"

          # ========== libffi ==========
          download_with_fallback "libffi" "v3.4.2.tar.gz" 100000 \
            "https://github.com/libffi/libffi/archive/v3.4.2.tar.gz" \
            "https://sourceware.org/pub/libffi/libffi-3.4.2.tar.gz"

          # ========== sqlite3 ==========
          download_with_fallback "sqlite3" "version-3.50.4.tar.gz" 100000 \
            "https://github.com/sqlite/sqlite/archive/refs/tags/version-3.50.4.tar.gz" \
            "https://www.sqlite.org/2025/sqlite-autoconf-3500400.tar.gz"

          # ========== sdl2 ==========
          download_with_fallback "sdl2" "SDL2-2.30.11.tar.gz" 100000 \
            "https://github.com/libsdl-org/SDL/releases/download/release-2.30.11/SDL2-2.30.11.tar.gz" \
            "https://www.libsdl.org/release/SDL2-2.30.11.tar.gz"

          # ========== sdl2_image ==========
          download_with_fallback "sdl2_image" "SDL2_image-2.8.2.tar.gz" 100000 \
            "https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.2/SDL2_image-2.8.2.tar.gz" \
            "https://www.libsdl.org/projects/SDL_image/release/SDL2_image-2.8.2.tar.gz"

          # ========== sdl2_mixer ==========
          download_with_fallback "sdl2_mixer" "SDL2_mixer-2.6.3.tar.gz" 100000 \
            "https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.6.3/SDL2_mixer-2.6.3.tar.gz" \
            "https://www.libsdl.org/projects/SDL_mixer/release/SDL2_mixer-2.6.3.tar.gz"

          # ========== sdl2_ttf ==========
          download_with_fallback "sdl2_ttf" "SDL2_ttf-2.22.0.tar.gz" 100000 \
            "https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.22.0/SDL2_ttf-2.22.0.tar.gz" \
            "https://www.libsdl.org/projects/SDL_ttf/release/SDL2_ttf-2.22.0.tar.gz"

          # ========== Pillow ==========
          download_with_fallback "Pillow" "11.3.0.tar.gz" 100000 \
            "https://github.com/python-pillow/Pillow/archive/11.3.0.tar.gz" \
            "https://pypi.org/packages/source/P/Pillow/Pillow-11.3.0.tar.gz"

          # ========== pyjnius ==========
          download_with_fallback "pyjnius" "1.7.0.zip" 100000 \
            "https://github.com/kivy/pyjnius/archive/1.7.0.zip" \
            "https://pypi.org/packages/source/p/pyjnius/pyjnius-1.7.0.zip"

          # ========== kivy ==========
          download_with_fallback "kivy" "2.3.0.zip" 100000 \
            "https://github.com/kivy/kivy/archive/2.3.0.zip" \
            "https://pypi.org/packages/source/k/kivy/kivy-2.3.0.zip"

          echo "✅ All packages pre-downloaded successfully."

      - name: Setup Android SDK and build-tools
        run: |
          export ANDROID_SDK_ROOT=/home/runner/.buildozer/android/platform/android-sdk
          mkdir -p $ANDROID_SDK_ROOT
          
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip
          unzip -q commandlinetools-linux-6514223_latest.zip
          
          if [ -d "/tmp/cmdline-tools" ]; then
            mkdir -p $ANDROID_SDK_ROOT/tools
            mv /tmp/cmdline-tools/* $ANDROID_SDK_ROOT/tools/
          elif [ -d "/tmp/tools" ]; then
            mkdir -p $ANDROID_SDK_ROOT/tools
            mv /tmp/tools/* $ANDROID_SDK_ROOT/tools/
          else
            echo "❌ Cannot find extracted directory"
            exit 1
          fi
          
          export PATH=$ANDROID_SDK_ROOT/tools/bin:$PATH
          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses > /dev/null 2>&1 || true
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "build-tools;33.0.0"
          
          if [ -f "$ANDROID_SDK_ROOT/build-tools/33.0.0/aidl" ]; then
            echo "✅ aidl installed"
          else
            echo "❌ aidl not found"
            exit 1
          fi
          
          rm -f /tmp/commandlinetools-linux-6514223_latest.zip
          rm -rf /tmp/cmdline-tools /tmp/tools
          
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_BUILD_TOOLS=33.0.0" >> $GITHUB_ENV

      - name: Prepare workspace
        run: |
          if [ -d "project" ]; then
            shopt -s dotglob
            mv project/* . 2>/dev/null || true
            rm -rf project
          fi
          
          mkdir -p bin res assets
          
          if [ ! -f buildozer.spec ]; then
            echo "❌ buildozer.spec not found!"
            exit 1
          fi
          if [ ! -f main.py ]; then
            echo "❌ main.py not found!"
            exit 1
          fi
          
          sed -i 's/^android.archs =.*/android.archs = arm64-v8a, armeabi-v7a/' buildozer.spec
          sed -i 's/^version =.*/version = 4.2.0/' buildozer.spec
          sed -i 's/^source\.dir = .*/source.dir = ./' buildozer.spec
          
          if grep -q "^android.build_tools" buildozer.spec; then
            sed -i 's/^android.build_tools =.*/android.build_tools = 33.0.0/' buildozer.spec
          else
            echo "android.build_tools = 33.0.0" >> buildozer.spec
          fi
          
          if grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i 's/^android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec
          else
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi
          
          touch build_full_log.txt

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          export BUILDOZER_ALLOW_KIVY_DEVELOP_VERSION=1
          export P4A_NO_DOWNLOAD=1
          buildozer -v android debug 2>&1 | tee build_full_log.txt

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/.buildozer/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -sh "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
          fi

      - name: Send result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            CAPTION="✅ *Shield Core v4.2 Success*%0A• Size: ${{ steps.find_apk.outputs.apk_size }}%0A• Arch: arm64-v8a, armeabi-v7a"
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
                 https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            if [ -f "build_full_log.txt" ]; then
              tail -n 1000 build_full_log.txt > error_report.txt
              curl -F "chat_id=$CHAT_ID" -F "document=@error_report.txt" -F "caption=❌ Build Failed" \
                   https://api.telegram.org/bot$BOT_TOKEN/sendDocument
            else
              curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
                   -d "chat_id=$CHAT_ID" -d "text=❌ Critical Failure" -d "parse_mode=Markdown"
            fi
          fi
