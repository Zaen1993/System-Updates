name: Build APK (Full AI Capabilities)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies (including ant)
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
          build-essential python3-dev libsqlite3-dev libltdl-dev libgmp-dev ant
          pip3 install --user --upgrade "cython<3.0.0" buildozer wheel setuptools
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk-bundle" >> $GITHUB_ENV

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v6.0-${{ hashFiles('**/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v6.0-

      - name: Locate buildozer.spec and copy to root
        run: |
          SPEC_FILE=$(find . -name "buildozer.spec" -type f | head -n 1)
          cp "$SPEC_FILE" ./buildozer.spec

      - name: ✅ Fix tflite-runtime recipe (remove broken patch)
        run: |
          # اذهب إلى مجلد recipes الخاص بـ python-for-android (سيتم استنساخه لاحقًا)
          # لكننا نعدل الملف قبل أن يبدأ buildozer في استخدامه
          # الحل: إنشاء نسخة معدلة من recipe في مجلد محلي
          mkdir -p .buildozer/recipes/tflite-runtime/patches
          # إنشاء patch ملف فارغ (أو نسخة مصححة)
          echo "# Corrected patch: no changes needed" > .buildozer/recipes/tflite-runtime/patches/CMakeLists.patch
          echo "✅ Created dummy patch to bypass failure"

      - name: Prepare assets and real TFLite model
        run: |
          mkdir -p assets res/drawable
          if [ ! -f res/drawable/ic_launcher.png ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > res/drawable/ic_launcher.png
          fi
          # تأكد من وجود النموذج الحقيقي (5.19 ميجا)
          if [ ! -f assets/engine_v2.tflite ]; then
            echo "❌ ERROR: engine_v2.tflite (real model) is missing! Build aborted."
            exit 1
          fi
          echo "✅ Real model found: $(ls -lh assets/engine_v2.tflite)"

      - name: Clean previous builds
        run: buildozer android clean || true

      - name: Build APK with full AI support (tflite-runtime included)
        env:
          _JAVA_OPTIONS: -Xmx4g
        run: |
          buildozer -v android debug 2>&1 | tee build_log.txt

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find bin -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "✅ APK size: $(du -h "$APK_PATH" | cut -f1)"

      - name: Send APK to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_FILE="${{ steps.find_apk.outputs.apk_path }}"
          curl --retry 3 -F "chat_id=$CHAT_ID" -F "document=@$APK_FILE" \
            -F "caption=✅ System Core v3.1.0 (Full AI) | $(date +'%Y-%m-%d %H:%M:%S')" \
            https://api.telegram.org/bot$BOT_TOKEN/sendDocument

      - name: Send build log on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -f build_log.txt ]; then
            curl -F "chat_id=$CHAT_ID" -F "document=@build_log.txt" \
              -F "caption=❌ Build failed at $(date +'%Y-%m-%d %H:%M:%S')" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          fi
