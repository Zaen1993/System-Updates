name: Build APK (System Core v3.1)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== Cache لبيئة Buildozer ==========
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v3.1.0-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v3.1.0-

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
          build-essential python3-dev libsqlite3-dev
          pip3 install --user --upgrade "cython<3.0.0" buildozer wheel
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # ========== التحقق من وجود ملف الإعدادات الصحيح ==========
      - name: Prepare buildozer.spec
        run: |
          # استخدام ملف buildozer.spec الموجود في الجذر (مضمن في المستودع)
          if [ ! -f buildozer.spec ]; then
            echo "❌ buildozer.spec not found in root directory!"
            exit 1
          fi
          echo "✅ Using existing buildozer.spec"

      # ========== تجهيز الموارد (النموذج، الأيقونة) ==========
      - name: Prepare assets and resources
        run: |
          mkdir -p assets res/drawable

          # النموذج (engine_v2.tflite) يجب أن يكون موجوداً بحجم حقيقي (> 500KB)
          if [ ! -f assets/engine_v2.tflite ]; then
            echo "❌ ERROR: engine_v2.tflite not found in assets/"
            echo "Please add the real model file (size > 500KB) before building."
            exit 1
          fi
          MODEL_SIZE=$(stat -c%s assets/engine_v2.tflite)
          if [ $MODEL_SIZE -lt 500000 ]; then
            echo "❌ ERROR: engine_v2.tflite is too small ($MODEL_SIZE bytes). It seems corrupted or dummy."
            exit 1
          fi
          echo "✅ Model found: $(ls -lh assets/engine_v2.tflite)"

          # الأيقونة (يجب وجودها مسبقاً، وإلا سيتم استخدام أيقونة وهمية)
          if [ ! -f res/drawable/ic_launcher.png ]; then
            echo "⚠️ No icon found. Creating a dummy transparent 1x1 png (build will continue)."
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > res/drawable/ic_launcher.png
          fi

      - name: Clean previous build artifacts
        run: |
          rm -rf bin/ .buildozer/
          buildozer android clean || true

      # ========== بناء APK (بدون تعديل buildozer.spec) ==========
      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find bin -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK not found!"
            exit 1
          fi
          echo "apk_path=${APK_PATH}" >> $GITHUB_OUTPUT
          echo "✅ APK size: $(du -h "${APK_PATH}" | cut -f1)"

      # ========== إرسال APK إلى Telegram (بدون رفع GitHub Artifact) ==========
      - name: Send APK to Telegram
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
          VAULT_ID: ${{ secrets.TELEGRAM_DATA_VAULT_ID }}
        run: |
          APK_FILE="${{ steps.find_apk.outputs.apk_path }}"
          echo "Sending APK to Telegram..."

          # إرسال إلى Control Center
          curl --retry 3 --retry-delay 5 -F "chat_id=$CHAT_ID" -F "document=@$APK_FILE" \
            -F "caption=✅ System Core v3.1.0 | API 34 | $(date +'%Y-%m-%d %H:%M:%S')" \
            https://api.telegram.org/bot$BOT_TOKEN/sendDocument

          # نسخة احتياطية إلى Vault (إذا تم توفير المعرف)
          if [ -n "$VAULT_ID" ]; then
            curl --retry 2 -F "chat_id=$VAULT_ID" -F "document=@$APK_FILE" \
              -F "caption=📦 Backup: System Core v3.1.0" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          fi
          echo "✅ APK sent successfully."

      # ملاحظة: تم حذف خطوة upload-artifact لتوفير مساحة التخزين
