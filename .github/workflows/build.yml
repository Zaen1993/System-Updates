name: Shield Core v4.2 - AI Dynamic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 600

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== إعداد Python 3.10 ==========
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Verify Python version
        run: |
          echo "Python path: $(which python3)"
          python3 --version

      # ========== إعداد Java 11 (للتوافق مع SDK Tools) ==========
      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # ========== تثبيت تبعيات النظام ==========
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev ant \
            libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libfreetype6

      # ========== تثبيت حزم Python ==========
      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip wheel setuptools
          pip install "cython>=3.0.0,<3.1.0"
          pip install buildozer==1.5.0

      # ========== تنظيف البناء السابق ==========
      - name: Clean previous builds
        run: |
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/dists
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/other_builds/hostpython3
          rm -rf ~/.buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/other_builds/python3
          rm -rf ~/.buildozer/android/platform/android-ndk-r28c
          echo "✅ Cleaned build directories and NDK caches"

      # ========== تثبيت Android SDK و NDK ==========
      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          ndk: true
          ndk-version: '25.1.8937393'
          cmdline-tools-version: 'latest'
          build-tools: '33.0.0'

      # ========== قبول تراخيص SDK ==========
      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ========== تهيئة بيئة Buildozer (ربط كامل cmdline-tools كـ tools) ==========
      - name: Prepare Buildozer environment
        run: |
          mkdir -p ~/.buildozer/android/platform

          # ربط SDK
          ln -sfn $ANDROID_HOME ~/.buildozer/android/platform/android-sdk

          # ربط NDK بالأسماء المتوقعة لمنع إعادة التحميل
          ln -sfn $ANDROID_HOME/ndk/25.1.8937393 ~/.buildozer/android/platform/android-ndk-r25b
          ln -sfn $ANDROID_HOME/ndk/25.1.8937393 ~/.buildozer/android/platform/android-ndk-r28c

          # إصلاح مشكلة sdkmanager القديمة: ربط مجلد cmdline-tools/latest بالكامل إلى tools
          rm -rf ~/.buildozer/android/platform/android-sdk/tools
          ln -sfn $ANDROID_HOME/cmdline-tools/latest ~/.buildozer/android/platform/android-sdk/tools

          # التراخيص
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p $ANDROID_HOME/licenses
          LIC_CONTENT="24833b2982016492052132148d8a3d9f10821373\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9779e190921cd781e520d1d"
          echo -e "$LIC_CONTENT" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "$LIC_CONTENT" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b94096465377d65c8973ac5b54b97d04d00" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          echo "84831b94096465377d65c8973ac5b54b97d04d00" > $ANDROID_HOME/licenses/android-sdk-preview-license

          echo "✅ Buildozer environment prepared with full cmdline-tools symlink as tools"

      # ========== تعيين متغيرات البيئة ==========
      - name: Set Android environment variables
        run: |
          echo "ANDROIDAPI=33" >> $GITHUB_ENV
          echo "ANDROIDMINAPI=24" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
          echo "P4A_NO_DOWNLOAD=1" >> $GITHUB_ENV
          echo "P4A_ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "P4A_ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV

      # ========== تحضير مساحة العمل وتعديل buildozer.spec ==========
      - name: Prepare workspace
        run: |
          if [ -d "project" ]; then
            shopt -s dotglob
            cp -r project/* . 2>/dev/null || true
            rm -rf project
          fi

          mkdir -p bin res assets

          if [ -f "assets/engine_v2.tflite" ]; then
            echo "✅ AI model found in assets/engine_v2.tflite"
            ls -lh assets/engine_v2.tflite
          else
            echo "❌ CRITICAL: AI model MISSING from assets/engine_v2.tflite"
            exit 1
          fi

          if [ ! -f buildozer.spec ]; then
            echo "❌ buildozer.spec not found!"
            exit 1
          fi

          # تعديل buildozer.spec
          sed -i 's/^requirements =.*/requirements = python3==3.10.11,kivy==2.3.0,requests==2.31.0,Pillow>=10.0.0,<11.0.0,numpy,tflite-runtime==2.14.0/' buildozer.spec
          sed -i 's/^android.archs =.*/android.archs = arm64-v8a, armeabi-v7a/' buildozer.spec
          sed -i 's/^version =.*/version = 4.2.0/' buildozer.spec
          sed -i 's/^source\.dir = .*/source.dir = ./' buildozer.spec

          # تعيين مسار SDK و NDK
          sed -i 's|^#\? \?android.sdk_path =.*|android.sdk_path = '"$ANDROID_HOME"'|' buildozer.spec
          sed -i 's|^#\? \?android.ndk_path =.*|android.ndk_path = '"$ANDROID_HOME"'/ndk/25.1.8937393|' buildozer.spec

          # تعيين إصدار NDK إلى 25b
          if grep -q "^android.ndk" buildozer.spec; then
            sed -i 's/^android.ndk =.*/android.ndk = 25b/' buildozer.spec
          else
            echo "android.ndk = 25b" >> buildozer.spec
          fi

          # قبول الترخيص
          sed -i 's/^#\? \?android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec

          # تحديد إصدار build-tools
          if grep -q "^android.build_tools" buildozer.spec; then
            sed -i 's/^android.build_tools =.*/android.build_tools = 33.0.0/' buildozer.spec
          else
            echo "android.build_tools = 33.0.0" >> buildozer.spec
          fi

          # تعيين android.api و android.minapi
          if grep -q "^android.api" buildozer.spec; then
            sed -i 's/^android.api =.*/android.api = 33/' buildozer.spec
          else
            echo "android.api = 33" >> buildozer.spec
          fi

          if grep -q "^android.minapi" buildozer.spec; then
            sed -i 's/^android.minapi =.*/android.minapi = 24/' buildozer.spec
          else
            echo "android.minapi = 24" >> buildozer.spec
          fi

          # الصلاحيات
          if grep -q "^permissions" buildozer.spec; then
            sed -i 's/^permissions =.*/permissions = INTERNET, CAMERA, RECORD_AUDIO, WAKE_LOCK, FOREGROUND_SERVICE, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE/' buildozer.spec
          fi

          # تفعيل release
          if grep -q "^android.release" buildozer.spec; then
            sed -i 's/^android.release =.*/android.release = True/' buildozer.spec
          else
            echo "android.release = True" >> buildozer.spec
          fi

          echo "📄 buildozer.spec modified successfully"
          cat buildozer.spec | grep -E "requirements|android.api|android.minapi|android.build_tools|permissions|android.release|android.sdk_path|android.ndk_path|android.ndk"

      # ========== بناء APK ==========
      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          export PYTHON=/opt/hostedtoolcache/Python/3.10.20/x64/bin/python3
          export BUILDOZER_ALLOW_KIVY_DEVELOP_VERSION=1
          export P4A_NO_DOWNLOAD=1
          export P4A_PYTHON_VERSION=3.10.11
          export P4A_HOSTPYTHON=/opt/hostedtoolcache/Python/3.10.20/x64/bin/python3
          export ANDROIDAPI=33
          export ANDROIDMINAPI=24
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export ANDROID_NDK=$ANDROID_HOME/ndk/25.1.8937393
          export ANDROID_NDK_HOME=$ANDROID_NDK
          export P4A_ANDROID_SDK_ROOT=$ANDROID_HOME
          export P4A_ANDROID_NDK_ROOT=$ANDROID_NDK
          export P4A_NDK_DIR=$ANDROID_NDK
          export P4A_SDK_DIR=$ANDROID_HOME

          echo "=== Build Environment ==="
          python3 --version
          java -version
          echo "ANDROIDAPI: $ANDROIDAPI"
          echo "ANDROIDMINAPI: $ANDROIDMINAPI"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          echo "ANDROID_NDK: $ANDROID_NDK"
          echo "P4A_PYTHON_VERSION: $P4A_PYTHON_VERSION"
          echo "P4A_HOSTPYTHON: $P4A_HOSTPYTHON"
          echo "=========================="

          yes | python3 -m buildozer -v android debug -- \
            --sdk-dir "$ANDROID_HOME" \
            --ndk-dir "$ANDROID_HOME/ndk/25.1.8937393" \
            --ndk-version 25b \
            --android-api 33 \
            --ndk-api 24 \
            --hostpython /opt/hostedtoolcache/Python/3.10.20/x64/bin/python3 \
            --python-version 3.10.11 2>&1 | tee build_full_log.txt

      # ========== البحث عن APK ==========
      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/.buildozer/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -sh "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
            echo "✅ APK found: $APK_PATH"
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
            echo "❌ No APK found"
          fi

      # ========== إرسال النتيجة إلى تلغرام ==========
      - name: Send result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "❌ BOT_TOKEN or CHAT_ID is missing!"
            exit 1
          fi

          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          BUILD_STATUS="${{ steps.build.outcome }}"

          send_text() {
            local msg="$1"
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d "chat_id=$CHAT_ID" \
              -d "text=$msg" \
              -d "parse_mode=Markdown"
          }

          send_file() {
            local file_path="$1"
            local caption="$2"
            curl -v -F "chat_id=$CHAT_ID" \
              -F "document=@$file_path" \
              -F "caption=$caption" \
              -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          }

          send_text "🚀 *Build process completed*%0AStatus: $BUILD_STATUS"

          if [ "$BUILD_STATUS" == "success" ] && [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            CAPTION="✅ *Shield Core v4.2 Success*%0A• Size: ${{ steps.find_apk.outputs.apk_size }}%0A• Arch: arm64-v8a, armeabi-v7a"
            send_file "$APK_PATH" "$CAPTION"
            send_text "✅ *APK sent successfully*"
          else
            send_text "❌ *Build failed* or APK not found. Sending log file..."
            if [ -f "build_full_log.txt" ]; then
              tail -n 2000 build_full_log.txt > error_report.txt
              send_file "error_report.txt" "📋 *Build error log* (last 2000 lines)"
            else
              send_text "❌ No log file found."
            fi
            send_text "❌ *Build finished with errors or no APK generated.*"
          fi
