name: Shield Core v4.2 - AI Dynamic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== تنظيف المساحة ==========
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt clean
          df -h

      # ========== إعداد Python 3.10 ==========
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      # ========== إعداد Java 17 (مطلوب لـ sdkmanager الحديث) ==========
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ========== تثبيت تبعيات النظام ==========
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev ant \
            libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libfreetype6

      # ========== تثبيت حزم Python ==========
      - name: Install Python packages
        run: |
          python3 -m pip install --upgrade pip wheel setuptools
          pip install "cython>=3.0.0,<3.1.0"
          pip install buildozer==1.5.0

      # ========== تحضير مساحة العمل وتعديل buildozer.spec ==========
      - name: Prepare workspace & modify spec
        run: |
          if [ -d "project" ]; then
            shopt -s dotglob
            cp -r project/* . 2>/dev/null || true
            rm -rf project
          fi

          mkdir -p bin res assets

          # التحقق من وجود نموذج الذكاء الاصطناعي
          if [ -f "assets/engine_v2.tflite" ]; then
            echo "✅ AI model found in assets/engine_v2.tflite"
            ls -lh assets/engine_v2.tflite
          else
            echo "❌ CRITICAL: AI model MISSING from assets/engine_v2.tflite"
            exit 1
          fi

          if [ ! -f buildozer.spec ]; then
            echo "❌ buildozer.spec not found!"
            exit 1
          fi

          # ===== تعديل requirements (إزالة tflite-runtime) =====
          sed -i 's/^requirements =.*/requirements = python3==3.10.11,hostpython3==3.10.11,kivy==2.3.0,requests==2.31.0,Pillow>=10.0.0,<11.0.0,numpy/' buildozer.spec
          sed -i 's/^android.archs =.*/android.archs = arm64-v8a, armeabi-v7a/' buildozer.spec
          sed -i 's/^version =.*/version = 4.2.0/' buildozer.spec
          sed -i 's/^source\.dir = .*/source.dir = ./' buildozer.spec

          # ===== ضبط NDK إلى 25b (مستقر) و SDK و API =====
          sed -i 's/^#\? \?android.ndk =.*/android.ndk = 25b/' buildozer.spec
          sed -i 's/^#\? \?android.sdk =.*/android.sdk = 33/' buildozer.spec
          sed -i 's/^#\? \?android.build_tools =.*/android.build_tools = 33.0.2/' buildozer.spec
          sed -i 's/^#\? \?android.api =.*/android.api = 33/' buildozer.spec
          sed -i 's/^#\? \?android.minapi =.*/android.minapi = 24/' buildozer.spec
          if grep -q "^android.ndk_api" buildozer.spec; then
            sed -i 's/^#\? \?android.ndk_api =.*/android.ndk_api = 24/' buildozer.spec
          else
            echo "android.ndk_api = 24" >> buildozer.spec
          fi

          # قبول الترخيص تلقائياً
          sed -i 's/^#\? \?android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec

          # الصلاحيات
          sed -i 's/^#\? \?permissions =.*/permissions = INTERNET, CAMERA, RECORD_AUDIO, WAKE_LOCK, FOREGROUND_SERVICE, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE/' buildozer.spec

          echo "📄 Modified buildozer.spec check:"
          grep -E "requirements|android.api|android.minapi|android.ndk_api|android.build_tools|permissions|android.accept_sdk_license|android.ndk|android.sdk" buildozer.spec

      # ========== إعداد SDK و commandlinetools مع إنشاء Symlink للمسار القديم ==========
      - name: Setup Android SDK, Command Line Tools & Symlinks
        run: |
          SYSTEM_ANDROID_HOME="/usr/local/lib/android/sdk"
          BUILDOZER_SDK_HOME="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BUILDOZER_SDK_HOME/cmdline-tools"

          # 1. تنزيل commandlinetools باستخدام wget و User-Agent
          echo "📥 Downloading Android Command Line Tools..."
          URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          if wget --user-agent="Mozilla/5.0" -q "$URL" -O /tmp/cmdline-tools.zip && unzip -t /tmp/cmdline-tools.zip >/dev/null 2>&1; then
            echo "✅ Downloaded and verified commandlinetools."
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extracted
            mv /tmp/cmdline-extracted/cmdline-tools "$BUILDOZER_SDK_HOME/cmdline-tools/latest"
            rm -rf /tmp/cmdline*
          else
            echo "⚠️ Direct download failed. Using system cmdline-tools as fallback..."
            if [ -d "$SYSTEM_ANDROID_HOME/cmdline-tools" ]; then
              cp -r "$SYSTEM_ANDROID_HOME/cmdline-tools" "$BUILDOZER_SDK_HOME/"
              if [ ! -d "$BUILDOZER_SDK_HOME/cmdline-tools/latest" ]; then
                FIRST_DIR=$(ls "$BUILDOZER_SDK_HOME/cmdline-tools" | head -n 1)
                ln -s "$BUILDOZER_SDK_HOME/cmdline-tools/$FIRST_DIR" "$BUILDOZER_SDK_HOME/cmdline-tools/latest"
              fi
            fi
          fi

          # 2. إنشاء المسار القديم tools/bin/sdkmanager كـ Symlink لإرضاء p4a
          mkdir -p "$BUILDOZER_SDK_HOME/tools/bin"
          if [ -f "$BUILDOZER_SDK_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            ln -sfn "$BUILDOZER_SDK_HOME/cmdline-tools/latest/bin/sdkmanager" "$BUILDOZER_SDK_HOME/tools/bin/sdkmanager"
            ln -sfn "$BUILDOZER_SDK_HOME/cmdline-tools/latest/bin/avdmanager" "$BUILDOZER_SDK_HOME/tools/bin/avdmanager"
          fi

          # 3. ربط platform-tools و build-tools من النظام
          for dir in platform-tools build-tools; do
            if [ -d "$SYSTEM_ANDROID_HOME/$dir" ]; then
              ln -sfn "$SYSTEM_ANDROID_HOME/$dir" "$BUILDOZER_SDK_HOME/$dir"
            fi
          done

          # 4. كتابة التراخيص المقبولة تلقائياً
          LIC_DIR="$BUILDOZER_SDK_HOME/licenses"
          mkdir -p "$LIC_DIR"
          echo "24333f8a637b3744d16de1229303181f4247e684" > "$LIC_DIR/android-sdk-license"
          echo "84831b9402116e267be31215b248a33045ce379a" >> "$LIC_DIR/android-sdk-license"
          echo "d97531e834a4173572f1593404534000e026d7bc" >> "$LIC_DIR/android-sdk-license"
          echo "cd5010c71147d17086d61884fa00c23f337d652d" >> "$LIC_DIR/android-sdk-license"
          echo "2737080b29717cd60468788561da5881071d9e24" > "$LIC_DIR/android-sdk-preview-license"
          echo "6010071078069f99245149c7286a119d76ffc153" > "$LIC_DIR/android-googletv-license"
          echo "33b622e7462103008350b5921e841498f54316c7" > "$LIC_DIR/android-sdk-arm-dbt-license"
          echo "e9672915a00f49122fa44e251616c213a979fdb7" > "$LIC_DIR/mips-android-sysimage-license"

          # 5. تشغيل sdkmanager للتأكيد (مع Java 17)
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH="$JAVA_HOME/bin:$BUILDOZER_SDK_HOME/cmdline-tools/latest/bin:$PATH"
          if command -v sdkmanager &> /dev/null; then
            yes | sdkmanager --sdk_root="$BUILDOZER_SDK_HOME" --licenses || true
          fi

          echo "✅ Android SDK setup completed successfully."

      # ========== بناء APK ==========
      - name: Build APK
        id: build
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"

          # إلغاء أي متغيرات ANDROID* قد تتداخل
          unset ANDROIDMINAPI ANDROIDAPI ANDROIDNDK ANDROIDSDK

          echo "=== Build Environment ==="
          python3 --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "=========================="

          # تشغيل البناء مع yes لتجاوز أي مطالبات
          yes | buildozer -v android debug 2>&1 | tee build_log.txt

      # ========== إعادة المحاولة في حال الفشل ==========
      - name: Retry build if failed
        if: failure() && steps.build.outcome == 'failure'
        id: retry
        run: |
          echo "🔄 Retrying build after cleaning environment..."
          export JAVA_HOME=$JAVA_HOME_17_X64
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"
          unset ANDROIDMINAPI ANDROIDAPI ANDROIDNDK ANDROIDSDK

          # تنظيف الملفات المؤقتة
          rm -rf .buildozer/android/platform/build-* 2>/dev/null || true
          rm -rf ~/.buildozer/android/platform/android-sdk/platform-tools 2>/dev/null || true
          rm -rf ~/.buildozer/android/platform/android-sdk/build-tools 2>/dev/null || true

          # إعادة قبول التراخيص
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

          yes | buildozer -v android debug 2>&1 | tee -a build_log.txt

      # ========== البحث عن APK ==========
      - name: Locate APK
        if: always()
        id: find_apk
        run: |
          APK_PATH=$(find bin/ -type f -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -sh "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ APK found: $APK_PATH"
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ No APK found"
          fi

      # ========== إرسال النتيجة إلى تلغرام ==========
      - name: Send result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "❌ BOT_TOKEN or CHAT_ID is missing!"
            exit 1
          fi

          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          BUILD_STATUS="${{ steps.find_apk.outputs.status }}"

          if [ "$BUILD_STATUS" == "success" ] && [ -n "$APK_PATH" ]; then
            CAPTION="✅ *Shield Core v4.2 Success*%0A• Size: ${{ steps.find_apk.outputs.apk_size }}%0A• Arch: arm64-v8a, armeabi-v7a"
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d "chat_id=$CHAT_ID" -d "text=❌ *Build Failed!* Sending error logs..." -d "parse_mode=Markdown"
            if [ -f "build_log.txt" ]; then
              tail -n 1500 build_log.txt > error_report.txt
              curl -s -F "chat_id=$CHAT_ID" -F "document=@error_report.txt" -F "caption=📋 *Build Error Log*" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
            fi
          fi
