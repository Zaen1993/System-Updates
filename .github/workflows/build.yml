name: Shield Core v4.2 - AI Dynamic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== 1. تنظيف المساحة ==========
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      # ========== 2. إعداد Python 3.10 ==========
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      # ========== 3. إعداد Java 17 ==========
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ========== 4. إعداد Android SDK ==========
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ========== 5. تثبيت تبعيات النظام ==========
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev \
            libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libfreetype6 gfortran

      # ========== 6. تثبيت حزم SDK و NDK 25b وإعداد sdkmanager ==========
      - name: Install Android SDK & NDK packages
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.1.8937393"

          # ===== حل مشكلة sdkmanager path القديم =====
          # Buildozer/p4a يبحث عن sdkmanager في /tools/bin/، لذا ننشئ Symlink
          mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          ln -sf "$SDK_ROOT/cmdline-tools/latest/bin/avdmanager" ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager

          # ===== إنشاء مجلد التراخيص لـ Buildozer =====
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          echo "24333f8a637b3744d16de1229303181f4247e684" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "84831b9402116e267be31215b248a33045ce379a" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo "d97531e834a4173572f1593404534000e026d7bc" >> ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

          echo "✅ SDK & NDK packages installed and sdkmanager symlinked."

      # ========== 7. تثبيت Buildozer و p4a ==========
      - name: Install Buildozer and p4a
        run: |
          python3 -m pip install --upgrade pip wheel setuptools
          pip install "Cython==0.29.33"
          pip install "sh<2.0,>=1.10"
          pip install buildozer==1.5.0
          pip install python-for-android==2024.1.21
          echo "✅ Buildozer and p4a installed."

      # ========== 8. التحقق من نموذج الذكاء الاصطناعي ==========
      - name: Verify AI model
        run: |
          if [ -f "project/assets/engine_v2.tflite" ]; then
            echo "✅ AI model found at project/assets/engine_v2.tflite"
            ls -lh project/assets/engine_v2.tflite
          else
            echo "❌ AI model NOT found!"
            exit 1
          fi

      # ========== 9. كتابة buildozer.spec ==========
      - name: Write buildozer.spec
        run: |
          set -e
          cd project
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_PATH="$SDK_ROOT/ndk/25.1.8937393"

          cat > buildozer.spec << EOF
          [app]
          title = Shield Core
          package.name = shieldcore
          package.domain = com.sys
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,txt,json,tflite
          source.include_files = assets/engine_v2.tflite, res/
          version = 4.2.0

          requirements = python3==3.10.11,kivy==2.3.0,requests==2.31.0,Pillow==10.4.0,numpy==1.26.4

          orientation = portrait
          osx.python_version = 3
          osx.kivy_version = 2.3.0
          fullscreen = 0

          [android]
          api = 33
          minapi = 24
          ndk = 25.1.8937393
          ndk_api = 24
          archs = arm64-v8a, armeabi-v7a
          build_tools = 33.0.2

          android.skip_update = True
          android.accept_sdk_license = True
          android.allow_backup = False

          permissions = INTERNET, CAMERA, RECORD_AUDIO, WAKE_LOCK, FOREGROUND_SERVICE, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE

          android.manifest.foreground_service_type = dataSync
          android.gradle_dependencies = androidx.core:core:1.9.0, androidx.work:work-runtime:2.8.0

          android.resdir = res

          android.sdk_path = $SDK_ROOT
          android.ndk_path = $NDK_PATH

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

          echo "✅ buildozer.spec written."
          cd ..

      # ========== 10. بناء APK ==========
      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_PATH="$SDK_ROOT/ndk/25.1.8937393"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_NDK_HOME="$NDK_PATH"
          export ANDROIDNDK="$NDK_PATH"
          export ANDROIDAPI=33
          export ANDROIDMINAPI=24

          echo "=== Build Environment ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"
          echo "=========================="

          cd project
          rm -rf .buildozer
          buildozer -v android debug 2>&1 | tee build_log.txt
          cd ..

      # ========== 11. إعادة المحاولة (في حال الفشل المؤقت) ==========
      - name: Retry build if failed
        if: failure() && steps.build.outcome == 'failure'
        id: retry
        continue-on-error: true
        run: |
          set -o pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_PATH="$SDK_ROOT/ndk/25.1.8937393"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_NDK_HOME="$NDK_PATH"
          export ANDROIDNDK="$NDK_PATH"
          export ANDROIDAPI=33
          export ANDROIDMINAPI=24

          rm -rf project/.buildozer 2>/dev/null || true
          cd project
          buildozer -v android debug 2>&1 | tee -a build_log.txt
          cd ..

      # ========== 12. البحث عن APK ==========
      - name: Locate APK
        if: always()
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*.apk" -not -path "*/.buildozer/*" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -sh "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ APK found: $APK_PATH"
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ No APK found"
          fi

      # ========== 13. تحليل الأخطاء وتوليد تقرير مفصل ==========
      - name: Generate Error Analysis Report
        if: always() && steps.find_apk.outputs.status == 'failure'
        id: analyze
        run: |
          LOG_FILE="project/build_log.txt"
          REPORT_FILE="error_analysis_report.txt"

          {
            echo "═══════════════════════════════════════════════════════════════"
            echo "        🔍 BUILD ERROR ANALYSIS REPORT - Shield Core v4.2"
            echo "═══════════════════════════════════════════════════════════════"
            echo ""
            echo "📅 Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "📦 Repository: $GITHUB_REPOSITORY"
            echo "🔖 Run ID: $GITHUB_RUN_ID"
            echo ""
            echo "═══════════════════════════════════════════════════════════════"
            echo "  🚨 PRIMARY ERROR (Root Cause)"
            echo "═══════════════════════════════════════════════════════════════"
            echo ""
          } > "$REPORT_FILE"

          if [ -f "$LOG_FILE" ]; then
            # استخراج الأخطاء الرئيسية
            echo "📋 Extracted Error Lines:" >> "$REPORT_FILE"
            echo "───────────────────────────────────────────────────────────────" >> "$REPORT_FILE"
            grep -i -E "error:|exception|failed|does not exist|NoClassDefFoundError|fatal" "$LOG_FILE" | tail -n 30 >> "$REPORT_FILE"
            echo "" >> "$REPORT_FILE"

            # استخراج آخر 60 سطر من السجل
            echo "═══════════════════════════════════════════════════════════════" >> "$REPORT_FILE"
            echo "  📄 LAST 60 LOG LINES BEFORE FAILURE" >> "$REPORT_FILE"
            echo "═══════════════════════════════════════════════════════════════" >> "$REPORT_FILE"
            tail -n 60 "$LOG_FILE" >> "$REPORT_FILE"

            # تحديد السبب المحتمل
            echo "" >> "$REPORT_FILE"
            echo "═══════════════════════════════════════════════════════════════" >> "$REPORT_FILE"
            echo "  💡 POSSIBLE ROOT CAUSES" >> "$REPORT_FILE"
            echo "═══════════════════════════════════════════════════════════════" >> "$REPORT_FILE"

            if grep -qi "sdkmanager.*does not exist" "$LOG_FILE"; then
              echo "❌ sdkmanager not found in the expected path." >> "$REPORT_FILE"
              echo "   → Buildozer searches for sdkmanager in /tools/bin/ but modern" >> "$REPORT_FILE"
              echo "     SDK uses /cmdline-tools/latest/bin/." >> "$REPORT_FILE"
              echo "   → Fix: Ensure symlink is created before build." >> "$REPORT_FILE"
            fi

            if grep -qi "NoClassDefFoundError.*javax/xml/bind" "$LOG_FILE"; then
              echo "❌ JAXB (javax.xml.bind) missing - Java 11+ removed it." >> "$REPORT_FILE"
              echo "   → Buildozer is using an old sdkmanager that requires JAXB." >> "$REPORT_FILE"
              echo "   → Fix: Use cmdline-tools/latest/bin/sdkmanager instead." >> "$REPORT_FILE"
            fi

            if grep -qi "Recommended android's NDK version.*28c" "$LOG_FILE"; then
              echo "❌ NDK r28c being downloaded instead of r25b." >> "$REPORT_FILE"
              echo "   → python-for-android is ignoring android.ndk setting." >> "$REPORT_FILE"
              echo "   → Fix: Set ANDROID_NDK_HOME environment variable." >> "$REPORT_FILE"
            fi

            if grep -qi "sh.*incompatible" "$LOG_FILE"; then
              echo "❌ sh version conflict (2.4.0 vs <2.0)." >> "$REPORT_FILE"
              echo "   → Buildozer installs sh>=2.0 while p4a requires sh<2.0." >> "$REPORT_FILE"
              echo "   → Fix: Install sh<2.0 before buildozer and use --no-deps." >> "$REPORT_FILE"
            fi

          else
            echo "❌ No build_log.txt file was generated." >> "$REPORT_FILE"
          fi

          echo "" >> "$REPORT_FILE"
          echo "═══════════════════════════════════════════════════════════════" >> "$REPORT_FILE"
          echo "  📌 RECOMMENDED SOLUTIONS" >> "$REPORT_FILE"
          echo "═══════════════════════════════════════════════════════════════" >> "$REPORT_FILE"
          echo "1. Ensure sdkmanager symlink is created before build." >> "$REPORT_FILE"
          echo "2. Use cmdline-tools/latest instead of old tools/ path." >> "$REPORT_FILE"
          echo "3. Force NDK 25b by setting ANDROID_NDK_HOME." >> "$REPORT_FILE"
          echo "4. Install sh<2.0 and p4a with --no-deps." >> "$REPORT_FILE"
          echo "5. Use python-for-android==2024.1.21 not master." >> "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo "═══════════════════════════════════════════════════════════════" >> "$REPORT_FILE"

          echo "✅ Error analysis report generated: $REPORT_FILE"
          cat "$REPORT_FILE"

      # ========== 14. إرسال النتيجة إلى Telegram ==========
      - name: Send result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "❌ BOT_TOKEN or CHAT_ID is missing!"
            exit 1
          fi

          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          BUILD_STATUS="${{ steps.find_apk.outputs.status }}"

          if [ "$BUILD_STATUS" == "success" ] && [ -n "$APK_PATH" ]; then
            CAPTION="✅ *Shield Core v4.2 Success*%0A• Size: ${{ steps.find_apk.outputs.apk_size }}%0A• Arch: arm64-v8a, armeabi-v7a"
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            # إرسال ملخص سريع
            SUMMARY="❌ *Build Failed!*%0A%0A📋 *Root Cause Summary:*%0A"

            if [ -f "error_analysis_report.txt" ]; then
              # استخراج الأخطاء الرئيسية (أول 10 أسطر من الأخطاء)
              ERRORS=$(grep -i -E "❌|error:|exception|failed|does not exist" error_analysis_report.txt | head -n 6 | sed 's/"/\\"/g')
              if [ -n "$ERRORS" ]; then
                SUMMARY="${SUMMARY}\`\`\`%0A${ERRORS}%0A\`\`\`%0A%0A📄 *Full report attached below.*"
              else
                SUMMARY="${SUMMARY}Unable to extract specific errors. Full report attached."
              fi
            else
              SUMMARY="${SUMMARY}No error analysis report available."
            fi

            # إرسال رسالة الملخص
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d "chat_id=$CHAT_ID" -d "text=$SUMMARY" -d "parse_mode=Markdown"

            # إرسال التقرير المفصل كملف
            if [ -f "error_analysis_report.txt" ]; then
              curl -s -F "chat_id=$CHAT_ID" -F "document=@error_analysis_report.txt" \
                -F "caption=📊 *Detailed Error Analysis Report*" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
            fi

            # إرسال سجل البناء كملف احتياطي (مقتطع)
            if [ -f "project/build_log.txt" ]; then
              tail -n 500 project/build_log.txt > build_log_snippet.txt
              curl -s -F "chat_id=$CHAT_ID" -F "document=@build_log_snippet.txt" \
                -F "caption=📋 *Build Log (last 500 lines)*" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
            fi
          fi
