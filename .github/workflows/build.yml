name: Build APK using Buildozer Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare buildozer spec and icon
        run: |
          cd project
          # Ensure icon directory exists
          mkdir -p res/drawable
          # Create a dummy icon if not exists (to avoid missing file error)
          if [ ! -f "res/drawable/ic_launcher.png" ]; then
            echo "Creating dummy icon..."
            # Create a simple 1x1 white png using base64
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > res/drawable/ic_launcher.png
          fi
          
          # Update the spec file to use the correct icon path
          sed -i 's|^#\? \?icon.filename =.*|icon.filename = %(source.dir)s/res/drawable/ic_launcher.png|' buildozer.spec
          sed -i 's|^#\? \?icon.adaptive_foreground.filename =.*|icon.adaptive_foreground.filename = %(source.dir)s/res/drawable/ic_launcher.png|' buildozer.spec
          
          echo "Buildozer spec is ready."

      - name: Build APK
        run: |
          cd project
          buildozer -v android debug

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find project -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK found at: $APK_PATH"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: system-update-apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Send APK to Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          if [ -f "$APK_PATH" ]; then
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=✅ APK v2.0 ready!" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            echo "APK file not found for sending!"
            exit 1
          fi
