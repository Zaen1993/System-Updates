name: Build APK (No NDK Path Conflict)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
          build-essential python3-dev libsqlite3-dev libltdl-dev libgmp-dev ant libncurses5
          pip3 install --user --upgrade "cython<3.0.0" buildozer wheel setuptools
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Android SDK & NDK manually
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O clt.zip
          unzip -q clt.zip
          mv cmdline-tools latest
          # تثبيت الأدوات والـ NDK
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          # إعداد متغيرات البيئة
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$HOME/android-sdk/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          # قبول التراخيص
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses || true

      - name: Cache Buildozer data
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-v12.0-${{ hashFiles('**/buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-v12.0-

      - name: Prepare buildozer.spec (remove NDK path, keep only SDK and Ant)
        run: |
          SPEC_FILE=$(find . -name "buildozer.spec" -type f | head -n 1)
          if [ -z "$SPEC_FILE" ]; then
            echo "❌ buildozer.spec not found!"
            exit 1
          fi
          cp "$SPEC_FILE" ./buildozer.spec
          # تعيين مسار SDK فقط
          sed -i "s|^#\?android.sdk_path =.*|android.sdk_path = $HOME/android-sdk|" buildozer.spec
          # حذف أي سطر لـ android.ndk_path (لنستخدم متغير البيئة ANDROID_NDK_HOME)
          sed -i '/^android.ndk_path =/d' buildozer.spec
          sed -i 's|^#\?android.ant_path =.*|android.ant_path = /usr/bin/ant|' buildozer.spec
          # إزالة tflite-runtime مؤقتاً
          sed -i 's/,tflite-runtime==2.14.0//g' buildozer.spec
          sed -i 's/,tflite-runtime//g' buildozer.spec
          echo "✅ buildozer.spec configured"
          # تنظيف المجلدات المؤقتة التي قد تسبب تعارضاً (للتأكيد)
          rm -rf ~/.buildozer/android/platform/android-ndk-r25b

      - name: Prepare assets (model and icon)
        run: |
          mkdir -p assets res/drawable
          if [ -f "project/assets/engine_v2.tflite" ]; then
            cp "project/assets/engine_v2.tflite" assets/engine_v2.tflite
          elif [ -f "assets/engine_v2.tflite" ]; then
            echo "Model exists"
          else
            dd if=/dev/zero of=assets/engine_v2.tflite bs=1024 count=1
          fi
          if [ ! -f res/drawable/ic_launcher.png ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > res/drawable/ic_launcher.png
          fi

      - name: Clean previous builds
        run: buildozer android clean || true

      - name: Build APK
        env:
          _JAVA_OPTIONS: "-Xmx4g"
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          buildozer -v android debug 2>&1 | tee build_log.txt

      - name: Send result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          APK_PATH=$(find bin -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "✅ Build successful, sending APK..."
            curl -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" \
              -F "caption=✅ System Core v3.1.0 (AI disabled temporarily)" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
          else
            echo "❌ Build failed, sending log..."
            curl -F "chat_id=$CHAT_ID" -F "document=@build_log.txt" \
              -F "caption=❌ Build failed - Check log" \
              https://api.telegram.org/bot$BOT_TOKEN/sendDocument
            exit 1
          fi
