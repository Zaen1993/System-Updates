name: Shield Core v4.2 - AI Dynamic Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ========== 1. تنظيف المساحة ==========
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt clean
          df -h

      # ========== 2. إعداد Python و Java و Android SDK ==========
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ========== 3. تثبيت تبعيات النظام ==========
      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential python3-dev \
            libsqlite3-dev libltdl-dev libgmp-dev ant \
            libtiff-dev libjpeg-dev libpng-dev libwebp-dev liblcms2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libfreetype6

      # ========== 4. تثبيت حزم SDK المطلوبة ==========
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_ROOT" ]; then
            echo "❌ Android SDK path is empty"
            exit 1
          fi
          echo "Android SDK installed at: $SDK_ROOT"
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"
          echo "✅ Android SDK packages installed."

      # ========== 5. تثبيت Buildozer ==========
      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip wheel setuptools
          pip install "cython>=3.0.0,<3.1.0"
          pip install "sh<2.0,>=1.10"
          pip install buildozer==1.5.0

      # ========== 6. تحضير python-for-android (مستقر) ==========
      - name: Prepare pinned python-for-android (v2024.1.21)
        run: |
          set -e
          P4A_TARGET="${GITHUB_WORKSPACE}/p4a_source"
          rm -rf "$P4A_TARGET"
          mkdir -p "$P4A_TARGET"
          echo "📥 Downloading python-for-android 2024.1.21..."
          curl -sL https://github.com/kivy/python-for-android/archive/refs/tags/2024.1.21.tar.gz | tar -xz -C "$P4A_TARGET" --strip-components=1
          if [ ! -f "$P4A_TARGET/pythonforandroid/__init__.py" ]; then
            echo "❌ Failed to unpack python-for-android correctly!"
            exit 1
          fi
          echo "✅ python-for-android 2024.1.21 prepared at $P4A_TARGET"

      # ========== 7. قبول تراخيص SDK لـ Buildozer ==========
      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          LIC_DIR=~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p "$LIC_DIR"
          for HASH in 24333f8a637b3744d16de1229303181f4247e684 \
                      84831b9402116e267be31215b248a33045ce379a \
                      d97531e834a4173572f1593404534000e026d7bc \
                      cd5010c71147d17086d61884fa00c23f337d652d; do
            echo "$HASH" >> "$LIC_DIR/android-sdk-license"
          done
          echo "2737080b29717cd60468788561da5881071d9e24" > "$LIC_DIR/android-sdk-preview-license"
          echo "✅ SDK licenses accepted."

      # ========== 8. تحضير مساحة العمل وتعديل buildozer.spec ==========
      - name: Prepare workspace & modify spec
        run: |
          if [ -d "project" ]; then
            shopt -s dotglob
            cp -r project/* . 2>/dev/null || true
            rm -rf project
          fi

          mkdir -p bin res assets

          # التحقق من وجود نموذج الذكاء الاصطناعي
          if [ -f "assets/engine_v2.tflite" ]; then
            echo "✅ AI model found in assets/engine_v2.tflite"
            ls -lh assets/engine_v2.tflite
          else
            echo "❌ CRITICAL: AI model MISSING from assets/engine_v2.tflite"
            exit 1
          fi

          if [ ! -f buildozer.spec ]; then
            echo "❌ buildozer.spec not found!"
            exit 1
          fi

          # ===== تعديل requirements (إزالة tflite-runtime) =====
          sed -i 's/^requirements =.*/requirements = python3==3.10.11,hostpython3==3.10.11,kivy==2.3.0,requests==2.31.0,Pillow>=10.0.0,<11.0.0,numpy/' buildozer.spec
          sed -i 's/^android.archs =.*/android.archs = arm64-v8a, armeabi-v7a/' buildozer.spec
          sed -i 's/^version =.*/version = 4.2.0/' buildozer.spec
          sed -i 's/^source\.dir = .*/source.dir = ./' buildozer.spec

          # ===== ربط مسار p4a المحلي باستخدام p4a.source_dir فقط =====
          P4A_TARGET="${GITHUB_WORKSPACE}/p4a_source"
          sed -i '/^[[:space:]]*p4a\.directory[[:space:]]*=/d' buildozer.spec
          sed -i '/^[[:space:]]*p4a\.source_dir[[:space:]]*=/d' buildozer.spec
          echo "p4a.source_dir = $P4A_TARGET" >> buildozer.spec

          # ===== ربط مسار SDK بـ android.sdk_path =====
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          sed -i '/^[[:space:]]*android\.sdk_path[[:space:]]*=/d' buildozer.spec
          echo "android.sdk_path = $SDK_ROOT" >> buildozer.spec

          # ===== فرض NDK 25b =====
          sed -i 's/^#\? \?android.ndk =.*/android.ndk = 25b/' buildozer.spec

          # ===== ضبط SDK و API =====
          sed -i 's/^#\? \?android.api =.*/android.api = 33/' buildozer.spec
          sed -i 's/^#\? \?android.minapi =.*/android.minapi = 24/' buildozer.spec
          sed -i 's/^#\? \?android.sdk =.*/android.sdk = 33/' buildozer.spec
          sed -i 's/^#\? \?android.build_tools =.*/android.build_tools = 33.0.2/' buildozer.spec
          if grep -q "^android.ndk_api" buildozer.spec; then
            sed -i 's/^#\? \?android.ndk_api =.*/android.ndk_api = 24/' buildozer.spec
          else
            echo "android.ndk_api = 24" >> buildozer.spec
          fi

          # قبول الترخيص والصلاحيات
          sed -i 's/^#\? \?android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/^#\? \?permissions =.*/permissions = INTERNET, CAMERA, RECORD_AUDIO, WAKE_LOCK, FOREGROUND_SERVICE, READ_EXTERNAL_STORAGE, WRITE_EXTERNAL_STORAGE/' buildozer.spec

          echo "📄 Modified buildozer.spec check:"
          grep -E "requirements|android.api|android.minapi|android.ndk|android.ndk_api|android.build_tools|permissions|android.accept_sdk_license|p4a.source_dir|android.sdk_path" buildozer.spec

      # ========== 9. بناء APK ==========
      - name: Build APK
        id: build
        run: |
          set -o pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          echo "=== Build Environment ==="
          python3 --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager && sdkmanager --version || echo "sdkmanager status checked"
          echo "=========================="

          yes | buildozer -v android debug 2>&1 | tee build_log.txt

      # ========== 10. إعادة المحاولة في حال الفشل ==========
      - name: Retry build if failed
        if: failure() && steps.build.outcome == 'failure'
        id: retry
        run: |
          set -o pipefail
          echo "🔄 Retrying build after cleaning environment..."
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          export SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          rm -rf .buildozer/android/platform/build-* 2>/dev/null || true
          yes | buildozer -v android debug 2>&1 | tee -a build_log.txt

      # ========== 11. البحث عن APK ==========
      - name: Locate APK
        if: always()
        id: find_apk
        run: |
          APK_PATH=$(find bin/ -type f -name "*.apk" 2>/dev/null | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
            echo "apk_name=$(basename "$APK_PATH")" >> $GITHUB_OUTPUT
            echo "apk_size=$(du -sh "$APK_PATH" | cut -f1)" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ APK found: $APK_PATH"
          else
            echo "apk_path=" >> $GITHUB_OUTPUT
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ No APK found"
          fi

      # ========== 12. إرسال النتيجة إلى تلغرام ==========
      - name: Send result to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "❌ BOT_TOKEN or CHAT_ID is missing!"
            exit 1
          fi

          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"
          BUILD_STATUS="${{ steps.find_apk.outputs.status }}"

          if [ "$BUILD_STATUS" == "success" ] && [ -n "$APK_PATH" ]; then
            CAPTION="✅ *Shield Core v4.2 Success*%0A• Size: ${{ steps.find_apk.outputs.apk_size }}%0A• Arch: arm64-v8a, armeabi-v7a"
            curl -s -F "chat_id=$CHAT_ID" -F "document=@$APK_PATH" -F "caption=$CAPTION" -F "parse_mode=Markdown" \
              "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -d "chat_id=$CHAT_ID" -d "text=❌ *Build Failed!* Sending error logs..." -d "parse_mode=Markdown"
            if [ -f "build_log.txt" ]; then
              tail -n 1500 build_log.txt > error_report.txt
              curl -s -F "chat_id=$CHAT_ID" -F "document=@error_report.txt" -F "caption=📋 *Build Error Log*" \
                "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
            fi
          fi
