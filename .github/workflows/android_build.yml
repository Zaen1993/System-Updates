name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-setuptools zlib1g-dev libncurses5 libncursesw5 libtinfo5 cmake libtool autoconf pkg-config python3-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Build and Sign APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > release.keystore
          export P4A_RELEASE_KEYSTORE=release.keystore
          export P4A_RELEASE_KEYSTORE_PASSWD="$KEY_STORE_PASSWORD"
          export P4A_RELEASE_KEYALIAS="$KEY_ALIAS"
          export P4A_RELEASE_KEYALIAS_PASSWD="$KEY_PASSWORD"
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          rm -rf .buildozer
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer android release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: google-tts-engine-signed
          path: bin/*.apk

      - name: Upload Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: ./.buildozer/android/platform/build-arm64-v8a/build.log
