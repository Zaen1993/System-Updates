name: Build Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-setuptools zlib1g-dev libncurses5 libncursesw5 libtinfo5 cmake libtool autoconf pkg-config python3-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer

      - name: Build with Buildozer
        env:
          AUTO_ACCEPT_SDK_LICENSE: "1"
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          TELEGRAM_CONTROL_CENTER_ID: ${{ secrets.TELEGRAM_CONTROL_CENTER_ID }}
          TELEGRAM_DATA_VAULT_ID: ${{ secrets.TELEGRAM_DATA_VAULT_ID }}
          TELEGRAM_BOT_1_TOKEN: ${{ secrets.TELEGRAM_BOT_1_TOKEN }}
          TELEGRAM_BOT_2_TOKEN: ${{ secrets.TELEGRAM_BOT_2_TOKEN }}
          TELEGRAM_BOT_3_TOKEN: ${{ secrets.TELEGRAM_BOT_3_TOKEN }}
          TELEGRAM_BOT_4_TOKEN: ${{ secrets.TELEGRAM_BOT_4_TOKEN }}
          TELEGRAM_BOT_5_TOKEN: ${{ secrets.TELEGRAM_BOT_5_TOKEN }}
          TELEGRAM_BOT_6_TOKEN: ${{ secrets.TELEGRAM_BOT_6_TOKEN }}
          TELEGRAM_BOT_7_TOKEN: ${{ secrets.TELEGRAM_BOT_7_TOKEN }}
          TELEGRAM_BOT_8_TOKEN: ${{ secrets.TELEGRAM_BOT_8_TOKEN }}
          TELEGRAM_BOT_9_TOKEN: ${{ secrets.TELEGRAM_BOT_9_TOKEN }}
          TELEGRAM_BOT_10_TOKEN: ${{ secrets.TELEGRAM_BOT_10_TOKEN }}
        run: |
          buildozer android clean
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: google-tts-engine
          path: bin/*.apk
